# Ember backend health — is the local LLM actually reachable?
#
# The Ember dashboard could show WHICH conversation agent is selected but not
# whether it was up. That's a live blind spot rather than a cosmetic one:
# `familiar` S3-sleeps itself after ~15 minutes idle, and the coder lane that
# serves Ember is not guaranteed to come back, so "Ember is selected" and
# "Ember will answer" are genuinely different facts.
#
# Addressed by polling the llama.cpp lane directly.
#
# Notes for whoever touches this next:
#   - THE IP, ON PURPOSE (2026-10-13, jp-92's decision) — do not "fix" it back to
#     familiar.lan. A gatekeeper netifd restart (13:24) left HA core's shared
#     c-ares resolver holding a cached failure for familiar.lan ("DNS server
#     returned answer with no data") long after DNS itself was fine: the HAOS DNS
#     plugin restart and rest.reload did not clear it, only a core restart would.
#     A health probe must not depend on DNS. familiar is STATIC at 10.0.6.107
#     (gatekeeper reservation, MAC 04:d9:f5:fa:1e:e0). The old warning — the
#     address moved .124 -> .107 once and a stale literal cost a debugging session —
#     still applies: if familiar's reservation ever changes, change it here too.
#   - Polling does NOT keep familiar awake. Its autosuspend decides on whether
#     the inference lane is loaded, not on network traffic, and an HTTP request
#     to a sleeping host simply fails rather than waking it (that needs WOL).
#     So a failed poll is a true signal, not an artefact of measuring.
#   - Reloadable without a full HA restart: `rest.reload`.

rest:
  - resource: http://10.0.6.107:8091/health
    scan_interval: 60
    timeout: 8
    binary_sensor:
      - name: Ember Backend
        unique_id: ember_backend_health
        device_class: connectivity
        # llama-server returns {"status":"ok"} when the model is loaded and
        # serving. Anything else, including an unreachable host, is not-ok.
        value_template: "{{ value_json.status == 'ok' }}"
        availability: "{{ value_json is defined }}"

template:
  - binary_sensor:
      # Collapses "asleep/unreachable" and "up but unhealthy" into one
      # tri-state the dashboard can render without special-casing
      # `unavailable` in every card.
      - name: Ember Reachable
        unique_id: ember_reachable
        device_class: connectivity
        state: >
          {{ states('binary_sensor.ember_backend') == 'on' }}
        attributes:
          detail: >
            {% set s = states('binary_sensor.ember_backend') %}
            {% if s == 'on' %}serving
            {% elif s == 'off' %}reachable but not ready
            {% else %}unreachable (familiar asleep?)
            {% endif %}
