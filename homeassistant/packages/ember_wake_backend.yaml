# Ember wakes her own backend.
#
# THE PROBLEM (2026-08-03): the LLM that composes Ember's lines runs on
# `familiar`, which sleeps to save power. When it is asleep,
# binary_sensor.ember_reachable goes off and script.ember_announce_if_awake
# deliberately SKIPS the announcement — correct behaviour, but the pipeline
# looks "broken" and stays broken until a human presses Wake familiar.
#
# THREE LAYERS, because a cold boot takes ~30-60s and that is far too slow to
# rescue a request already in flight:
#
#   1. PROACTIVE  — someone is in the hearth room (kitchen) during waking
#                   hours => wake familiar now, so it is ready BEFORE anyone
#                   speaks. This is the layer that actually prevents the
#                   failure; the other two are safety nets.
#   2. ON-DEMAND  — the voice satellite starts listening => fire WoL. Too late
#                   for THIS utterance if it was fully asleep, but it recovers
#                   in seconds if it was only idle, and the follow-up works.
#   3. REACTIVE   — an announcement finds the backend down => wake it, wait a
#                   bounded 75s, then speak. Fine for laundry-done; the
#                   driveway herald does not use this path (latency beats
#                   poetry there — it speaks from canned lines and never
#                   needed the LLM).
#
# WoL only works because familiar's NIC has it enabled; the MAC lives in
# packages/wake_on_lan.yaml (script.wake_familiar).
#
# ---------------------------------------------------------------------------
# THE HOLD (added 2026-08-15) — why healing needs an off switch
# ---------------------------------------------------------------------------
# The three layers above make "familiar is asleep" a fault to be repaired. That
# is right when the host fell asleep on its own, and exactly wrong when a human
# just asked it to sleep: `realm wol sleep familiar` suspended the host and this
# stack woke it back up within ~75s, every time, indefinitely.
#
# Measured 2026-08-15 with tcpdump on VLAN6 — three magic packets from the HA VM
# (10.0.6.108 -> 10.0.6.255:9), at 21:21:27, 21:22:42 and 21:23:57. Exactly 75s
# apart, which is this script's own wait_template timeout: mode:single swallows
# callers while a run is in flight, so the observable cadence is the timeout and
# not the caller's real rate.
#
# familiar now sets this hold itself from its sleep hook (familiar-ml-quiesce,
# in the familiar.realm.watch repo under ops/familiar/) and clears it on resume,
# so EVERY sleep path is covered — `realm wol sleep`, `familiar-sleep`, and
# autosuspend if it is ever re-enabled — without any of them knowing about HA.
# ---------------------------------------------------------------------------
input_boolean:
  familiar_sleep_hold:
    name: "Familiar: let it sleep"
    icon: mdi:sleep

script:
  ember_wake_backend:
    alias: "Ember - wake the backend (familiar)"
    icon: mdi:server-network
    mode: single          # never stack magic packets
    max_exceeded: silent
    sequence:
      # 🛑 OPERATOR HOLD — checked FIRST, ahead of the already-serving guard.
      #    Guarding here rather than in the calling automations is deliberate:
      #    every layer funnels through this script (including the icam365 PTT
      #    taps and the reactive announce path), so one check covers all of
      #    them and no future caller can route around it.
      - if:
          - condition: state
            entity_id: input_boolean.familiar_sleep_hold
            state: "on"
        then:
          - stop: "familiar was deliberately put to sleep — standing down"
      # ⚠️ This tests for "on", not "not off", because binary_sensor.ember_backend
      #    is TRI-state: it reads `unavailable` while familiar is down, which is
      #    neither. That asymmetry is load-bearing and was measured, not assumed:
      #    on 2026-08-15 the sensor sat at `unavailable`, which correctly failed
      #    this stop-check (so the script ran) while simultaneously failing the
      #    `state: "off"` conditions on both automations below (so neither
      #    fired). If you ever "tidy" one side, tidy both.
      - if:
          - condition: state
            entity_id: binary_sensor.ember_backend
            state: "on"
        then:
          - stop: "backend already serving"
      - action: script.wake_familiar
        continue_on_error: true
      - action: system_log.write
        data:
          level: info
          logger: ember_wake
          message: "Ember backend was down — sent WoL to familiar"
      # bounded wait: succeed as soon as it serves, give up at 75s rather than
      # holding a queued script slot forever
      - wait_template: "{{ is_state('binary_sensor.ember_backend', 'on') }}"
        timeout: "00:01:15"
        continue_on_timeout: true

automation:
  - id: ember_wake_backend_proactive
    alias: "Ember: wake backend when someone's in the hearth room"
    description: >-
      The hearth satellite lives in the kitchen. If someone is in there during
      waking hours, Ember will probably be asked something — wake the backend
      now so the first request doesn't fail. mode:single + the script's own
      already-serving guard keep this cheap.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: binary_sensor.kitchen_occupancy
        to: "on"
    condition:
      - condition: state
        entity_id: binary_sensor.quiet_hours
        state: "off"
      - condition: state
        entity_id: binary_sensor.ember_backend
        state: "off"
    action:
      - action: script.ember_wake_backend
      # don't re-fire on every presence flicker
      - delay: "00:10:00"

  - id: ember_wake_backend_on_listen
    alias: "Ember: wake backend when the satellite starts listening"
    description: >-
      Belt-and-braces: the wake word fired. Too late for a cold boot to rescue
      this utterance, but it recovers a merely-idle host quickly and makes the
      follow-up question work.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: assist_satellite.ember_satellite_assist_satellite
        to: "listening"
    condition:
      - condition: state
        entity_id: binary_sensor.ember_backend
        state: "off"
    action:
      - action: script.ember_wake_backend
      - delay: "00:05:00"

  - id: familiar_sleep_hold_auto_expire
    alias: "Familiar: expire the sleep hold after 12h"
    description: >-
      A hold that never clears turns one quiet night into a permanently deaf
      Ember. familiar clears this itself on resume — this is the backstop for
      when it never comes back, or comes back without the sleep hook (e.g. a
      cold boot after a power cut, where /run state is gone).

      Caveat, stated because it is the failure mode people assume away: an
      automation `delay` does NOT survive an HA restart. If HA restarts while
      the hold is on, this timer is lost and the hold persists until something
      clears it. That is the safe direction to fail (familiar stays asleep
      rather than being woken against a human's wishes), but it does mean the
      dashboard toggle is the real off switch, not this.
    mode: restart          # re-arming the hold restarts the 12h clock
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: input_boolean.familiar_sleep_hold
        to: "on"
    action:
      - delay: "12:00:00"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.familiar_sleep_hold
