# Ember heralds a vehicle coming up the driveway.
#
# WHY THIS IS NOT LLM-COMPOSED (unlike ember_laundry_herald)
#
# A car takes seconds to reach the house; the herald's worth decays by the
# second. conversation.process costs ~2s warm and multiples of that cold, so
# this automation speaks immediately from a small rotation of canned lines.
# The laundry can wait for poetry; the driveway cannot.
#
# SOURCE: Frigate on ubox0 publishes to the HA broker (frigate/events).
# type=new fires once per tracked object, so each arriving vehicle heralds
# once. The tail delay (configurable, default 3 min) absorbs the same vehicle
# being lost and re-acquired by the tracker (new event id, same physical car)
# without suppressing a genuinely separate second arrival for long.
#
# CAMERAS: driveway only by default. The shed cam was briefly included and
# produced 26 events in one morning off ONE parked car — it watches a parking
# area, so it is a presence sensor ("is my car there?", see the Parked Cars
# section of the dashboard), not an arrival sensor. Toggle it on if you want it.
#
# QUIET HOURS: the shared house window (packages/house_config.yaml), applied
# by script.ember_broadcast — which routes quiet-hours events to Slack instead
# of speaking them, so nothing is silently dropped.
# A midnight arrival stays unheralded — Frigate still records it.

# ---------------------------------------------------------------------------
# All of it configurable from the Driveway Watch dashboard (2026-08-03).
# Per-CAMERA toggles are named ember_herald_<frigate camera name>, so adding a
# camera means adding one toggle — the condition below builds the entity id.
# ---------------------------------------------------------------------------
input_boolean:
  ember_herald_driveway:
    name: "Herald: driveway camera"
    icon: mdi:car-arrow-right
  ember_herald_shed:
    name: "Herald: shed camera"
    icon: mdi:home-variant-outline
  ember_herald_car:
    name: "Herald: car camera"
    icon: mdi:cctv
  ember_herald_vehicles:
    name: "Herald: vehicles (car/truck/moto/bike)"
    icon: mdi:car-multiple
  ember_herald_people:
    name: "Herald: people"
    icon: mdi:walk
  ember_herald_animals:
    name: "Herald: animals"
    icon: mdi:paw

input_number:
  ember_herald_cooldown:
    name: "Herald: cooldown between announcements"
    icon: mdi:timer-outline
    min: 0
    max: 30
    step: 1
    unit_of_measurement: min
    mode: box

automation:
  - id: ember_driveway_watch
    alias: "Ember: herald a vehicle in the driveway"
    description: >-
      When Frigate begins tracking a new car/truck/motorcycle on the driveway
      camera, announce it through the hearth immediately (no LLM in this path
      — latency beats poetry for arrivals).
    mode: single
    max_exceeded: silent
    trigger:
      - platform: mqtt
        topic: frigate/events
    condition:
      - condition: template
        value_template: >-
          {% set cam = trigger.payload_json.after.camera %}
          {% set lbl = trigger.payload_json.after.label %}
          {% set vehicles = ['car', 'truck', 'motorcycle', 'bicycle'] %}
          {% set animals  = ['dog', 'cat', 'bear', 'horse', 'sheep', 'cow'] %}
          {{ trigger.payload_json.type == 'new'
             and is_state('input_boolean.ember_herald_' ~ cam, 'on')
             and ( (lbl in vehicles and is_state('input_boolean.ember_herald_vehicles', 'on'))
                or (lbl == 'person' and is_state('input_boolean.ember_herald_people', 'on'))
                or (lbl in animals  and is_state('input_boolean.ember_herald_animals', 'on')) ) }}
      # Skip STATIONARY objects: a parked car that Frigate loses and
      # re-acquires fires a fresh 'new' event (26 of them one morning on the
      # shed cam = one parked car flickering). Only moving objects are
      # arrivals. This is what makes shed announcements survivable while
      # sensor.shed_car_count still reports the parked cars.
      - condition: template
        value_template: "{{ not trigger.payload_json.after.stationary | default(false) }}"
      # NOTE: the quiet-hours check moved into script.ember_broadcast, which
      # routes 22:30-07:30 events to Slack instead of aborting them (a 3am
      # visitor used to leave no trace anywhere). See ember_slack.yaml.
    variables:
      label: "{{ trigger.payload_json.after.label }}"
      place: >-
        {{ 'up the drive' if trigger.payload_json.after.camera == 'driveway'
           else 'by the shed' }}
      vehicle_lines:
        - "A {{ label }} approaches {{ place }}."
        - "Something rolls in {{ place }} — a {{ label }}, by the sound of its wheels."
        - "Visitors. A {{ label }} is coming {{ place }}."
        - "The gravel speaks: a {{ label }} draws near, {{ place }}."
      person_lines:
        - "Someone approaches on foot, {{ place }}."
        - "A walker {{ place }} — two legs, no wheels."
        - "Footsteps on the gravel. Someone comes."
      animal_lines:
        - "A {{ label }} wanders {{ place }}."
        - "Four legs on the gravel — a {{ label }}, if my eyes serve."
        - "A {{ label }} has found the driveway. It does not appear to have an appointment."
      bear_lines:
        - "A bear is on the driveway. I am a dragon, so I am not worried. You might be."
        - "Bear on the drive. I suggest admiring it from indoors."
    action:
      - action: script.ember_broadcast
        data:
          category: driveway
          # Frigate event snapshot, fetched by HA on the LAN. `snapshot.jpg`
          # is the annotated frame (bounding box), which is what makes the
          # Slack post actually useful — you can see WHAT it saw.
          image_url: >-
            http://10.0.6.11:5000/api/events/{{ trigger.payload_json.after.id }}/snapshot.jpg?bbox=1
          # bears and after-dark people reach #yurt even at home in daylight
          importance: >-
            {{ 'high' if label == 'bear'
                 or (label == 'person' and is_state('sun.sun','below_horizon'))
               else 'normal' }}
          message: >-
            {{ (bear_lines if label == 'bear'
                else animal_lines if label in ['dog', 'cat', 'horse', 'sheep', 'cow']
                else person_lines if label == 'person'
                else vehicle_lines) | random }}
      # Absorb tracker flap on the same physical vehicle; see header.
      - delay:
          minutes: "{{ states('input_number.ember_herald_cooldown') | int(3) }}"
