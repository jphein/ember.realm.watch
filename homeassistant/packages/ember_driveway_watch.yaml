# Ember heralds a vehicle coming up the driveway.
#
# WHY THIS IS NOT LLM-COMPOSED (unlike ember_laundry_herald)
#
# A car takes seconds to reach the house; the herald's worth decays by the
# second. conversation.process costs ~2s warm and multiples of that cold, so
# this automation speaks immediately from a small rotation of canned lines.
# The laundry can wait for poetry; the driveway cannot.
#
# SOURCE: Frigate on ubox0 publishes to the HA broker (frigate/events).
# type=new fires once per tracked object, so each arriving vehicle heralds
# once. The tail delay (configurable, default 3 min) absorbs the same vehicle
# being lost and re-acquired by the tracker (new event id, same physical car)
# without suppressing a genuinely separate second arrival for long.
#
# CAMERAS: driveway only by default. The shed cam was briefly included and
# produced 26 events in one morning off ONE parked car — it watches a parking
# area, so it is a presence sensor ("is my car there?", see the Parked Cars
# section of the dashboard), not an arrival sensor. Toggle it on if you want it.
#
# QUIET HOURS: the shared house window (packages/house_config.yaml), applied
# by script.ember_broadcast — which routes quiet-hours events to Slack instead
# of speaking them, so nothing is silently dropped.
# A midnight arrival stays unheralded — Frigate still records it.

# ---------------------------------------------------------------------------
# All of it configurable from the Driveway Watch dashboard (2026-08-03).
# Per-CAMERA toggles are named ember_herald_<frigate camera name>, so adding a
# camera means adding one toggle — the condition below builds the entity id.
# ---------------------------------------------------------------------------
input_boolean:
  ember_herald_driveway:
    name: "Herald: driveway camera"
    icon: mdi:car-arrow-right
  ember_herald_shed:
    name: "Herald: shed camera"
    icon: mdi:home-variant-outline
  ember_herald_car:
    name: "Herald: car camera"
    icon: mdi:cctv
  ember_herald_vehicles:
    name: "Herald: vehicles (car/truck/moto/bike)"
    icon: mdi:car-multiple
  ember_herald_people:
    name: "Herald: people"
    icon: mdi:walk
  ember_herald_animals:
    name: "Herald: animals"
    icon: mdi:paw

input_text:
  # Last Frigate track id that was heralded — one herald per track (see the condition).
  ember_herald_last_event:
    name: "Herald: last heralded track"
    max: 64
  # REPEAT-SPOT DAMPER state (2026-10-17, jp-92 GO; ha backlog #83). JSON, written only by the automations
  # below. spot = {x,y: running-mean box centre (0–1 of the 704x480 frame), n: repeats, t: last epoch s,
  # id: last counted track, sx,sy: that track's start centre, mv: it moved}; muted = {id,x,y} of the last
  # voice-muted herald. Anything unparseable reads as {} → no damping (fail-open).
  ember_herald_spot:
    name: "Herald: repeat-spot damper state"
    max: 255
  ember_herald_muted:
    name: "Herald: last muted track"
    max: 255

input_number:
  ember_herald_cooldown:
    name: "Herald: cooldown between announcements"
    icon: mdi:timer-outline
    min: 0
    max: 30
    step: 1
    unit_of_measurement: min
    mode: box

automation:
  - id: ember_driveway_watch
    alias: "Ember: herald a vehicle in the driveway"
    description: >-
      When Frigate begins tracking a new car/truck/motorcycle on the driveway
      camera, announce it through the hearth immediately (no LLM in this path
      — latency beats poetry for arrivals).
    mode: single
    max_exceeded: silent
    trigger:
      - platform: mqtt
        topic: frigate/events
    condition:
      - condition: template
        value_template: >-
          {% set cam = trigger.payload_json.after.camera %}
          {% set lbl = trigger.payload_json.after.label %}
          {% set vehicles = ['car', 'truck', 'motorcycle', 'bicycle'] %}
          {% set animals  = ['dog', 'cat', 'bear', 'horse', 'sheep', 'cow'] %}
          {#- CONFIRMED tracks only (2026-10-13, jp-92 GO; evidence: ha scratch/herald-confirm/).
              Frigate publishes `new` for tracks it later discards (they never reach its DB: the
              10-12 "walker", the 10-13 "bear" that was a black cat). `false_positive` is already
              False on every `new`, so it cannot tell them apart. has_snapshot can: over 183 captured
              tracks it was set on 13/13 Frigate KEPT (9 already on `new`, max +2.12 s) and on
              0/170 it DROPPED; the old `type == 'new'` rule heralded 169 of those 170.
              So: herald on the first new/update that has a snapshot, once per track (dedupe by id).
              No label is ever dropped — bear and person herald exactly as before, just confirmed. -#}
          {{ trigger.payload_json.type in ['new', 'update']
             and trigger.payload_json.after.has_snapshot | default(false) == true
             and trigger.payload_json.after.id != states('input_text.ember_herald_last_event')
             and is_state('input_boolean.ember_herald_' ~ cam, 'on')
             and ( (lbl in vehicles and is_state('input_boolean.ember_herald_vehicles', 'on'))
                or (lbl == 'person' and is_state('input_boolean.ember_herald_people', 'on'))
                or (lbl in animals  and is_state('input_boolean.ember_herald_animals', 'on')) ) }}
      # Skip STATIONARY objects: a parked car that Frigate loses and
      # re-acquires fires a fresh 'new' event (26 of them one morning on the
      # shed cam = one parked car flickering). Only moving objects are
      # arrivals. This is what makes shed announcements survivable while
      # sensor.shed_car_count still reports the parked cars.
      - condition: template
        value_template: "{{ not trigger.payload_json.after.stationary | default(false) }}"
      # NOTE: the quiet-hours check moved into script.ember_broadcast, which
      # routes 22:30-07:30 events to Slack instead of aborting them (a 3am
      # visitor used to leave no trace anywhere). See ember_slack.yaml.
    variables:
      label: "{{ trigger.payload_json.after.label }}"
      place: >-
        {{ 'up the drive' if trigger.payload_json.after.camera == 'driveway'
           else 'by the shed' }}
      vehicle_lines:
        - "A {{ label }} approaches {{ place }}."
        - "Something rolls in {{ place }} — a {{ label }}, by the sound of its wheels."
        - "Visitors. A {{ label }} is coming {{ place }}."
        - "The gravel speaks: a {{ label }} draws near, {{ place }}."
      person_lines:
        - "Someone approaches on foot, {{ place }}."
        - "A walker {{ place }} — two legs, no wheels."
        - "Footsteps on the gravel. Someone comes."
      animal_lines:
        - "A {{ label }} wanders {{ place }}."
        - "Four legs on the gravel — a {{ label }}, if my eyes serve."
        - "A {{ label }} has found the driveway. It does not appear to have an appointment."
      # DEMOTE, never drop (2026-10-11): a dark roadside post at box centre ≈(455,230) px of the
      # 704x480 driveway frame is detected as "person" at dusk most evenings (10-10 18:49, 10-11 17:14).
      # A suppression was REJECTED — a real child was once detected inside that window (Frigate event
      # 1791298562.388283-r841l1; ha repo scratch/oracle-stump-review.md). So the alert still fires at
      # the same importance with the snapshot attached; only the WORDING admits it may be the post.
      # Any odd/missing box data → false → normal wording (fail-open to the plain alert).
      stumpish: >-
        {% set a = trigger.payload_json.after if trigger.payload_json.after is mapping else {} %}
        {% set b = a.box if (a.box is defined and a.box is sequence and a.box is not string) else [] %}
        {% if a.camera == 'driveway' and label == 'person' and b | count == 4
              and (b | select('number') | list | count == 4)
              and a.area is defined and a.area is number and a.area > 0 %}
          {{ ((b[0] + b[2]) / 2 - 455) | abs <= 10 and ((b[1] + b[3]) / 2 - 230) | abs <= 8
             and a.area < 1000 }}
        {% else %}false{% endif %}
      # DEMOTE, never drop (2026-10-15, jp-92): after dark, a car's headlights on the SOLAR PANEL ARRAY (left of the
      # 704x480 frame, ≈ x 0–250, y 150–360) are detected as "person" (10-15 20:42, track oxgxxx, box [40,88,220,317]
      # while a car came up the drive). Same contract as stumpish: the alert still fires, same importance, snapshot
      # attached; only the WORDING admits it may be glare. Daytime boxes there keep the plain wording. Odd/missing
      # box data → false → plain wording (fail-open).
      glareish: >-
        {% set a = trigger.payload_json.after if trigger.payload_json.after is mapping else {} %}
        {% set b = a.box if (a.box is defined and a.box is sequence and a.box is not string) else [] %}
        {% if a.camera == 'driveway' and label == 'person' and b | count == 4
              and (b | select('number') | list | count == 4) %}
          {% set cx = (b[0] + b[2]) / 2 %}{% set cy = (b[1] + b[3]) / 2 %}
          {{ is_state('sun.sun', 'below_horizon') and 0 <= cx <= 250 and 150 <= cy <= 360 }}
        {% else %}false{% endif %}
      # REPEAT-SPOT DAMPER (2026-10-17, jp-92 GO; ha #83): 10-16 20:23→10-17 03:57 a cobweb on the lens
      # (IR-lit strand) was detected as 'person' 134 times in ONE spot (~45 #yurt heralds). spot_n = how
      # many confirmed person tracks (this one included) sat within 0.05 of the same spot inside 20 min
      # (30 min once at the mute tier). ≥3 → hedged wording; ≥6 → Slack-only (silent) until the spot has
      # been quiet. Computed from the counter's state so it does not race it. A track elsewhere → 0 →
      # normal. Missing/odd data → 0 → normal (fail-open). A muted track that then MOVES is spoken by
      # ember_herald_spot_mover — a walker crossing the cobweb spot is never silenced for good.
      # FLOATING-BOX GATE (Oracle review 10-17, F1/F4): only a LARGE box floating in the UPPER frame is
      # damped/counted — area ≥ 8000 px and bottom edge ≤ 300 px of 480. Measured: all 134 cobweb tracks
      # (area ≥ 8128, y2 ≤ 291) vs 0 of 28 real confirmed person tracks (a distant walker is small; a near
      # one's box reaches the ground). Without it Frigate's slow fragments of a distant walker counted as
      # 'static' and could be muted for good.
      spot_n: >-
        {% set a = trigger.payload_json.after if trigger.payload_json.after is mapping else {} %}
        {% set b = a.box if (a.box is defined and a.box is sequence and a.box is not string) else [] %}
        {% set sp = states('input_text.ember_herald_spot') | from_json(default={}) %}
        {% if a.camera == 'driveway' and label == 'person' and b | count == 4
              and (b | select('number') | list | count == 4) and sp is mapping
              and sp.x is number and sp.y is number and sp.n is number and sp.t is number
              and (b[2] - b[0]) * (b[3] - b[1]) >= 8000 and b[3] <= 300 %}
          {% set cx = (b[0] + b[2]) / 2 / 704 %}{% set cy = (b[1] + b[3]) / 2 / 480 %}
          {% set win = 1800 if sp.n >= 6 else 1200 %}
          {% if ((cx - sp.x) ** 2 + (cy - sp.y) ** 2) ** 0.5 <= 0.05 and (now().timestamp() - sp.t) <= win %}
            {{ sp.n + (0 if sp.id == a.id else 1) }}
          {% else %}0{% endif %}
        {% else %}0{% endif %}
      bear_lines:
        - "A bear is on the driveway. I am a dragon, so I am not worried. You might be."
        - "Bear on the drive. I suggest admiring it from indoors."
    action:
      # once per track: later updates of the same id must not re-herald after the cooldown
      - action: input_text.set_value
        target:
          entity_id: input_text.ember_herald_last_event
        data:
          value: "{{ trigger.payload_json.after.id }}"
      - if:
          - condition: template
            value_template: "{{ spot_n | default(0) | int(0) >= 6 }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.ember_herald_muted
            data:
              value: >-
                {% set b = trigger.payload_json.after.box %}
                {{ {'id': trigger.payload_json.after.id,
                    'x': ((b[0] + b[2]) / 2 / 704) | round(3),
                    'y': ((b[1] + b[3]) / 2 / 480) | round(3)} | to_json }}
      - action: script.ember_broadcast
        data:
          silent: "{{ spot_n | default(0) | int(0) >= 6 }}"
          category: driveway
          # Frigate event snapshot, fetched by HA on the LAN. `snapshot.jpg`
          # is the annotated frame (bounding box), which is what makes the
          # Slack post actually useful — you can see WHAT it saw.
          image_url: >-
            http://10.0.6.11:5000/api/events/{{ trigger.payload_json.after.id }}/snapshot.jpg?bbox=1
          # bears and after-dark people reach #yurt even at home in daylight
          importance: >-
            {{ 'high' if label == 'bear'
                 or (label == 'person' and is_state('sun.sun','below_horizon'))
               else 'normal' }}
          message: >-
            {% if stumpish | bool %}Someone on foot up the drive — or the roadside post fooling the camera again; check the snapshot.{% elif glareish | bool %}Someone on foot up the drive — or headlights on the solar panels; check the snapshot.{% elif spot_n | default(0) | int(0) >= 3 %}Someone on foot up the drive — the same spot again, likely a cobweb or insect on the lens; check the snapshot.{% else %}{{ (bear_lines if label == 'bear'
                else animal_lines if label in ['dog', 'cat', 'horse', 'sheep', 'cow']
                else person_lines if label == 'person'
                else vehicle_lines) | random }}{% endif %}
      # Absorb tracker flap on the same physical vehicle; see header.
      # No cooldown after a SILENT (damped) herald (Oracle F2): mode:single would otherwise block every
      # other alert — a car, a person elsewhere — for minutes, for an event nobody was told about aloud.
      - delay:
          minutes: "{{ 0 if spot_n | default(0) | int(0) >= 6 else states('input_number.ember_herald_cooldown') | int(3) }}"

  # A BEAR that Frigate never confirms (no snapshot within 5 s of `new`) is LOGGED, not spoken —
  # jp-92 2026-10-13, so a dusk misread can be tuned from data instead of scaring the house. A
  # confirmed bear still heralds through the automation above, unchanged.
  - id: ember_driveway_unconfirmed_bear_log
    alias: "Ember: log a bear Frigate never confirmed (not spoken)"
    mode: parallel
    max: 5
    trigger:
      - platform: mqtt
        topic: frigate/events
    condition:
      - condition: template
        value_template: >-
          {{ trigger.payload_json.type == 'new'
             and trigger.payload_json.after.label == 'bear'
             and not trigger.payload_json.after.has_snapshot | default(false) }}
    action:
      - variables:
          tid: "{{ trigger.payload_json.after.id }}"
          cam: "{{ trigger.payload_json.after.camera }}"
      - wait_for_trigger:
          - platform: mqtt
            topic: frigate/events
            value_template: >-
              {{ value_json.after.id == tid and value_json.after.has_snapshot | default(false) }}
        timeout: "00:00:05"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.trigger is none }}"
        then:
          - action: logbook.log
            data:
              name: "Ember herald"
              message: >-
                unconfirmed bear on {{ cam }} (track {{ tid }}) — no snapshot within 5 s, NOT spoken
              entity_id: input_boolean.ember_herald_animals

  # REPEAT-SPOT DAMPER — the counter. Every CONFIRMED driveway person track (first message with a snapshot)
  # updates the remembered spot: within 0.05 of it and inside the window → n+1 (running-mean centre);
  # spot empty or expired → this track seeds a new spot; a track ELSEWHERE while a spot is active changes
  # nothing (it neither resets the damper nor is damped — the herald speaks it normally).
  - id: ember_herald_spot_counter
    alias: "Ember: herald repeat-spot damper — count confirmed person tracks per spot"
    mode: queued
    max: 25
    trigger:
      - platform: mqtt
        topic: frigate/events
    condition:
      - condition: template
        value_template: >-
          {% set a = trigger.payload_json.after if trigger.payload_json.after is mapping else {} %}
          {% set b = a.box if (a.box is defined and a.box is sequence and a.box is not string) else [] %}
          {% set sp = states('input_text.ember_herald_spot') | from_json(default={}) %}
          {{ trigger.payload_json.type in ['new', 'update'] and a.camera == 'driveway' and a.label == 'person'
             and a.has_snapshot | default(false) == true and b | count == 4
             and (b | select('number') | list | count == 4)
             and (b[2] - b[0]) * (b[3] - b[1]) >= 8000 and b[3] <= 300
             and a.id != (sp.id if sp is mapping else '') }}
    action:
      - variables:
          new_spot: >-
            {% set a = trigger.payload_json.after %}{% set b = a.box %}
            {% set cx = ((b[0] + b[2]) / 2 / 704) | round(3) %}{% set cy = ((b[1] + b[3]) / 2 / 480) | round(3) %}
            {% set sp = states('input_text.ember_herald_spot') | from_json(default={}) %}
            {% set nt = now().timestamp() | int %}
            {% set ok = sp is mapping and sp.x is number and sp.y is number and sp.n is number and sp.t is number %}
            {% set win = (1800 if ok and sp.n >= 6 else 1200) %}
            {% set age = (nt - sp.t) if ok else 999999 %}
            {% set d = (((cx - sp.x) ** 2 + (cy - sp.y) ** 2) ** 0.5) if ok else 9 %}
            {% if ok and d <= 0.05 and age <= win %}
              {% set n = sp.n + 1 %}
              {{ {'x': ((sp.x * sp.n + cx) / n) | round(3), 'y': ((sp.y * sp.n + cy) / n) | round(3), 'n': n,
                  't': nt, 'id': a.id, 'sx': cx, 'sy': cy} | to_json }}
            {% elif not ok or age > win %}
              {{ {'x': cx, 'y': cy, 'n': 1, 't': nt, 'id': a.id, 'sx': cx, 'sy': cy} | to_json }}
            {% else %}KEEP{% endif %}
      - condition: template
        value_template: "{{ new_spot | trim != 'KEEP' }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.ember_herald_spot
        data:
          value: "{{ new_spot | trim }}"

  # REPEAT-SPOT DAMPER — the mover guard. A cobweb/insect never moves; a person does. If the last COUNTED
  # track, or the last MUTED one, drifts more than 0.05 from where it started, it is taken back out of the
  # count — and if its herald was muted, it is spoken now ("…moving after all").
  - id: ember_herald_spot_mover
    alias: "Ember: herald repeat-spot damper — a track that moves is a person (un-count, speak if muted)"
    mode: queued
    max: 25
    trigger:
      - platform: mqtt
        topic: frigate/events
    condition:
      - condition: template
        value_template: >-
          {% set a = trigger.payload_json.after if trigger.payload_json.after is mapping else {} %}
          {% set b = a.box if (a.box is defined and a.box is sequence and a.box is not string) else [] %}
          {% set sp = states('input_text.ember_herald_spot') | from_json(default={}) %}
          {% set mu = states('input_text.ember_herald_muted') | from_json(default={}) %}
          {% if trigger.payload_json.type in ['update', 'end'] and a.camera == 'driveway' and a.label == 'person'
                and b | count == 4 and (b | select('number') | list | count == 4) %}
            {% set cx = (b[0] + b[2]) / 2 / 704 %}{% set cy = (b[1] + b[3]) / 2 / 480 %}
            {% set is_sp = sp is mapping and sp.id == a.id and not sp.mv | default(false)
                           and sp.sx is number and sp.sy is number %}
            {% set is_mu = mu is mapping and mu.id == a.id and mu.x is number and mu.y is number %}
            {{ (is_sp and ((cx - sp.sx) ** 2 + (cy - sp.sy) ** 2) ** 0.5 > 0.05)
               or (is_mu and ((cx - mu.x) ** 2 + (cy - mu.y) ** 2) ** 0.5 > 0.05) }}
          {% else %}false{% endif %}
    action:
      - variables:
          tid: "{{ trigger.payload_json.after.id }}"
      - if:
          - condition: template
            value_template: >-
              {% set sp = states('input_text.ember_herald_spot') | from_json(default={}) %}
              {{ sp is mapping and sp.id == tid and sp.n is number }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.ember_herald_spot
            data:
              value: >-
                {% set sp = states('input_text.ember_herald_spot') | from_json(default={}) %}
                {{ dict(sp, n=[sp.n - 1, 0] | max, mv=true) | to_json }}
      - if:
          - condition: template
            value_template: >-
              {% set mu = states('input_text.ember_herald_muted') | from_json(default={}) %}
              {{ mu is mapping and mu.id == tid }}
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.ember_herald_muted
            data:
              value: "{}"
          - action: script.ember_broadcast
            data:
              category: driveway
              importance: "{{ 'high' if is_state('sun.sun', 'below_horizon') else 'normal' }}"
              image_url: >-
                http://10.0.6.11:5000/api/events/{{ tid }}/snapshot.jpg?bbox=1
              message: "Someone on foot up the drive — moving, so not the cobweb after all; check the snapshot."
