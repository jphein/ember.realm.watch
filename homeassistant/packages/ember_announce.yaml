# script.ember_announce — speak through Ember with the right herald.
#
# WHY THIS EXISTS
#
# `assist_satellite.announce` sends a `preannounce_media_id` unless told not
# to, and the ESPHome satellite honours it. Ember ALSO plays its own local
# `chime_announce` from flash when an announcement arrives. Leave the default
# alone and you hear HA's generic blip, then Ember's chime, back to back —
# which sounds like a firmware bug and isn't.
#
# Ember's local chime is the better herald on every axis: it's in flash so
# there's no network fetch, it's instant, it's on the same F-pentatonic as
# every other tone on the device, and it can't fail because HA's media server
# is busy. So the correct call is always `preannounce: false`.
#
# Rather than rely on every future automation remembering that, call this
# script instead of the raw service. `preannounce: false` is not optional here.
#
# WHERE THIS SITS IN THE CHAIN. Automations do NOT call this directly any more —
# they call `script.ember_broadcast` (packages/ember_slack.yaml), which decides
# whether the event is spoken or routed to Slack during quiet hours, and only
# then lands here. So this script is the *terminal speaker*, and it is the right
# place for "which box makes the sound" and the wrong place for "should this be
# spoken at all".
#
#   ember_driveway_watch / ember_laundry_herald
#        -> script.ember_broadcast   (quiet hours? -> Slack)
#             -> script.ember_announce[_if_awake]   (this file)
#                  -> assist_satellite.announce
#
# THERE ARE TWO EMBERS NOW (2026-08-03, issue #44)
#
#   assist_satellite.ember_satellite_assist_satellite   the desk unit
#   assist_satellite.ember_mobile_assist_satellite      the 18650 / portable unit
#
# The `satellite` field DEFAULTS TO THE DESK UNIT, and that default is
# load-bearing: every existing caller passes `message` only, and they must keep
# behaving exactly as they did when there was one Ember. A default of "both"
# would have turned every existing automation into a two-room announcement
# without anyone asking for it.
#
# ⚠️ Announcing to the MOBILE unit is not equivalent to announcing to the desk
# unit, for a reason no amount of config can fix: it is portable, so it may be
# in another room, in a drawer, or flat. `assist_satellite.announce` to an
# unavailable satellite fails the action rather than queueing it — so anything
# that MUST be heard should target the desk unit (the default) or use
# ember_announce_all, never the mobile unit alone.

# The Hearth-view composer's target chooser (JP, 2026-08-09). ember_say
# consults it ONLY when no explicit `satellite` field is passed — dashboard
# buttons that name a hearth (the Fleet composer) are unaffected by it.
# Options are friendly names; the mapping to entities lives in ember_say,
# next to the code that uses it. Adding hearth #4: new option here, one line
# in ember_say's map, and the chooser covers it everywhere at once.
input_select:
  ember_say_target:
    name: Ember - who speaks the text field
    icon: mdi:bullhorn-variant
    options:
      - Desk
      - Mobile
      - Dad's house
      - Every hearth (house)

script:
  ember_announce:
    alias: Ember - announce
    mode: queued
    max: 10
    fields:
      message:
        name: Message
        description: What Ember should say out loud.
        required: true
        selector:
          text:
            multiline: true
      satellite:
        name: Satellite
        description: >
          Which Ember speaks. Defaults to the desk unit, which is what every
          pre-existing caller expects. Name a satellite entity to mean another
          hearth — the portable (assist_satellite.ember_mobile_assist_satellite)
          or Dad's house (assist_satellite.ember_dad_assist_satellite,
          commissioned 2026-08-09).
        required: false
        selector:
          entity:
            domain: assist_satellite
    sequence:
      - action: assist_satellite.announce
        target:
          entity_id: >
            {{ satellite | default('assist_satellite.ember_satellite_assist_satellite', true) }}
        data:
          message: "{{ message }}"
          # >>> Do not remove. Without it HA prepends its own generic chime and
          #     JP hears two heralds. See the header. <<<
          preannounce: false

  # Every hearth IN THIS HOUSE at once. Deliberately NOT the default for
  # ember_announce — see the header.
  #
  # ⚠️ ember-dad (commissioned 2026-08-09) is EXCLUDED on purpose, not by
  # staleness: that hearth lives at Dad's house, and this script's callers are
  # house automations (driveway herald, laundry watch). "Every hearth" means
  # every hearth under this roof — a 2 a.m. driveway alert has no business
  # speaking in another household. Reach Dad's hearth explicitly via the
  # `satellite:` field on ember_announce, or the Slack bridge's `dad` route
  # (~/Projects/ha/docs/slack-bridge.md). A fourth IN-HOUSE board, when it
  # arrives, DOES belong in the parallel block below — add its own branch
  # (parallel is load-bearing, see the warning that follows).
  #
  # ⚠️ `parallel:` IS LOAD-BEARING, AND THE SEQUENTIAL VERSION WAS A REAL BUG
  # (found and fixed during the mobile unit's bring-up, 2026-08-03). Written as
  # two ordered steps with `continue_on_error: true`, this script hung: the desk
  # unit went to `responding` and never reported completion,
  # `assist_satellite.announce` blocks until it does, and step 2 therefore never
  # ran. The mobile unit was healthy the whole time and simply never got asked.
  #
  # The lesson is that `continue_on_error` catches an ERROR, not a HANG — a call
  # that never returns is not an error, and no amount of error handling reaches
  # it. Two satellites are not two steps; they are two independent deliveries,
  # and the config has to say so. Under `parallel:` one wedged satellite costs
  # its own branch and nothing else.
  #
  # Do not "tidy" this back into a sequence. It looks equivalent and is not.
  ember_announce_all:
    alias: Ember - announce on every hearth in the house
    mode: queued
    max: 10
    fields:
      message:
        name: Message
        required: true
        selector:
          text:
            multiline: true
    sequence:
      - parallel:
          - action: assist_satellite.announce
            continue_on_error: true
            target:
              entity_id: assist_satellite.ember_satellite_assist_satellite
            data:
              message: "{{ message }}"
              preannounce: false
          - action: assist_satellite.announce
            continue_on_error: true
            target:
              entity_id: assist_satellite.ember_mobile_assist_satellite
            data:
              message: "{{ message }}"
              preannounce: false

  # Same thing, but refuses when the local model can't answer — for
  # announcements whose whole point is that Ember is available. Uses the
  # reachability sensor from ember_backend_health.yaml.
  ember_announce_if_awake:
    alias: Ember - announce if awake
    mode: queued
    max: 10
    fields:
      message:
        name: Message
        required: true
        selector:
          text:
            multiline: true
      satellite:
        name: Satellite
        description: >
          Passed straight through to script.ember_announce; defaults to the desk
          unit there. Present so the awake-guard and the target choice compose.
          The one special value (same convention as ember_say): "all" fans out
          via ember_announce_all — every hearth in THIS house, Dad's excluded.
        required: false
        selector:
          entity:
            domain: assist_satellite
    sequence:
      - if:
          - condition: state
            entity_id: binary_sensor.ember_reachable
            state: "on"
        then:
          - if:
              - condition: template
                value_template: "{{ satellite | default('', true) | trim == 'all' }}"
            then:
              - action: script.ember_announce_all
                data:
                  message: "{{ message }}"
            else:
              - action: script.ember_announce
                data:
                  message: "{{ message }}"
                  satellite: "{{ satellite | default('', true) }}"
        else:
          # Backend asleep: wake it and retry once (packages/ember_wake_backend.yaml).
          # Added 2026-08-03 — this used to just skip, so a sleeping `familiar`
          # made the whole pipeline look broken until a human hit Wake familiar.
          - action: script.ember_wake_backend
            continue_on_error: true
          - if:
              - condition: state
                entity_id: binary_sensor.ember_reachable
                state: "on"
            then:
              - if:
                  - condition: template
                    value_template: "{{ satellite | default('', true) | trim == 'all' }}"
                then:
                  - action: script.ember_announce_all
                    data:
                      message: "{{ message }}"
                else:
                  - action: script.ember_announce
                    data:
                      message: "{{ message }}"
                      satellite: "{{ satellite | default('', true) }}"
              - stop: "spoke after waking the backend"
          - action: system_log.write
            data:
              level: warning
              logger: ember_announce
              message: >
                Skipped announcement, Ember unreachable even after WoL
                ({{ state_attr('binary_sensor.ember_reachable', 'detail') }}):
                {{ message }}

  # Speak whatever is in input_text.ember_say. Exists because Lovelace's
  # perform_action data is not templated, so a dashboard button cannot pass a
  # text field's value — it can only call a script that reads it.
  #
  # 2026-08-09: grew a `satellite` field for the Fleet composer (three hearths
  # now, three more coming). No caller passed one before, and the default is
  # unchanged (empty -> ember_announce's own desk default), so pre-existing
  # buttons behave identically. The one special value: satellite = "all"
  # fans out via ember_announce_all — which is EVERY HEARTH IN THIS HOUSE,
  # deliberately excluding Dad's (see that script's comment for the why).
  ember_say:
    alias: Ember - say the text field
    mode: queued
    max: 5
    fields:
      satellite:
        name: Satellite
        description: >
          Which hearth speaks the text field. Empty = the desk unit (what
          every pre-existing caller expects). "all" = every hearth in the
          house via ember_announce_all (Dad's is deliberately not included).
        required: false
        selector:
          entity:
            domain: assist_satellite
    sequence:
      - condition: template
        value_template: "{{ states('input_text.ember_say') | trim not in ['', 'unknown', 'unavailable'] }}"
      # Resolution order: explicit field > the Hearth-view chooser > desk.
      # The chooser branch is what makes the front page's ONE speak button
      # target any hearth; buttons that pass `satellite` explicitly (Fleet
      # composer) ignore the chooser on purpose — a per-hearth button that
      # obeyed a dropdown somewhere else would be lying about its label.
      - variables:
          resolved: >-
            {% set explicit = satellite | default('', true) %}
            {% if explicit %}{{ explicit }}
            {% else %}{{ {'Desk': '',
                          'Mobile': 'assist_satellite.ember_mobile_assist_satellite',
                          "Dad's house": 'assist_satellite.ember_dad_assist_satellite',
                          'Every hearth (house)': 'all'}.get(states('input_select.ember_say_target'), '') }}
            {% endif %}
      - if:
          - condition: template
            value_template: "{{ resolved | trim == 'all' }}"
        then:
          - action: script.ember_announce_all
            data:
              message: "{{ states('input_text.ember_say') }}"
        else:
          - action: script.ember_announce
            data:
              message: "{{ states('input_text.ember_say') }}"
              satellite: "{{ resolved | trim }}"
