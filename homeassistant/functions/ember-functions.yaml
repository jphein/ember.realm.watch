# Ember's tool definitions — the source of truth for the conversation subentry's
# `functions` field.
#
# WHERE THIS ACTUALLY LIVES: not in any YAML file Home Assistant reads. It is a
# YAML *string* stored inside HA's `.storage`, in the Extended OpenAI
# Conversation subentry, exactly like the system prompt. Deploy it with
#
#     homeassistant/tools/ember-toolkit.py --deploy
#
# which drives the same config-subentry reconfigure flow ember-prompt.py uses:
# live, no HA restart. Committing this file changes nothing on its own.
#
# The deploy REPLACES the field wholesale, so this file must always contain the
# complete list — the stock four included. Dropping `execute_services` would
# silently disable Ember's ability to control the house.
- spec:
    name: execute_services
    description: Execute service in Home Assistant.
    parameters:
      type: object
      properties:
        delay:
          type: object
          description: Time to wait before execution
          properties:
            hours:
              type: integer
              minimum: 0
            minutes:
              type: integer
              minimum: 0
            seconds:
              type: integer
              minimum: 0
        list:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
                description: The domain of the service.
              service:
                type: string
                description: The service to be called
              service_data:
                type: object
                description: The service data object to indicate what to control.
                properties:
                  entity_id:
                    type: array
                    items:
                      type: string
                      description: The entity_id retrieved from available devices.
                        It must start with domain, followed by dot character.
                  area_id:
                    type: array
                    items:
                      type: string
                      description: The id retrieved from areas. You can specify only
                        area_id without entity_id to act on all entities in that area
            required:
            - domain
            - service
            - service_data
  function:
    type: native
    name: execute_service
- spec:
    name: get_attributes
    description: Get attributes of entity or multiple entities.
    parameters:
      type: object
      properties:
        entity_id:
          type: array
          description: entity_id of entity or multiple entities
          items:
            type: string
      required:
      - entity_id
  function:
    type: template
    value_template: '```csv

      entity,attributes

      {%for entity in entity_id%}

      {{entity}},{{states[entity].attributes}}

      {%endfor%}

      ```'
- spec:
    name: load_skill
    description: Load a file from a skill's directory.
    parameters:
      type: object
      properties:
        name:
          type: string
          description: Skill name
        file:
          type: string
          description: Relative file path within the skill directory
      required:
      - name
      - file
  function:
    type: read_file
    path: '{{extended_openai.skill_dir(name)}}/{{file}}'
- spec:
    name: bash
    description: Execute a bash command in workspace.
    parameters:
      type: object
      properties:
        command:
          type: string
          description: Bash command to execute
      required:
      - command
  function:
    type: bash
    command: '{{command}}'

# ─── Ember toolkit, added 2026-08-02 ─────────────────────────────────────────
# Everything above this line is the integration's stock set and is deployed
# verbatim; everything below is this repo's.
#
# House style for these tools: a tool returns FACTS as `key=value`, not a
# finished sentence. Ember has a voice — plain prose, British, one sentence —
# and it is defined in the system prompt, not here. A tool that returns polished
# prose fights the persona and wins, which is how a hearth-spirit ends up saying
# "state=Printing; percent=60".
#
# Nothing here may hold a credential: this list lives in HA's `.storage` and is
# parsed with plain `yaml.safe_load`, which does not understand `!secret`.
# Secret-bearing calls go through packages/ember_toolkit.yaml instead.

- spec:
    name: check_print
    description: >-
      How the 3D print is going. Whether anything is printing, which file, how far
      along it is, and how much time is left. Use this for any question about the
      printer, a print, or when something will be finished.
    parameters:
      type: object
      properties: {}
  function:
    # A template over the polled sensor, NOT a live HTTP call: a wedged or
    # sleeping print host must not be able to stall a voice turn. The sensor is
    # in packages/ember_toolkit.yaml, which is also where the API key lives.
    type: template
    value_template: >-
      {%- set e = 'sensor.ember_print_job' -%}
      {%- set s = states(e) -%}
      {%- if s in ['unknown', 'unavailable', 'none', ''] -%}
      printer_unreachable=true; I cannot tell what the printer is doing.
      {%- elif s in ['Printing', 'Paused'] -%}
      {%- set p = state_attr(e, 'progress') or {} -%}
      {%- set j = state_attr(e, 'job') or {} -%}
      {%- set f = ((j.file or {}).display or 'an unnamed file')
            | regex_replace('\.gcode$', '')
            | regex_replace('_[0-9a-f]{6,}$', '')
            | replace('_', ' ') | replace('-', ' ') -%}
      {%- set pct = (p.completion | default(0, true)) | round(0) | int -%}
      {%- set left = (p.printTimeLeft | default(0, true)) | int -%}
      {%- set h = (left // 3600) | int -%}
      {%- set m = ((left % 3600) // 60) | int -%}
      state={{ s }}; file={{ f }}; percent={{ pct }};
      time_left={% if left <= 0 %}unknown{% elif h > 0 %}{{ h }} hour{{ 's' if h != 1 }}{% if m > 0 %} {{ m }} minute{{ 's' if m != 1 }}{% endif %}{% else %}{{ m }} minute{{ 's' if m != 1 }}{% endif %}
      {%- else -%}
      state={{ s }}; nothing is printing.
      {%- endif -%}

- spec:
    name: realm_status
    description: >-
      Whether the machines and network gear of the house are up. Use for "is
      familiar up", "is anything down", or a general check on the servers. Call it
      with no host for an overview of everything watched.
    parameters:
      type: object
      properties:
        host:
          type: string
          description: >-
            Optional single machine to check, for example familiar, katana, ubox0,
            gatekeeper. Leave out for an overview.
  function:
    # Reads Home Assistant's own connectivity sensors — real ICMP probes it
    # already runs. An unwatched host is reported as unwatched, never guessed.
    #
    # This originally avoided realmwatch because realmwatch was lying: its /status
    # `wol` map called 16 of 70 hosts "dark" while they answered ping, and its
    # /topology listed familiar at serialhub's address. Both were fixed upstream on
    # 2026-08-02 (realmwatch#122) and the wol lane now measures 0 of 70 wrong, so
    # `realm_query` is wired to it. This tool still stays on HA's own probes on
    # purpose: it is a second, independent opinion, and the cheapest way to catch
    # the next instrument that starts lying is to not have both answers come from
    # the same place.
    type: template
    value_template: >-
      {%- set want = (host | default('', true)) | lower | trim | replace(' ', '_') | replace('.lan', '') -%}
      {%- set ns = namespace(rows=[]) -%}
      {%- for e in states.binary_sensor
            | selectattr('entity_id', 'match', 'binary_sensor\.infra_')
            | sort(attribute='entity_id') -%}
      {%-   set n = e.entity_id | replace('binary_sensor.infra_', '') -%}
      {%-   set up = 'up' if e.state == 'on' else ('down' if e.state == 'off' else 'not reporting') -%}
      {%-   set ns.rows = ns.rows + [{'name': n, 'up': up}] -%}
      {%- endfor -%}
      {%- set mind = state_attr('binary_sensor.ember_reachable', 'detail') -%}
      {%- if want -%}
      {%-   set hit = ns.rows | selectattr('name', 'equalto', want) | list -%}
      {%-   if hit -%}
      {{ want | replace('_', ' ') }}={{ hit[0].up }}
      {%-     if want == 'familiar' and mind %}; my own mind, the model lane={{ mind }}{% endif -%}
      {%-   else -%}
      not_watched={{ want | replace('_', ' ') }}; I only watch: {{ ns.rows | map(attribute='name') | map('replace', '_', ' ') | join(', ') }}
      {%-   endif -%}
      {%- else -%}
      {%-   set down = ns.rows | rejectattr('up', 'equalto', 'up') | list -%}
      {%-   if down -%}
      watched={{ ns.rows | count }}; down={{ down | map(attribute='name') | map('replace', '_', ' ') | join(', ') }}
      {%-   else -%}
      watched={{ ns.rows | count }}; all up
      {%-   endif -%}
      {%-   if mind %}; my own mind, the model lane={{ mind }}{% endif -%}
      {%- endif -%}

- spec:
    name: palace_recall
    description: >-
      Search JP's memory palace: notes, decisions, problems and references written
      down from his projects. Use when asked what was decided, why something is the
      way it is, or what happened before. This is written history, not live device
      state — for what a device is doing right now, use the other tools.
    parameters:
      type: object
      properties:
        query:
          type: string
          description: What to look for, in a few plain words.
        wing:
          type: string
          description: >-
            Optional project to narrow the search to, for example
            familiar_realm_watch, ember_realm_watch, realmwatch. Pass it whenever
            the question is clearly about one project — unfiltered relevance is
            noticeably worse.
      required:
        - query
  function:
    type: script
    sequence:
      # `continue_on_error` because `familiar` S3-sleeps and hosts the palace.
      # A sleeping palace must produce "I could not reach it", never a fabricated
      # memory and never a raised error mid-conversation.
      - action: rest_command.palace_search
        data:
          query: "{{ query }}"
          limit: 3
          wing: "{{ wing | default('', true) }}"
        response_variable: hits
        continue_on_error: true
      - variables:
          _function_result: >-
            {%- set ok = hits is defined and (hits.status | default(0)) == 200 -%}
            {%- set rows = hits.content if (ok and hits.content is sequence and hits.content is not string) else [] -%}
            {%- set ns = namespace(seen=[], out=[]) -%}
            {%- for r in rows -%}
            {%-   set raw = (r.snippet | default('', true)) -%}
            {#-   Drawers written as skill files start with YAML frontmatter, whose
                  `description` is a hand-written one-line summary — far better to
                  speak than the raw body. Fall back to the body otherwise. -#}
            {%-   set desc = raw | regex_findall('description:\s*"([^"]{10,400})"') -%}
            {%-   set line = (desc[0] if desc else raw) | replace('\n', ' ') | regex_replace('\s+', ' ')
                    | regex_replace('^[-\s]*name:\s*\S+\s*', '') | trim -%}
            {#-   Dedupe on the TEXT, not on the drawer id: the palace holds genuine
                  duplicate drawers with different ids and identical content, so
                  id-dedupe returns the same memory twice. Measured 2026-08-02. -#}
            {%-   if line[:80] not in ns.seen and line | length > 0 -%}
            {%-     set ns.seen = ns.seen + [line[:80]] -%}
            {%-     set ns.out = ns.out + [(r.wing | default('?', true)) ~ ' / ' ~ (r.room | default('?', true)) ~ ': ' ~ line[:170]] -%}
            {%-   endif -%}
            {%- endfor -%}
            {%- if ns.out -%}
            found={{ ns.out | count }}
            {% for o in ns.out %}- {{ o }}
            {% endfor %}
            {%- elif not ok -%}
            palace_unreachable=true; the palace did not answer, familiar may be asleep.
            {%- else -%}
            found=0; nothing in the palace matched that.
            {%- endif -%}

- spec:
    name: look_at_camera
    description: >-
      Put a live camera snapshot on screen for JP and report how fresh the frame is.
      You CANNOT see the picture yourself, so never describe what is in it and never
      guess at what it shows — say that you have put it up, and how old the frame is.
      Cameras: parking, road, car, printer, printroom.
    parameters:
      type: object
      properties:
        camera:
          type: string
          description: Which camera to show.
          enum:
            - parking
            - road
            - car
            - printer
            - printroom
      required:
        - camera
  function:
    type: script
    sequence:
      - action: rest_command.spyglass_cams
        response_variable: cams
        continue_on_error: true
      - variables:
          # Validated against a fixed list rather than interpolated straight into
          # a URL. The model chooses this value, and an unchecked value would be
          # a request-forgery seam through Spyglass.
          cam: >-
            {%- set c = (camera | default('', true)) | lower | trim -%}
            {{ c if c in ['parking', 'road', 'car', 'printer', 'printroom'] else '' }}
          info: >-
            {%- set ok = cams is defined and (cams.status | default(0)) == 200 -%}
            {{ ((cams.content or {}).cams or {}) if ok else {} }}
      - variables:
          entry: "{{ info.get(cam, {}) if cam and info else {} }}"
      - choose:
          - conditions: "{{ cam != '' and (entry.ok | default(false)) }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "Ember — {{ entry.label | default(cam, true) }}"
                  # ?fresh=1 forces Spyglass to pull a live frame rather than
                  # serving its poll cache, so what JP opens is what is there now.
                  message: >-
                    ![{{ entry.label | default(cam, true) }}](http://ubox0.lan:8300/cam/{{ cam }}.jpg?fresh=1)
                  notification_id: "ember_camera_{{ cam }}"
      - variables:
          _function_result: >-
            {%- if cam == '' -%}
            unknown_camera=true; the cameras are parking, road, car, printer and printroom.
            {%- elif not info -%}
            cameras_unreachable=true; Spyglass did not answer, so I could not put anything up.
            {%- elif entry.ok | default(false) -%}
            shown={{ cam }}; label={{ entry.label | default(cam, true) }}; frame_age_seconds={{ (entry.age | default(0, true)) | round(1) }}; where=posted to the Home Assistant notifications, JP should look there now; say_you_have_put_it_up=true; you_cannot_see_it=true; do_not_describe_the_image=true
            {%- else -%}
            camera_down={{ cam }}; reason={{ entry.error | default('not responding', true) }}; nothing_placed=true
            {%- endif -%}

- spec:
    name: whos_home
    description: >-
      Who is at home right now. Use for "is anyone home", "is JP back", "who's in".
    parameters:
      type: object
      properties: {}
  function:
    # A template, not `get_attributes`: `person.*` is NOT in your device manifest,
    # and `get_attributes` refuses any entity that is not exposed. Template
    # functions read state directly, which is the only route to this data.
    type: template
    value_template: >-
      {%- set ns = namespace(rows=[]) -%}
      {%- for p in states.person | sort(attribute='entity_id') -%}
      {%-   set where = 'home' if p.state == 'home' else ('out' if p.state == 'not_home' else p.state) -%}
      {%-   set ns.rows = ns.rows + [(p.name | default(p.entity_id, true)) ~ '=' ~ where] -%}
      {%- endfor -%}
      {%- if ns.rows -%}
      tracked_people={{ ns.rows | count }}; {{ ns.rows | join('; ') }}
      {%- else -%}
      tracked_people=0; nobody is set up as a person in this house.
      {%- endif -%}

- spec:
    name: weather_now
    description: >-
      The weather outside now, and today's high, low and chance of rain. Use for any
      question about the weather, the temperature outside, or whether it will rain.
    parameters:
      type: object
      properties: {}
  function:
    type: script
    sequence:
      # `weather.forecast_home_2` (met.no) and NOT `weather.home`. Measured
      # 2026-08-02 at 20:38 local: `weather.home` reported "sunny, 83F" well after
      # dark while met.no reported "clear-night, 55F". One of those two is a
      # sensor that will make Ember sound like it has never been outside.
      #
      # The forecast comes from a service call because modern HA weather entities
      # no longer carry a `forecast` attribute — reading `state_attr(...,
      # 'forecast')` returns nothing at all rather than failing loudly.
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home_2
        data:
          type: daily
        response_variable: fc
        continue_on_error: true
      - variables:
          _function_result: >-
            {%- set e = 'weather.forecast_home_2' -%}
            {%- set now_state = states(e) | replace('-', ' ') -%}
            {%- set now_temp = state_attr(e, 'temperature') -%}
            {%- set days = ((fc | default({}, true)).get(e, {}).get('forecast', [])) if fc is defined else [] -%}
            {%- set today = days[0] if days | count > 0 else {} -%}
            now={{ now_state }}; temperature_now={{ now_temp | default('unknown', true) }}F
            {%- if today %}; today_high={{ today.temperature | default('?', true) }}F; today_low={{ today.templow | default('?', true) }}F; today_condition={{ (today.condition | default('?', true)) | replace('-', ' ') }}; rain_mm={{ today.precipitation | default(0, true) }}
            {%- else %}; forecast_unavailable=true
            {%- endif -%}

- spec:
    name: realm_query
    description: >-
      Realmwatch, the fantasy map of JP's homelab: which machines are awake, what
      has been happening on the network, the open quests, and the in-world persona
      of a given machine. Use for "how's the realm", "what happened overnight",
      "any open quests", "tell me about the gatekeeper". This is the realm's own
      lore and game layer; for a plain up/down answer about one machine, realm_status
      is faster and independent.
    parameters:
      type: object
      properties:
        topic:
          type: string
          description: >-
            Which view to fetch. overview = realm scale, threats and quest counts.
            power = which machines are awake, dark or unmeasured. events = what
            recently happened. quests = the open quests. node = plain facts about
            one machine. persona = a machine's in-world name and title.
          enum: [overview, power, events, quests, node, persona]
        name:
          type: string
          description: >-
            Machine name, for topic=node or topic=persona. For example gatekeeper,
            katana, familiar, serialhub.
        limit:
          type: integer
          description: How many events or quests to return. Default 10, max 25.
      required: [topic]
  function:
    # `katana.lan`, not `katana`. Measured 2026-08-02 from the HA VM: the bare name
    # does not resolve there (HAOS ships no LAN search domain) while the FQDN answers
    # in 14ms. Not an IP either — realmwatch moved hosts once already and a literal
    # would rot the same way its own topology did.
    #
    # Realmwatch's :80 is unauthenticated on the LAN, so this tool carries no
    # credential — which is the only reason it can be a `rest` tool at all. This
    # list is parsed with plain `yaml.safe_load` and cannot hold a `!secret`.
    #
    # Every endpoint below was curl'd and compared against ground truth before being
    # wired up (see the realm-watch skill for the audit). Deliberately NOT used:
    # `/player`, which disagrees with `/api/hud` about the player's own level (11 vs
    # 13) because it reads the pre-absorption realm.db rather than the game.db the
    # RPG layer actually owns. Two endpoints, one question, two answers — so this
    # tool asks only the one that owns the data.
    type: rest
    timeout: 8
    resource_template: >-
      {%- set n = (name | default('', true)) | lower | trim | replace(' ', '-') | replace('.lan', '') -%}
      {%- set lim = [(limit | default(10, true)) | int, 25] | min -%}
      {%- if topic == 'overview' -%}http://katana.lan:80/api/hud
      {%- elif topic == 'power' -%}http://katana.lan:80/plugins/wol/status
      {%- elif topic == 'events' -%}http://katana.lan:80/events?limit={{ lim }}
      {%- elif topic == 'quests' -%}http://katana.lan:80/quests
      {%- elif topic == 'persona' -%}http://katana.lan:80/personas
      {%- else -%}http://katana.lan:80/topology
      {%- endif -%}
    value_template: >-
      {%- set n = (name | default('', true)) | lower | trim | replace(' ', '-') | replace('.lan', '') -%}
      {%- set lim = [(limit | default(10, true)) | int, 25] | min -%}
      {%- if topic == 'overview' -%}
      {%-   set p = value_json.player | default({}, true) -%}
      {%-   set q = value_json.quest | default({}, true) -%}
      {%-   set t = value_json.threats | default({}, true) -%}
      {%-   set r = value_json.realm | default({}, true) -%}
      entities={{ r.entities | default(0, true) }}; events_last_24h={{ r.events_24h | default(0, true) }};
      quests_active={{ r.quests_active | default(0, true) }}; threats={{ t.count | default(0, true) }}
      {%- if (t.count | default(0, true)) | int > 0 %}; worst_threat_severity={{ t.max_severity | default(0, true) }}{% endif -%}
      {%- if p %}; watcher={{ p.name | default('the Watcher', true) }}; watcher_level={{ p.level | default('?', true) }}{% endif -%}
      {%- if q %}; current_quest={{ q.title | default('none', true) }}{% endif -%}
      {%- elif topic == 'power' -%}
      {%-   set hosts = value_json.hosts | default([], true) -%}
      {%-   set awake = hosts | selectattr('state', 'equalto', 'awake') | list -%}
      {%-   set dark = hosts | selectattr('state', 'equalto', 'dark') | list -%}
      {%-   set unknown = hosts | selectattr('state', 'equalto', 'unknown') | list -%}
      {%-   set sleeping = hosts | selectattr('state', 'equalto', 'slumbering') | list -%}
      awake={{ awake | count }}; dark={{ dark | count }}; unmeasured={{ unknown | count }}
      {%- if sleeping %}; slumbering={{ sleeping | map(attribute='host') | join(', ') }}{% endif -%}
      {%- if dark %}; dark_hosts={{ dark | map(attribute='host') | join(', ') }}{% endif %};
      note=unmeasured means never successfully probed, not down — do not report those as down.
      {%- elif topic == 'events' -%}
      {%-   set evs = (value_json | default([], true))[:lim] -%}
      {%-   if evs -%}
      events={{ evs | count }};
      {%      for e in evs %}[{{ e.type | default('event', true) }}] {{ e.node | default('realm', true) }}: {{ (e.text | default('', true)) | regex_replace('[^\x00-\x7F]+', '') | trim | truncate(150, true, '') }}
      {%      endfor -%}
      {%-   else -%}
      events=0; nothing has been recorded.
      {%-   endif -%}
      {%- elif topic == 'quests' -%}
      {%-   set active = (value_json | default([], true)) | selectattr('status', 'equalto', 'active') | list -%}
      {%-   set shown = active[:lim] -%}
      quests_active={{ active | count }}; showing={{ shown | count }};
      {%    for q in shown %}- {{ (q.title | default('untitled', true)) | regex_replace('[^\x00-\x7F]+', '') | trim }}{% if q.description %}: {{ (q.description) | regex_replace('[^\x00-\x7F]+', '') | trim | truncate(120, true, '') }}{% endif %}
      {%    endfor -%}
      {%-   if not active %}no open quests.{% endif -%}
      {%- elif topic == 'persona' -%}
      {%-   set pj = value_json | default({}, true) -%}
      {%-   if n and n in pj -%}
      {%-     set p = pj[n] -%}
      node={{ n }}; persona_name={{ p.name | default(n, true) }}; title={{ p.title | default('untitled', true) }}
      {%- if p.hints %}; flavour={{ (p.hints | string) | replace('[', '') | replace(']', '') | replace("'", '') | trim }}{% endif -%}
      {%-   else -%}
      node={{ n | default('(none given)', true) }}; no_persona=true; this machine has no in-world persona — describe it plainly.
      {%-   endif -%}
      {%- else -%}
      {%-   set nodes = (value_json.nodes | default([], true)) | selectattr('id', 'equalto', n) | list -%}
      {%-   if nodes -%}
      {%-     set d = nodes[0] -%}
      node={{ d.id }}; kind={{ d.type | default('unknown', true) }}; realm={{ d.realm | default('unknown', true) }}
      {%- if d.ip %}; address={{ d.ip }}{% endif -%}
      {%- if d.os_pretty %}; os={{ d.os_pretty }}{% elif d.os %}; os={{ d.os }}{% endif -%}
      {%- if d.sublabel %}; note={{ d.sublabel }}{% endif -%}
      {%-   else -%}
      node={{ n | default('(none given)', true) }}; not_on_the_map=true; realmwatch has no node by that name.
      {%-   endif -%}
      {%- endif -%}

- spec:
    name: send_word
    description: >-
      Speak a message aloud on another hearth — the desk unit, the mobile unit,
      or both. Use when JP asks to tell, relay, pass on, let someone know, or
      send word to the desk, the mobile, the other hearth, or the whole house.
      The message is spoken there in your own voice.
    parameters:
      type: object
      properties:
        target:
          type: string
          description: >-
            Which hearth speaks. desk is the cased, mains-powered unit; mobile
            is the portable battery one; both speaks on every hearth at once.
          enum:
            - desk
            - mobile
            - both
        message:
          type: string
          description: What to say, short and plain.
      required:
        - target
        - message
  function:
    # Fire-and-forget by design: `assist_satellite.announce` blocks until the
    # device reports playback complete, and the desk unit has a documented
    # 2.5-minute wedge precedent (packages/ember_announce.yaml header). A hung
    # delivery must not hold a voice turn hostage, so this dispatches via
    # `script.turn_on` and reports sent= (dispatch), never delivered=.
    #
    # Deliberately NOT routed through script.ember_broadcast: its quiet-hours →
    # Slack routing exists for automated events. A person speaking through
    # Ember IS the editorial decision, so this goes straight to the terminal
    # speaker scripts, which pin preannounce: false (the single herald).
    #
    # No `other` target: EOC v3's script executor passes only the model's
    # arguments as run_variables (functions/script.py:42) — the source
    # device_id never reaches these templates, so "the other one" is not
    # resolvable here. Explicit targets only.
    type: script
    sequence:
      - variables:
          t: "{{ (target | default('', true)) | lower | trim }}"
          sat: >-
            {%- if t == 'desk' -%}assist_satellite.ember_satellite_assist_satellite
            {%- elif t == 'mobile' -%}assist_satellite.ember_mobile_assist_satellite
            {%- endif -%}
          # Which hearths are known dark right now. The mobile unit is portable:
          # off, flat, or in a drawer are all normal states for it.
          down: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for pair in [('desk', 'assist_satellite.ember_satellite_assist_satellite'),
                             ('mobile', 'assist_satellite.ember_mobile_assist_satellite')] -%}
            {%-   if states(pair[1]) in ['unavailable', 'unknown'] -%}
            {%-     set ns.out = ns.out + [pair[0]] -%}
            {%-   endif -%}
            {%- endfor -%}
            {{ ns.out | join(',') }}
      - choose:
          # A single target that is down gets no dispatch at all — the final
          # result names it unreachable instead of failing mid-turn.
          - conditions: "{{ sat != '' and t not in down.split(',') }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.ember_announce
                data:
                  variables:
                    message: "{{ message }}"
                    satellite: "{{ sat }}"
          # both: always dispatch — ember_announce_all is parallel: with
          # continue_on_error per branch, so one dark hearth costs only itself.
          - conditions: "{{ t == 'both' }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.ember_announce_all
                data:
                  variables:
                    message: "{{ message }}"
      - variables:
          _function_result: >-
            {%- if t == 'both' -%}
            sent=both{% if down %}; hearth_unreachable={{ down }}{% endif %}
            {%- elif sat == '' -%}
            unknown_target={{ target }}; the hearths are desk, mobile, or both.
            {%- elif t in down.split(',') -%}
            hearth_unreachable={{ t }}; it may be off, flat, or out of the house; nothing was sent.
            {%- else -%}
            sent={{ t }}; note=dispatched, playback not awaited
            {%- endif -%}

- spec:
    name: slack_send
    description: >-
      Send a Slack text message as JP. Use when JP asks to message someone on
      Slack, slack somebody, text dad, or leave himself a note on Slack. For
      speaking aloud on a hearth in this house use send_word instead — Slack
      is text that lands on phones.
    parameters:
      type: object
      properties:
        target:
          type: string
          description: >-
            Where it goes. "#channel-name" for a channel (for example
            "#general"). "@handle" for a person's DM — "@calsurvstephen" is
            JP's dad Stephen; "@jp" is JP's own note-to-self DM, right for
            "send me" / "note this down". Only destinations JP routes exist.
        message:
          type: string
          description: The text to send, exactly as it should appear.
      required:
        - target
        - message
  function:
    # Dispatches an event; the Slack bridge addon (~/Projects/ha,
    # docs/slack-bridge.md) owns posting, the allowlist (routed channels +
    # configured DM peers only) and failure announcements at the hearth.
    # Success is silent by design, so this reports dispatched=, never
    # delivered= — same honesty contract as send_word's sent=.
    type: script
    sequence:
      - event: slack_bridge_reply
        event_data:
          channel: "{{ target }}"
          text: "{{ message }}"
      - variables:
          _function_result: >-
            dispatched target={{ target }}; the bridge refuses unrouted
            destinations and announces failures aloud — silence means sent.
