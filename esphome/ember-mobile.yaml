########################################################################
# ember-mobile — the battery variant, issue #44
#
# SAME BOARD, SAME FIRMWARE, DIFFERENT IDENTITY. This file is deliberately
# almost empty: it is a thin identity wrapper around ember-satellite.yaml,
# which is included as a package. Every pin, every lambda, every band of the
# display state machine is shared bit-identically with the desk unit.
#
# WHY A WRAPPER AND NOT A SECOND COPY:
#   ember-satellite.yaml is ~2,600 lines and is the source of truth for the
#   hearth. A forked copy would drift the moment either file is touched, and
#   the drift would be invisible — two files that differ in one flame constant
#   look identical in a diff you didn't run. The repo already argues this case
#   about the paint body (issue #10, dragon_paint_flame.inc is gitignored for
#   exactly this reason). A second board is not a reason to make a second copy.
#
# WHY THIS WORKS AT ALL: ember-satellite.yaml never hardcodes its own name —
# the esphome: block reads `name: ${name}` / `friendly_name: ${friendly_name}`
# from substitutions. Substitutions in THIS file take precedence over the
# package's, so overriding the two identity keys re-skins the whole config.
# Nothing else needs overriding, and nothing else SHOULD be: if you find
# yourself adding hardware substitutions here, the difference belongs in the
# shared file behind a substitution, not in this wrapper.
#
# ⚠️ THE NAME IS LOAD-BEARING IN THREE PLACES AT ONCE — the mDNS hostname
# (ember-mobile.local, the OTA target), the ESPHome native-API device identity,
# and the prefix of every Home Assistant entity ID. Renaming after adoption
# orphans the HA entities and they come back as _2 duplicates. Decide once.
#
# HARDWARE DELTA vs the desk unit: exactly one bare flat-top 18650 behind the
# board, charged by the onboard TP4054. There is NO firmware change for it —
# the `Battery Voltage` sensor (ADC on GPIO9, x2.0 for the onboard divider) is
# unconditional in the shared config and has always been compiled into both.
# On the desk unit it reads an absent divider and is meaningless; here it reads
# the cell. Same binary, different truth.
#
# THE BOARD HAS NO PROTECTION IC — board fact, settled against the vendor
# schematic (docs/vendor/ES3C28P_Schematic.pdf): BAT goes straight to the cell,
# the regulator's floor is ~3.4V, and the level divider drains ~9µA below it.
# ✅ A 1S PROTECTION STRIP IS FITTED (JP, 2026-08-09 — both this board and
# ember-dad's in the same session), which is the hardware answer that firmware
# never could be. The candle + battery ladder remain the EARLY warning; the
# strip is the floor under everything.
#   >>> Still true and still binding: do not add a low-voltage cutoff here and
#       call anything solved. Firmware cannot protect a cell it is no longer
#       being powered by — the strip does that now. <<<
#
# FIRST FLASH MUST BE OVER USB. This board is 28:84:85:44:3E:C4 — same
# production batch as the desk unit (28:84:85:44:59:20), which is precisely
# why you must check the MAC and not the port number before writing flash.
# /dev/ttyACM* renumbers on replug; the MAC does not.
#
#   esphome compile ember-mobile.yaml
#   esphome run     ember-mobile.yaml --device /dev/ttyACM2
#
# ⚠️ `esphome config` is NOT a build check and `esphome upload` does NOT
# compile — both documented at length in the README. Use compile, or run.
########################################################################

substitutions:
  name: ember-mobile
  friendly_name: Ember Mobile
  # Its OWN OTA credential, different from the desk unit's — see the note on the
  # substitution in ember-satellite.yaml. This is the guard that turns "I typed
  # the wrong --device" from a renamed board with 25 orphaned HA entities into an
  # authentication failure. It is the one substitution besides identity that this
  # wrapper is expected to override.
  ota_password: !secret ota_password_mobile

  # The chronicle's SPEAK button replays through THIS hearth, not the desk.
  satellite_entity: assist_satellite.ember_mobile_assist_satellite

  # THIS BOARD HAS THE CELL. Turns on the whole battery ladder in the shared
  # config: the candle in the sigil band, the SOC computation, the guttering
  # chime at ${batt_low_pct}. The desk build keeps the default 0 and all of it
  # compiles out. See "the cell" block in ember-satellite.yaml's substitutions.
  has_battery: "1"

# The SOC entity lives in the WRAPPER, not the shared config, and that placement
# is the point: the shared file computes SOC into a global (cheap, harmless on
# the desk where it's never read), but only a board with a real cell may EXPOSE
# it — a desk-unit "Battery SOC" would be a confident number derived from a
# floating pin, which is exactly the class of lie the house row's `unavailable`
# work exists to prevent. This is also what the HA-side ember_battery_watch
# automation triggers on, so the desk can never trip a battery alarm.
sensor:
  - platform: template
    name: Battery SOC
    id: batt_soc_sensor
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    # NAN until the first ADC sample lands -> HA shows unknown, not 0%. Same
    # unknown-vs-empty rule as the candle's cold wick.
    lambda: 'return id(batt_soc) < 0 ? NAN : (float) id(batt_soc);'

packages:
  # The entire hearth. Not `!include`d for its config so much as adopted
  # wholesale — this is the desk unit's firmware, renamed.
  #
  # WAKE WORD IS INHERITED AT MODE 1 (on-device microWakeWord, "Okay Nabu")
  # because that is the shared file's default, and it is deliberately NOT
  # overridden here.
  #
  # The shared file still carries a "⚠️ NEVER FLASHED" banner on this mode and
  # that banner is STALE — JP confirmed 2026-08-03 that "Okay Nabu" has been
  # flashed and is working on the desk unit. The I2S-arbiter risk it warns
  # about was real when written and is now retired by observation. Kept here
  # only as the rollback recipe: if a board ever does go silent with the log
  # repeating "Parent bus is busy" or "Driver failed to start; retrying in
  # 1 second", set wake_word_mode back to "0" and reflash for touch-only.
  #
  # ⚠️ THE ONE GENUINELY NEW RISK IS HAVING TWO OF THEM: two satellites at
  # mode 1 in earshot of each other BOTH wake and BOTH answer. On-device
  # detection is local to each board and each starts its own pipeline, so
  # there is no cross-satellite arbitration to lose. This is a property of
  # owning a second one, not a fault in either — and it is the first thing to
  # watch when the mobile unit is set down next to the desk unit.
  hearth: !include ember-satellite.yaml
