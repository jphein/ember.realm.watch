              // pan offsets are clamped HERE, where the buffer dims are
              // known — the touch handler just accumulates deltas
              const int zw = id(zoom_img)->get_width();
              const int zh = id(zoom_img)->get_height();
              int minx = W - zw;  if (minx > 0) minx = 0;
              int miny = 320 - zh; if (miny > 0) miny = 0;
              if (id(vision_px) < minx) id(vision_px) = minx;
              if (id(vision_px) > 0)    id(vision_px) = 0;
              if (id(vision_py) < miny) id(vision_py) = miny;
              if (id(vision_py) > 0)    id(vision_py) = 0;
              const int ax = zw < W ? (W - zw) / 2 : id(vision_px);
              const int ay = zh < 320 ? (320 - zh) / 2 : id(vision_py);
              it.image(ax, ay, id(zoom_img));
