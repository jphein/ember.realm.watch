         25, 26,  0,  0,   // r00
         21, 25,  0,  0,   // r01
         17, 23,  0,  0,   // r02
         10, 13, 15, 22,   // r03
          8, 20,  0,  0,   // r04
          5, 20, 22, 27,   // r05
