          // so the top row is family.
          for (int tile = 0; tile < 6; tile++) {
            const int idx = id(ic_page) * 6 + tile;
            if (idx >= n) break;
            const int gx = (tile % 2) * 120 + 1;
            const int gy = 50 + (tile / 2) * 54;
            it.rectangle(gx, gy, 118, 52, c_dim);
            it.rectangle(gx + 1, gy + 1, 116, 50, c_ash);
