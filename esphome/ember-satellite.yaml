          //   0 FRAMED — title + image + caption inside the overlay region
          //   1 FULLSCREEN — the whole panel is the image (tap advances here
          //     from framed; the band scheduler suppresses sigil/telemetry
          //     repaints while view >= 1 so nothing paints over it)
          //   2 ZOOMED — the 480-wide zoom buffer, drag to pan, clamped
          // Tap advances framed->full->gone (zoom taps back to full); pinch
          // out/in moves between full and zoom; the button always dismisses;
          // vision_timeout returns the fire on its own.
          if (id(vision_view) >= 1) {
            it.filled_rectangle(0, 0, W, 320, c_bg);
            if (id(vision_view) == 2 && id(zoom_url) == id(vision_url)
