          // yourself, and a list that offers it would be a list that lies.
          std::vector<std::string> names;
          {
            const std::string &all = id(ic_targets).state;
            size_t pos = 0;
            while (pos <= all.size() && names.size() < 48) {
              size_t bar = all.find('|', pos);
              if (bar == std::string::npos) bar = all.size();
              std::string nm = all.substr(pos, bar - pos);
              if (!nm.empty() && nm != "${friendly_name}") names.push_back(nm);
              pos = bar + 1;
            }
          }
          const int n = (int) names.size();
          const int pages = n == 0 ? 1 : (n + 5) / 6;
          if (id(ic_page) > pages - 1) id(ic_page) = pages - 1;
          it.printf(W - 6, OY + 2, id(font_sm), c_dim,
