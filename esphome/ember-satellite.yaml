            it.filled_circle(gx + 14, gy + 40, 2, c_ember);
            it.draw_pixel_at(gx + 17, gy + 36, c_gold);
            // name, split at the nearest space to fit two centred lines
            const std::string &nm = names[(size_t) idx];
            std::string l1 = nm, l2;
            if (nm.size() > 15) {
              size_t cut = nm.rfind(' ', 15);
              if (cut == std::string::npos || cut < 4) cut = 15;
              l1 = nm.substr(0, cut);
              l2 = nm.substr(cut + (nm[cut] == ' ' ? 1 : 0), 15);
            }
            it.print(gx + 59, gy + (l2.empty() ? 18 : 8), id(font_sm), c_ink,
                     display::TextAlign::TOP_CENTER, l1.c_str());
            if (!l2.empty())
              it.print(gx + 59, gy + 26, id(font_sm), c_ink,
                       display::TextAlign::TOP_CENTER, l2.c_str());
          }
          // the page bar, at the same 46px floor as everything tappable
          it.filled_rectangle(0, 216, W, 1, c_ash);
          if (id(ic_page) < pages - 1) {
