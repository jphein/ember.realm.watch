########################################################################
# ember-satellite — LCDWIKI/QDtech ES3C28P (sold as "Hosyond 2.8in ESP32-S3")
#
# HA voice satellite for the Ember pipeline. The screen IS the hearth: one
# fire in a grate whose temperature is the whole state machine.
#
# Pinout is traced to the manufacturer's schematic (see
# scratch/hosyond-s3/nebula-prior-art.md + ES3C28P_official_schematic.pdf),
# NOT copied from community tables — several of those have the I2S data
# pins inverted because the silkscreen names them from the codec's side.
#
# Activation: TOUCH the screen (no wake word for now).
#
# ARCHITECTURE NOTE — why no LVGL:
#   The audio callback does maths ONLY (compute RMS, push to ring buffer).
#   The display redraws on its own interval and reads that buffer. This
#   deliberately decouples the I2S callback from SPI drawing, because mic
#   and speaker share one I2S hub on this board and blocking in the audio
#   path risks dropouts. A hand-drawn waveform is also far simpler and
#   lighter than bending LVGL widgets into a histogram (LVGL has no chart
#   widget in ESPHome 2026.7.2).
#
# ARCHITECTURE NOTE — BANDED PARTIAL REDRAW (added 2026-07-29):
#   The screen is divided into four fixed horizontal bands. At most ONE band
#   is repainted per frame, and mipi_spi flushes only the dirty bounding box,
#   so per-frame cost is proportional to the band, not the panel. This is what
#   buys a 20fps fire animation at LOWER main-loop duty than the previous
#   3.3fps full-frame repaint. Two hard requirements fall out of it:
#     - `auto_clear_enabled: false` (otherwise clear() dirties every pixel
#       before the lambda even runs — see the display block).
#     - Nothing may draw outside its own band. The framebuffer now PERSISTS
#       between frames, so a stray draw leaves permanent litter whose symptom
#       (ghosting) looks nothing like its cause.
#
# ARCHITECTURE NOTE — why the fire renders ROW-MAJOR:
#   The framebuffer is allocated by RAMAllocator, whose default flags are
#   ALLOC_INTERNAL|ALLOC_EXTERNAL == external FIRST (core/helpers.h:2185), so
#   153,600 bytes of it live in octal PSRAM. Display::filled_rectangle is
#   rows-of-horizontal_line over a per-pixel draw_pixel_at
#   (display.cpp:88-112 — whose own "Future:" comments flag this as the known
#   weak spot). A 4px-wide x 70px-tall flame column therefore touches ~70
#   separate PSRAM cache lines to write 8 useful bytes each. The fire is
#   instead emitted as horizontal RUNS, so every write is sequential in x with
#   rows ascending and each cache line is fully consumed.
#   >>> Do not "simplify" the fire back into per-column filled_rectangle
#       calls. It looks identical and costs several times more. <<<
########################################################################

substitutions:
  name: ember-satellite
  friendly_name: Ember Satellite

  # OTA credential, PER DEVICE. ember-mobile.yaml overrides this with its own
  # secret, and that separation is the whole point: with two boards from the same
  # batch on the same network, the expensive mistake is not an intruder, it is
  # pushing one board's firmware at the other. A device renamed by a mis-targeted
  # OTA answers to the wrong hostname and orphans 25 Home Assistant entities.
  # Distinct passwords make that fail at authentication instead of succeeding.
  #
  # Substitution rather than a bare `!secret` in the ota: block because !secret
  # cannot be given a computed key — the indirection is what lets each wrapper
  # choose its own. ESPHome tracks the provenance, so `esphome config` prints
  # `!secret 'ota_password_satellite'` and never the value.
  ota_password: !secret ota_password_satellite

  # ---- the cell (mobile variant only) ----
  # 0 here, 1 in ember-mobile.yaml. THE FIRST DEVICE-DIVERGENT DISPLAY FEATURE:
  # the desk unit has no cell — its GPIO9 reads an absent divider and the number
  # is noise — so everything battery flows through this gate and compiles OUT on
  # the desk build (the lambdas test a literal 0, which folds). Do not key any of
  # it off the measured voltage instead: noise on a floating pin can look like
  # any voltage you name, including a plausible one.
  #
  # Thresholds are PERCENT SOC (not volts) and live here so a bench build can
  # trip the ladder by editing two numbers, no code. Calibrated against the
  # observed 2026-08-06/07 discharge: 20% ≈ 3.50V rested — several hours of
  # warning before the ~3.4V regulator floor; 8% ≈ 3.40V — the last graceful
  # moment to say so out loud. That trace bottomed at 2.508V with nobody
  # watching, which is the event this whole ladder exists to make impossible.
  has_battery: "0"
  batt_low_pct: "20"    # candle gutters + chime_guttering, once per discharge
  batt_crit_pct: "8"    # HA-side: mobile speaks + ember_broadcast (desk/Slack)
  # Histogram width in samples; must match level_hist array size below.
  hist_len: "120"
  # dBFS window the level meter maps to 0-100%. THESE NEED CALIBRATING on
  # real hardware — too narrow and the meter pins, too wide and it looks dead.
  # Speak at normal volume ~40cm away and watch sensor.mic_rms, then set
  # db_floor just under the room-noise reading and db_ceil just over speech.
  db_floor: "-72.0"
  db_ceil: "-30.0"

  # ---- speaking-phase animation ----
  # The flame wave advances one full spatial cycle per this many ms of REAL
  # audio (frames clocked to the DAC), not per this much wall time.
  flame_cycle_ms: "900"
  # Fuse denominator: est_ms = tts_lead_ms + chars * tts_ms_per_char.
  # 62 ms/char ~= 16 chars/s, about right for en-GB Piper/Azure. CALIBRATE:
  # watch the "spoken x.xs / ~y.ys" line in the telemetry band and adjust until
  # the fuse lands near the right-hand edge as Ember stops talking.
  tts_lead_ms: "400"
  tts_ms_per_char: "62"
  # If the frame counter doesn't advance for this long while the speaker still
  # reports is_running(), the fire gutters and the telemetry band says so.
  stall_ms: "300"

  # Chime on THINKING. 0 = off (default), 1 = on. See the chime script for why this
  # is a switch and why `listening` deliberately isn't one.
  chime_on_thinking: "0"

  # ---- wake word mode ----
  #   0 = off. Touch-only. The shipped behaviour.
  #   1 = ON-DEVICE, microWakeWord "Okay Nabu" (stock model, vendored in wakewords/).
  #   2 = SERVER-SIDE, HA openWakeWord "don-kee".
  #
  # DEFAULTS TO 1, and that is a change of behaviour on the next flash: Ember will
  # start answering to "Okay Nabu" without being touched. Everything wake-word related
  # is inert at 0, and modes 1 and 2 are mutually exclusive by construction (every
  # guard tests for one specific mode, never "non-zero").
  #
  # WHY 1 AND NOT 0, given the #42 precedent shipped its wake word off: what justified
  # off there was the privacy cost of streaming room audio to HA, and mode 1 does not
  # have that cost. Nothing leaves the device until the word fires. The remaining risk
  # is the I2S one below, which is a bench-observable audio bug, not a data question —
  # and it is observed in the first ten seconds of a flash that JP is present for.
  #
  # ✅ FLASHED AND HEARD. This block read "⚠️ NEVER FLASHED" until 2026-08-03; JP
  # confirmed "Okay Nabu" works on the desk unit, and the same mode came up clean on
  # ember-mobile's first flash (wake word -> STREAMING_MICROPHONE -> STT, no bus
  # errors in the log). The I2S arbiter below yields the bus correctly. The risk the
  # old banner described was real when written and is now retired by observation.
  #
  # Kept as the rollback recipe, because the failure mode is still worth recognising:
  # if a board ever goes silent — no chimes, no replies, and the log repeats "Parent
  # bus is busy" or "Driver failed to start; retrying in 1 second" — the arbiter is
  # not yielding. Set this back to 0 and reflash; that restores touch-only exactly.
  #
  # ⚠️ WHAT A FRESH FLASH *DOES* DO, and it looks like a fault: a board that is on
  # WiFi but NOT YET ADOPTED IN HOME ASSISTANT sits in a ~1 Hz loop —
  #   micro_wake_word: Stopping / Starting
  #   [E][voice_assistant]: No API client connected
  #   [W]: sound_level.sensor ... Microphone isn't running
  # because the re-arm triggers fire on voice_assistant *ending* and a failed start
  # counts as an end. Nothing is wrong with the board or the bus. It stops the
  # instant HA adopts the device. Observed on ember-mobile's bring-up 2026-08-03 —
  # do not go hunting the arbiter for it.
  #
  # MODE 1 vs MODE 2, honestly:
  #
  #   Mode 2 streams 16 kHz room audio to Home Assistant continuously while idle.
  #   That is a privacy and airtime cost, and it is why mode 2 has never been
  #   switched on. Mode 1 has no such cost — detection is local and nothing leaves
  #   the device until the wake word actually fires. Mode 1 is strictly better on
  #   that axis, and it is the reason it exists.
  #
  #   The catch is the wake WORD, not the wiring: mode 1 answers to "Okay Nabu",
  #   because the only "don-kee" artifact left is an openWakeWord model and that
  #   format cannot run on-device (input [1,16,96] float32 — openWakeWord's
  #   classifier head; microWakeWord is int8 and self-contained, and ESPHome
  #   implements only the latter). They are not interconvertible; "don-kee"
  #   on-device needs RETRAINING. See docs/wake-word.md.
  #
  # ⚠️⚠️ MODE 1 IS NOT FREE ON THIS BOARD, and the reason is the shared I2S bus.
  # micro_wake_word holds the MICROPHONE open continuously, and on this device the
  # mic and the speaker are the same `i2s_bus` behind ONE mutex. The mic takes that
  # mutex in start_driver_() and does not give it back until stop_driver_()
  # (i2s_audio_microphone.cpp:98,228), and the SPEAKER also acquires it with a
  # non-blocking try_lock() that just gives up — "Parent bus is busy"
  # (i2s_audio_speaker_standard.cpp:400) — and retries a second later, forever.
  #
  # So a naively-always-on micro_wake_word makes Ember MUTE: every reply, chime and
  # announcement fails to get the bus for as long as the wake word is listening.
  # This is the exact mirror of the `timeout: never` trap documented on the speaker
  # below, which warns that a permanently-loaded SPEAKER starves the mic. Same
  # mutex, other direction, and it is just as silent.
  #
  # What makes mode 1 safe is the arbiter in `interval:` (search "WAKE-WORD
  # ARBITER"), which yields the microphone the instant anything wants to make
  # noise. Do not "simplify" micro_wake_word into always-on. It will look fine on
  # the bench until the first time Ember tries to speak.
  wake_word_mode: "1"

  # How long the touch spark takes to settle, ms. Long enough to read as a flare
  # rather than a flicker; short enough that it is gone before the pipeline answers.
  spark_ms_len: "500"

  # How long the amp is held in shutdown across a shared-I2S clock start, ms.
  #
  # ENABLED, on evidence. I had set this to 0 believing amp blanking caused a silent-TTS
  # regression. It did not: with blanking off JP reported "the pop was still there and it
  # didn't speak" — so the pop RETURNED the moment blanking stopped, and the silence was
  # concurrent but unrelated (an HA-side stale TTS stream subscription,
  # `ERROR tts: Invalid subscription`, from repeated OTAs; fixed by reloading the ESPHome
  # config entry). Correlation, not causation, and I had it backwards.
  #
  # So amp blanking does the one job REG31 provably cannot: suppress the MCLK cold-start
  # transient. Confirmed independently by nebula's prior-art review — vendor firmware
  # (Espressif Korvo BSP, xiaozhi) creates DUPLEX channels once and never calls
  # i2s_channel_disable, so the clock never stops. ESPHome is simplex behind one shared
  # mutex and calls i2s_del_channel() on every hand-off, so every mic/speaker transition
  # destroys and recreates the clock. That is the architectural root cause.
  #
  # >>> CORRECTED. An earlier version of this comment said "the amp finishes waking
  # before the blank lifts", which is impossible and led to a wrong latency estimate.
  # GPIO1 is `inverted: true` on an ACTIVE-LOW SHUTDOWN, so `output.turn_off:
  # amp_enable` genuinely DISABLES the amp. A disabled amp is not waking — its ~100ms
  # typical wake (TD) begins only when the watchdog RE-ENABLES it at T+180ms.
  #
  # So the real timeline is: amp off at T+0, re-enabled at T+180, usably awake at
  # ~T+280. Any audio inside that window is silenced or clipped, not protected. That
  # is why 180 is right for the MICROPHONE path (no audio is expected during it) and
  # why blanking is fundamentally incompatible with a short touch tone — see the
  # haptic exemption in ui_dispatch. 0 disables blanking entirely.
  #
  # ⚠️ OPEN, and only a listening test can settle it: the amp datasheet warns a large
  # input coupling cap increases pop and recommends 0.1-0.39uF. This board is reported at
  # 0.39uF (C44/C45) — the very top of that range — so PA gating may TRADE a codec pop
  # for an amp-enable pop rather than remove it. That value came from extracted schematic
  # text and pdftotext adjacency has misled us on this board before, so it is
  # unconfirmed. Compare 0 / 180 / 300 by ear before trusting any of it.
  amp_blank_ms: "180"

  # ---- text layout ----
  # cpl_body / cpl_sm are GONE. They were character budgets estimated from Roboto's
  # average advance, and they were the cause of the truncation JP reported: an average
  # advance under-counts any line with wide glyphs, so lines overran the band and were
  # clipped. Wrapping is now measured with it.get_text_bounds(), so there is no
  # estimate left to be wrong.
  said_lines: "4"              # visible lines of Ember's reply per page
  scroll_page_ms_len: "3500"   # how long each page is held before advancing

  # ---- the hearth-wyrm ----
  # Placement of the creature inside the flame band. Up here rather than buried
  # in a 400-line lambda for the same reason the ui_ block below is: these are
  # the numbers someone will actually want to nudge.
  #
  # NOTE dgn_y is relative to the TOP OF THE FLAME BAND (FLAM_Y), not the panel.
  # The whole point is that the wyrm cannot be moved out of its band by editing
  # this: the renderer clips every span to 0..dgn_h and the band owns rows
  # FLAM_Y..FLAM_Y+FLAM_H-1 regardless.
  dgn_x: "60"           # wyrm bbox, screen x
  dgn_y: "22"           # wyrm bbox, offset from the TOP OF THE FLAME BAND
  dgn_w: "120"
  dgn_h: "50"

  # ---- overlay geometry ----
  # SHARED between the display lambda (which draws the targets) and the
  # touchscreen hit-test (which must land on them). Defined once here because a
  # silent drift between "where it's drawn" and "where it's tappable" is the
  # classic touch-UI bug and it is invisible in review.
  ui_oy: "32"           # overlay origin y — must equal SCRL_Y
  # The single-press overlay: FOUR rows since 2026-08-09 evening (volume /
  # mic gain / brightness / reading font — JP: "font size should be
  # configurable in the volume menu too"). Four 46px control lines do not fit
  # in the overlay's 232px, so each row is an 18px label line over a 38px
  # drawn control line at a 56px pitch — and the HIT band is the full 56px
  # pitch, label included (see the mode-1 hit-test: by-18 .. by+bh). 56px
  # ~= 10.3mm, the same touch floor every menu row uses; the drawn box is a
  # picture inside a larger target, never smaller. Rows end y258 of 263.
  ui_vol_by: "52"       # volume +/- : top edge of the drawn boxes
  ui_vol_bh: "38"       # +/- drawn-box height, shared by all four controls
  ui_gain_by: "108"     # mic gain +/- : top edge
  ui_bri_by: "164"      # backlight brightness +/- : top edge
  ui_font_by: "220"     # reading-font size +/- : top edge
  # 2026-08-24: FIVE rows (Douse joined — JP: "an off option"), and five 46px
  # rows do not fit the 232px overlay. 41px rows at iy 58: 58 + 5*41 - 3 = 260
  # of 263 — the static_assert at the overlay background is the enforcement.
  # 41px ~= 7.6mm, under the 8.4mm floor the 46px rows carried, and the same
  # trade the audio overlay made for its fourth row: rows are contiguous
  # (edge-to-edge bands, no dead gaps), so a near miss lands on a neighbour
  # row's meat rather than on nothing — and the destructive rows still need a
  # deliberate second act (Douse and Rekindle sit at the bottom, cursor-last).
  ui_pm_iy: "58"        # power menu: first item top edge
  ui_pm_ih: "41"        # power menu: item height (41px ~= 7.6mm — see above)
  ui_pm_n: "5"          # power menu: item count
  # Auto-dismiss after this long without interaction.
  ui_vol_timeout: "8000"   # was 5000; two controls take longer to set
  ui_pm_timeout: "12000"
  vision_timeout: "120000" # the Slack image lingers 2 min, then the fire returns
  # Where the hearths fetch stashed visions from. The edge name, not a LAN IP:
  # the IDF cert bundle validates it, and the IP-moved-once lesson applies.
  ha_base: "https://ha.jphe.in:8123"
  # The horn — the intercom button (2026-08-05). Bottom-right block of the
  # telemetry band: 47px wide (~8.7mm) by the band's full 56px (~10.3mm). Shared
  # by the on_touch hit-test and the display lambda for the same reason as every
  # other pair in this block: drawn and tappable must not drift apart. ui_ic_y
  # must equal TELE_Y in the band geometry.
  # 2026-08-09: x 192 -> 172. JP's bench verdict: "hard to tap in the corner
  # there." The block was already 47px (~8.7mm) — above the 8.4mm floor — so
  # size was never the problem; the CORNER was. The case bezel overhangs the
  # glass edge, so the outer ~2mm of any edge-flush target is under plastic a
  # fingertip cannot reach. The fix is REACH, not size: extend the active block
  # inward to 68px (~12.6mm) so the tappable meat sits clear of the lip. Same
  # substitution drives drawing and hit-test, so both move together.
  ui_ic_x: "172"
  ui_ic_y: "264"

  # Compile-time identity for the face (2026-08-09, JP: each ember shows its
  # lexicon name "plus the sigil version so i know it's teh latest"). Injected
  # per build:  esphome compile ember-mobile.yaml -s sigil_version $(git
  # rev-parse --short HEAD)  — the default below is what a build that FORGOT
  # the flag shows, and it is deliberately loud about being nobody: a face
  # reading "unsigiled" tells JP the build is untraceable, where a stale hash
  # would tell him a lie with confidence (verification.md §32's whole genre).
  sigil_version: "unsigiled"

  # This device's own assist_satellite entity in HA — what the chronicle's
  # SPEAK button hands to script.ember_announce so a replay comes out of THIS
  # hearth. A substitution because the entity id is the device name with
  # underscores, and ESPHome substitutions cannot transform strings; each
  # wrapper states its own. (ember-mobile.yaml overrides this.)
  satellite_entity: assist_satellite.ember_satellite_assist_satellite

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  name_add_mac_suffix: false
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: backlight
            brightness: 80%

    # Register the ONE thing this design takes from the speaker: a frame counter.
    #
    # !! THIS CALLBACK RUNS IN speaker_task, NOT THE MAIN LOOP. !!
    #    i2s_audio_speaker.cpp:239 invokes audio_output_callback_ from
    #    run_speaker_task(); i2s_audio_speaker.h:22-23 give TASK_STACK_SIZE 4096
    #    and TASK_PRIORITY 19. That is the SAME hazard class as the
    #    `microphone: on_data:` block warned about below — so the body here is
    #    deliberately ONE 32-bit add and nothing else. No floats, no ESP_LOG, no
    #    std:: containers, no allocation. DO NOT GROW IT.
    #
    # Cross-task safety, chosen deliberately rather than assumed:
    #   spk_frames is `volatile uint32_t`. An aligned 32-bit load/store on
    #   Xtensa LX7 is a single instruction and cannot tear, so no lock is
    #   needed; `volatile` is what stops the compiler caching the value across
    #   the display lambda's reads. The counter is monotonic and is only ever
    #   used for elapsed-time subtraction, so reading a value one callback stale
    #   is visually irrelevant. Strictly cheaper AND safer than a mutex.
    - priority: -100
      then:
        - lambda: |-
            id(spk)->add_audio_output_callback([](uint32_t frames, int64_t ts) {
              (void) ts;
              id(spk_frames) += frames;
            });

    # Put the DAC where HA thinks it is. This fixes a PRE-EXISTING desync that has
    # nothing to do with announce: TemplateNumber::setup() only calls
    # publish_state() and never control() (template/number/template_number.cpp:8-25),
    # so `set_action` — and therefore audio_dac.set_volume — NEVER RAN AT BOOT. The
    # es8311 sat at its own 0.75 (= 0dB) default while HA displayed 45%, which is
    # exactly the "too loud" symptom noted on the number below.
    #
    # Driving it through media_player.volume_set (rather than number.set) settles
    # all three at once: speaker->set_volume() writes the DAC, and on_volume mirrors
    # the value back into spk_volume so the number and the media_player entity agree
    # too. Priority -200 so it lands after every component has finished setup().
    # MIC PGA RESYNC — ITS OWN TRIGGER, DELIBERATELY, AND THE REASON IS A DIAGNOSIS.
    #
    # This was first appended to the -200 sequence below and produced NO log line on the
    # device across three flashes, guarded and unguarded. The generated code was present
    # (main.cpp:8128), the logger was at DEBUG with no tag filter, and the boot log was
    # captured with a client already attached across a reboot. So the code existed, the
    # level permitted it, and it still did not appear — which points at the SEQUENCE rather
    # than at the action: an on_boot `then:` is an ordered list, and anything earlier in it
    # that blocks or fails takes everything after it down silently.
    #
    # Rather than keep testing hypotheses about which earlier action that might be — four
    # wrong ones earlier today came from exactly that habit — this gets its own trigger,
    # where no other action can precede it. It is also strictly better design: a resync
    # that only matters to one component should not be the tail of a list about the DAC.
    #
    # -300 so it lands after the -200 block regardless of what that block does.
    - priority: -300
      then:
        - number.set:
            id: mic_gain_num
            value: !lambda 'return id(mic_gain_num).state;'
        # ---- PROVE IT, at a moment the proof can actually be observed ----
        #
        # Four flashes were spent watching for a boot-time log line that never appeared,
        # concluding each time that the code had not run. That inference was unfounded:
        # `esphome logs` subscribes over the API SECONDS after the device boots, so a line
        # emitted during setup has nowhere to go. ABSENCE OF A LOG IS NOT ABSENCE OF
        # EXECUTION unless you can show the transport was live when it was emitted — and
        # that was never established. The generated code was in main.cpp the whole time.
        #
        # So this stops testing the messenger and tests the thing: wait until a client is
        # certainly attached, then READ REG16 BACK OFF THE CODEC and print it beside the
        # number's state. Agreement proves the resync reached the hardware; disagreement
        # names the bug precisely. Either way it is a measurement rather than an inference
        # from silence.
        - delay: 25s
        - script.execute: mic_sync_check

    - priority: -200
      then:
        - media_player.volume_set:
            id: media_out
            volume: !lambda 'return id(spk_volume).state / 100.0f;'
        # Mute the DAC before anything can start I2S. The `dac_muted` global already
        # says true, but the CODEC has to agree — otherwise the very first audio
        # after boot still pops, since there is no previous stop to inherit a mute
        # from. Must run after the es8311 is set up, hence the late priority.
        - audio_dac.mute_on: es8311_dac

        # AND PUT THE MIC PGA WHERE HA THINKS IT IS, for the identical reason spelled out
        # above — which is the uncomfortable part of this fix.
        #
        # THE BUG WAS ALREADY DOCUMENTED IN THIS FILE, 700 LINES UP, WITH THE LINE NUMBERS.
        # TemplateNumber::setup() calls publish_state() and never control(), so a restored
        # value never runs its `set_action`. That was found, fixed and written up for
        # spk_volume — and then a second restoring number was added and shipped with the
        # same defect, because the fix had been applied to an INSTANCE rather than turned
        # into a rule. A note saying "this component behaves like X" does not protect the
        # next component that behaves like X.
        #
        # The mic case fails more quietly than the volume one did. The es8311 driver writes
        # REG16 in its own setup() from the compile-time `mic_gain: 36db` still on the
        # audio_dac, so after a reboot the number reads whatever was stored while the PGA
        # sits at 36dB. Set 12dB, reboot, and HA shows 12 while the hardware is at 36 —
        # ⚠️ and the ONLY value immune is the default, which is exactly what anyone would
        # test with. Found by a reviewer reading the component source, not by running it.
        #
        # Pushed back THROUGH the number rather than writing REG16 here, so the register
        # keeps a single writer. Two places writing one register is how the amp ended up
        # with three writers and one of them reachable.

        # ---- REPUBLISH THE MODE, or the select lies after a reboot ----
        #
        # FOUND ON HARDWARE, NOT IN REVIEW, and the compiler and the config check both
        # passed with it broken. `op_mode` is `restore_value: true` because the mode is a
        # preference; `sel_mode` is a VIEW with `restore_value: false` and
        # `initial_option: "Normal"`. Nothing re-synced the view at boot, so a device
        # rebooted while quiet came back with:
        #
        #     op_mode      == 2      (genuinely Hush: speech and chimes suppressed)
        #     switch Hush  == ON     (a lambda over op_mode, so it stayed truthful)
        #     select Mode  == Normal (WRONG -- reverted to initial_option)
        #
        # Measured exactly that on the device: set Hush, restart, re-read. The two
        # entities disagreed and the SELECT was the wrong one -- which is the dangerous
        # way round, because the select is the surface a person reads and the entity an
        # automation would consult to decide whether Ember may speak.
        #
        # The design claimed the view "cannot disagree with the mode". That was true of
        # the Hush switch and FALSE of the select, and the gap is exactly one power
        # cycle wide -- invisible to a compile, to `esphome config`, and to any check
        # that never rebooted the device in a non-default mode.
        #
        # set_index re-runs the select's own set_action, which writes op_mode back to the
        # value it already holds. Idempotent by construction, so this cannot itself
        # become a second source of truth.
        - lambda: |-
            // A corrupt restored byte must not wedge the device in an undrawn mode.
            if (id(op_mode) > 2) id(op_mode) = 0;
            id(sel_mode)->make_call().set_index((size_t) id(op_mode)).perform();

interval:
  # Cheap: one I2C register read a minute on a control-plane bus. Periodic rather than
  # boot-only because a divergence introduced later — by anything that writes REG16
  # without going through the number — would otherwise never surface.
  - interval: 60s
    then:
      - script.execute: mic_sync_check

  # ---- THE WAKE-WORD ARBITER ----
  #
  # The one thing that makes on-device wake word survivable on this board. Read the
  # ⚠️⚠️ note in the substitutions block before touching it.
  #
  # THE PROBLEM IN ONE LINE: micro_wake_word holds the MICROPHONE open forever, and on
  # this device the mic and the speaker are one `i2s_bus` behind ONE mutex.
  #
  #   mic  takes it in start_driver_() and returns it only in stop_driver_()
  #        (i2s_audio_microphone.cpp:98, 228) — i.e. for its whole running life
  #   spk  asks with a NON-BLOCKING try_lock(), logs "Parent bus is busy" and gives up
  #        (i2s_audio_speaker_standard.cpp:400), then retries a second later. Forever.
  #
  # So an always-listening wake word does not degrade Ember, it MUTES it: every reply,
  # chime and announcement loses the bus for as long as the wake word is armed. This is
  # the same trap as `timeout: never` on the speaker documented above — that one starves
  # the mic, this one starves the speaker. One mutex, two directions, both silent.
  #
  # THE RULE: the wake word may hold the microphone only while nothing wants to speak
  # and no conversation is running. This loop is the sole owner of that rule, and the
  # sole caller of mww start/stop besides stop_after_detection.
  #
  # WHY is_stopped() AND NOT is_running(): is_running() is `state_ == STATE_RUNNING`,
  # which is only reached AFTER the speaker has won the lock — which it cannot do while
  # we hold it. Keying on it would deadlock: we would wait for a state that our own
  # holding the mic prevents. is_stopped() is `state_ == STATE_STOPPED`, so it goes
  # false at STATE_STARTING — the moment the speaker WANTS the bus, before it asks.
  # That is the only edge available to us, and it is why this reads inverted.
  #
  # 100ms is deliberate. This is a backstop, not the fast path: the two paths that
  # actually matter for latency yield the mic ahead of time (ui_dispatch for touch,
  # on_announcement for pushed audio) so the speaker wins its FIRST try_lock instead of
  # eating the 1s retry. This loop catches everything else and re-arms afterwards.
  #
  # FAILURE DIRECTION, chosen the same way the DAC-mute manager chose its: a missed
  # STOP costs a mute, a missed START costs deafness until the next tick. So the stop
  # side is also driven from the two predictive anchors, while the start side lives
  # only here — the worst case for arming late is 100ms of not listening.
  - interval: 100ms
    then:
      - lambda: |-
          if (${wake_word_mode} != 1) return;      // compile-time constant; folds away
          const bool want = id(spk)->is_stopped() && !id(va)->is_running();
          if (want && !id(mww)->is_running()) {
            id(mww)->start();
          } else if (!want && id(mww)->is_running()) {
            id(mww)->stop();
          }

  # THE UNMUTE ANCHOR. This condition — "we believe we are muted AND the speaker is
  # actually running" — was written as a 250ms watchdog behind on_announcement /
  # on_play. It is in fact the only correctly-timed anchor available, so it has been
  # promoted to the primary mechanism and the period tightened to 10ms.
  #
  # WHY THE MEDIA_PLAYER TRIGGERS WERE THE WRONG ANCHOR:
  #   on_announcement / on_play fire when the media_player enters its playing state,
  #   which is BEFORE the pipeline starts the speaker and therefore before
  #   i2s_channel_enable(). Unmuting there unmutes ahead of the clock transient, so
  #   the pop survives — the fix would appear to do nothing. is_running() is the only
  #   signal that means "the clocks are already up".
  #
  # WHY 10ms AND NOT 250ms — the free 50ms window:
  #   The speaker preloads DMA_BUFFERS_COUNT (5) buffers of memset-zero SILENCE and
  #   only THEN calls i2s_channel_enable()
  #   (i2s_audio_speaker_standard.cpp:121-166, DMA_BUFFER_DURATION_MS = 10).
  #   Every playback therefore opens with 5 x 10ms = 50ms of digital silence, and the
  #   clock transient lands inside it. Separately the frame callback fires only for
  #   `real_frames > 0` (:231), so spk_frames does not advance during that silence.
  #   Unmuting inside the window costs ZERO audio. At 250ms the unmute would land
  #   ~200ms INTO real speech — audible as a clipped start, and mid-signal, so the
  #   unmute itself would click. At 10ms it lands in the silence.
  #
  # is_running() flips in the speaker's own loop() (i2s_audio_speaker.cpp:69), the
  # same main loop as this interval, so detection is typically 10-20ms after the
  # enable. The one thing that could push it past 50ms is a long main-loop block —
  # a full display repaint is up to 60ms. If a faint tick ever survives at the very
  # start of audio, that is the cause, and the lever is main-loop time, not this
  # period.
  #
  # THE FAILURE DIRECTION IS PRESERVED, and it is why this is safe to ship: the
  # condition is re-evaluated against live hardware every 10ms, so a stuck mute
  # cannot persist — the moment audio runs, this unmutes. The worst case remains the
  # pop coming back, never silence.
  - interval: 10ms
    then:
      # ================= THE SILENCE GATE =================
      # A mode that must not speak is enforced by DECLINING TO LIFT the protection
      # that already runs between every utterance — not by interjecting in the audio
      # pipeline. That is the whole design, and it is chosen on this file's own
      # evidence: every previous attempt to insert something into the single
      # announcement pipeline broke speech (the `done` chime on on_end clobbered the
      # reply's FLAC decoder; `enqueue: false` destroys the in-flight item BY DESIGN;
      # the touch tone wedged the shared I2S lock).
      #
      # It is also the ONLY approach where nothing else has to be re-verified. The
      # media_player still fetches and plays, the I2S driver still loads,
      # on_tts_start/on_end still fire on schedule, chime_until and tts_est_ms stay
      # correct, and the display's promotion to SPEAKING plus the paging timer are
      # untouched. The requirement is "everything else including displaying what it
      # says", and this is the approach that changes nothing else BY CONSTRUCTION
      # rather than by inspection.
      #
      # THE PREDICATE IS THE DISPLAY'S OWN. `spk->is_running() && !chiming` is
      # character-for-character what the display lambda uses to promote to SPEAKING,
      # so the thing silenced is EXACTLY the thing the screen calls speech — one
      # definition, no second source of truth. It is also what separates speech from
      # chimes, which share this speaker: chime_until already means "the audio now
      # playing is not speech", which is precisely the distinction mode 1 needs.
      #
      # va_state is deliberately NOT consulted: it reads 0 for the entire duration of
      # a spoken reply. This asks the hardware, like the chime guard does.
      #
      # FAILURE DIRECTION IS PRESERVED AND INVERTS SAFELY. Re-derived from live
      # hardware every 10ms, so nothing sticks. Wrongly true => silence, which in
      # these modes is the INTENT. Wrongly false => a brief leak. Moving back to
      # Normal mid-reply un-mutes within one tick and the reply continues audibly.
      #
      # COSTS, STATED RATHER THAN HIDDEN: a driver load/unload still happens per
      # reply, and a little power is spent decoding audio nobody hears. Both are
      # cheap, and both buy the "nothing else changes" property above.
      - lambda: |-
          // ---- ONE QUESTION: AM I PERMITTED TO MAKE SOUND RIGHT NOW? ----
          //
          // Two independent things can forbid it, and they are folded into a single
          // predicate rather than checked in separate places:
          //
          //   the MODE   forbids SPEECH (not chimes) at op_mode >= 1
          //   amp_switch forbids EVERYTHING, unconditionally — it is the user's master
          //
          // Making the switch an INPUT to this question rather than a competing writer
          // to the pin is what fixes the old bug: it used to be `platform: output` over
          // amp_enable, so it wrote the GPIO directly and the watchdog's enable branch
          // overrode it on the next playback. Now there is one writer and one question.
          //
          // >>> The switch therefore genuinely SILENCES rather than recording a desire,
          //     and it does so with BOTH layers: the amp is disabled (see `want` below)
          //     AND the DAC is held muted for the duration of any playback. Belt and
          //     braces, because the amp is the half nothing in ESPHome can clear and
          //     REG31 is the half that survives Amp Blank Width = 0. <<<
          const bool chiming = (int32_t) (id(chime_until) - millis()) > 0;
          const bool is_speech = id(spk)->is_running() && !chiming;
          // The second clause covers a case that is UNREACHABLE TODAY and is here for
          // exactly that reason. In Hush the `chime` wrapper returns before playing, so
          // no chime audio ever starts and the gate never sees one — but the gate would
          // have classified it as not-speech and PERMITTED it. Any future sound path
          // that bypasses the wrapper (a raw play_on_device_media_file somewhere else)
          // would therefore leak in the mode whose whole promise is silence.
          //
          // Same doctrine as the mute inversion and the chime guard asking
          // spk->is_running(): cover call sites that do not exist yet, rather than the
          // ones we happen to have thought of. Costs one clause and makes Hush silent
          // at the hardware rather than silent by the convention that everything goes
          // through one script.
          const bool permitted = id(amp_switch).state &&
                                 !(is_speech && id(op_mode) >= 1) &&
                                 !(chiming   && id(op_mode) >= 2);
          id(snd_block) = id(spk)->is_running() && !permitted;
      - if:
          condition:
            lambda: 'return id(dac_muted) && id(spk)->is_running() && !id(snd_block);'
          then:
            - script.execute: dac_unmute

      # ⚠️ RE-ASSERTED ON A CADENCE, AND NOT GATED ON OUR OWN BOOKKEEPING.
      #
      # `!id(dac_muted)` would be the obvious guard and it is exactly wrong, because
      # the things that clear REG31 behind our back do not update `dac_muted`.
      # Verified against the ESPHome source:
      #
      #   I2SAudioSpeakerBase::set_volume() calls audio_dac_->set_mute_off() for any
      #   volume > 0, and SpeakerMediaPlayer::set_volume_ calls that AND
      #   set_mute_state_(false). So ANY HA media_player.volume_set / volume_up /
      #   volume_down / unmute clears the mute TWICE OVER, mid-playback, while
      #   `dac_muted` still says true.
      #
      # A guard on our own flag would therefore be silently bypassed — the precise bug
      # shape this file keeps paying for: correct-looking state, wrong hardware. So the
      # gate re-states itself to the hardware every 250ms while closed, which bounds
      # any unenumerated clearer to a quarter second instead of to forever.
      #
      # (The device's OWN volume path is safe — number.spk_volume ->
      # audio_dac.set_volume writes REG32 only. It is the HA media_player surface that
      # is not, which is why on_volume also re-asserts.)
      - if:
          condition:
            lambda: |-
              return id(snd_block) &&
                     (id(gate_ms) == 0 || millis() - id(gate_ms) >= 250u);
          then:
            - audio_dac.mute_on: es8311_dac
            - lambda: |-
                id(dac_muted) = true;
                id(remute_at) = 0;
                id(gate_ms) = millis();
                if (id(gate_ms) == 0) id(gate_ms) = 1;
      - if:
          condition: { lambda: 'return !id(snd_block) && id(gate_ms) != 0;' }
          then:
            - lambda: 'id(gate_ms) = 0;'

      # ---- AND RE-MUTE THE MOMENT AUDIO STOPS: default-muted at idle ----
      #
      # This is the symmetric half, and it generalises the fix instead of chasing
      # cold starts one at a time. Previously the mute was asserted at two SPECIFIC
      # places (boot, and talk_begin), which protected the transients we happened to
      # have thought of. JP's result proved the mechanism works — exempting the talk
      # tap from the haptic removed the touch pop entirely — but also isolated the one
      # we had NOT covered: the REPLY's own driver cold start, ~2.95s after the chime,
      # because the 500ms driver timeout unloads the driver during the gap while Piper
      # synthesises. Nothing was in position to mute that one.
      #
      # Holding the DAC muted whenever the speaker is stopped means EVERY cold start
      # begins muted, including ones nobody has enumerated yet — the same reason the
      # chime guard asks `spk->is_running()` rather than tracking per-call-site flags.
      #
      # It costs ZERO audio, for the reason documented above: every playback preloads
      # 5 x 10ms of memset-zero silence before calling i2s_channel_enable(), so the
      # unmute above lands inside that window. This mute lands after the LAST frame,
      # which is quieter still.
      #
      # Failure direction is preserved and it is why this is safe: the condition is
      # re-evaluated against live hardware every 10ms, so a stuck mute cannot persist.
      # The moment audio runs, the branch above unmutes it. Worst case is the pop
      # returning, never silence.
      #
      # DELAYED BY 200ms, not immediate. Asserting REG31 mute steps the DAC output
      # while the amp is still enabled — the same class of event as the transient this
      # whole subsystem exists to suppress, just at the other end of playback. Two
      # things argued it was harmless and one argued it was not, and CORRECTING THE
      # DATASHEET ERROR (#3) REMOVES ONE OF THE TWO — so the conservative choice below
      # is now better justified than when it was made, not worse:
      #
      #   harmless: the last frame is end-of-speech near-silence.               STANDS.
      #   harmless: "ES8311 mute is normally a soft step".                      FALSE.
      #             DAC_RAMPRATE is bits 7:4 and the driver writes 0x08, which sets
      #             them to 0 = soft ramp DISABLED; bit 3 is DAC_EQBYPASS. The mute is
      #             a HARD STEP. This was the second of the two places that asserted
      #             slewing; the other was the pop-suppression block above.
      #   harmful:  this board's 0.39uF coupling caps are worst-case for pop per the
      #             amp's own datasheet.                                       STANDS.
      #
      # So it is one argument against and one for, on a board already known to be
      # worst-case. Rather than bet, the mute waits until the output has settled.
      #
      # 200ms also coalesces bursts: a volume tap that plays a tick every few hundred
      # ms would otherwise mute and unmute between every one.
      #
      # The deadline is CANCELLED if audio resumes, so a reply that stutters does not
      # get muted mid-sentence.
      - if:
          condition:
            lambda: 'return !id(dac_muted) && !id(spk)->is_running() && id(remute_at) == 0;'
          then:
            - lambda: 'id(remute_at) = millis() + 200u; if (id(remute_at) == 0) id(remute_at) = 1;'
      - if:
          condition:
            lambda: 'return id(remute_at) != 0 && id(spk)->is_running();'
          then:
            - lambda: 'id(remute_at) = 0;'
      - if:
          condition:
            lambda: |-
              return id(remute_at) != 0 &&
                     (int32_t) (millis() - id(remute_at)) >= 0;
          then:
            - audio_dac.mute_on: es8311_dac
            - lambda: 'id(dac_muted) = true; id(remute_at) = 0;'

      # ---- THE AMP FOLLOWS THE SPEAKER ----
      #
      # JP's two reports on the SAME build are a controlled experiment, and they point
      # at the amp rather than the codec:
      #
      #   mic cold start   (in talk_begin)  DAC muted + amp blanked  -> NO POP
      #   reply cold start (after the gap)  DAC muted, amp NOT       -> POP
      #
      # Both are MCLK restarts on the same clock domain. The only difference is the
      # amp blank. And the codec mute is now positively excluded: the watchdog holds
      # REG31 muted whenever the speaker is stopped, so the DAC was provably muted
      # before the reply's cold start — and it popped anyway. Every documented ES8311
      # anti-pop mechanism is counted in LRCK periods, which is exactly the resource
      # that stops. The bit persists; it just has no effect.
      #
      # So gate the AMP on the same signal, for the same reason the mute inversion
      # exists: cover every cold start, including ones nobody has enumerated, instead
      # of adding a third specific site. This SUPERSEDED talk_begin's amp_blank call,
      # which has since been deleted along with the script (#17) — at a tap the speaker
      # is already stopped, so the amp is already off.
      #
      # >>> THE COST IS REAL AND IS AUDIBLE: ~50ms of soft start on every reply. <<<
      # The FM8002E's wake is ~100ms typical but a playback only preloads 5 x 10ms of
      # silence, so the amp is still waking when the first ~50ms of speech arrives —
      # the first phoneme is attenuated. That is the trade: a soft onset instead of a
      # click. It is JP's ear that decides, so it is A/B-able live — the Amp Blank
      # Width number gates this whole branch, and setting it to 0 restores the amp
      # permanently and brings the pop back.
      #
      # Why "last speaker activity -> reply" and not "chime -> reply": the driver is
      # idle for ~7s across a turn (measured 19:07:05.910 -> 12.718), because the span
      # includes the user's own speech, STT and the LLM. So no realistic TTS speedup
      # keeps the driver loaded — `timeout` would have to be ~10s, which is
      # functionally `never`, which starves the microphone. Closing the synthesis gap
      # is still worth doing for the dead air; it is not a fix for this.
      #
      # >>> AND THE DEVICE IS ALREADY READY FOR IT — #11 NEEDS NO FIRMWARE CHANGE AND
      #     NO FLASH. <<< Verified in ESPHome's source rather than assumed:
      #     voice_assistant.cpp:812-825 handles VOICE_ASSISTANT_INTENT_PROGRESS and, if
      #     HA sends `tts_start_streaming` == "1" with a non-empty response URL, plays
      #     that URL immediately and enters STREAMING_RESPONSE — i.e. it begins speaking
      #     while Piper is still synthesising. It is gated on NOTHING in this file: no
      #     `streaming:` option, no flag, only `media_player:` being configured, which
      #     it is. `started_streaming_tts_` then suppresses the duplicate play at :886.
      #
      # So the ~2.8s of dead air is entirely HA's to close (streaming-capable TTS, or a
      # `low`-quality voice). Do NOT add a device-side workaround for it, and do not
      # reintroduce on_tts_stream_start looking for one — see the note on the
      # voice_assistant block, where those triggers are a validation error without
      # `speaker:`. The firmware's part of #11 is already done and was done before the
      # issue was filed.
      # ---- AMP BLANKING: the only lever downstream of the codec ----
      #
      # WHY DAC MUTE CANNOT FIX THE TAP-TO-START POP.
      #   `use_mclk: true` — MCLK is generated by the ESP32's I2S port, and the port only
      #   drives it while a channel is loaded. When BOTH the speaker and the mic are
      #   unloaded, MCLK STOPS ENTIRELY, and the ES8311 is a fully clock-dependent codec:
      #   with no MCLK its sigma-delta modulator and internal bias have no clock to run
      #   on. REG31 mute is enforced INSIDE that same clock domain, so it cannot hold the
      #   analog output across an MCLK stop/start — there is no clock with which to
      #   enforce it. That is a mechanism-level limit, not a tuning problem, and it
      #   explains the surviving pop precisely: tapping to talk starts the MICROPHONE,
      #   which restarts MCLK on the shared port while the DAC is muted and pops anyway.
      #
      # ── ONE PART, TWO NAMES ───────────────────────────────────────────────────────
      # This file used to call the amplifier SC8002B here and FM8002E above, which read
      # as two different chips. Settled on FM8002E, because that is where the numbers we
      # actually depend on come from: Ci 0.1-0.39uF and TD = 100ms typical are read off
      # the FM8002E datasheet specifically, and the ~100ms wake sets the floor under
      # amp_blank_ms.
      #
      # They are very likely the same part — FM8002E's vendor is 深圳市富满电子 /
      # superchip.cn, i.e. SC = SuperChip — and SC8002B is what the board schematic
      # prints. But pin-for-pin equivalence is UNCONFIRMED, so this is a naming decision
      # made for traceability, not an identification. If a measurement ever disagrees
      # with the datasheet, that gap is the first thing to suspect.
      # ──────────────────────────────────────────────────────────────────────────────
      #
      # SO THE ONLY REMAINING SOFTWARE LEVER IS THE AMPLIFIER. GPIO1 is a real hardware
      # disconnect on the FM8002E (schematic silkscreen says SC8002B — see above;
      # "Audio power amplifier circuit"), downstream of everything the codec does, so it
      # suppresses clock clicks that no codec register can reach.
      #
      # THE COST IS UNMEASURED AND MIGHT EXCEED THE BENEFIT. The FM8002E is bridge-tied,
      # so on enable both outputs slew together and the DIFFERENTIAL the speaker sees
      # should stay small — that is the argument for expecting a quiet enable. But it is
      # an argument, not a measurement, and a permanently-enabled amp is also the reason
      # there is no idle hiss today.
      #
      # Defaulted ON only because the baseline it replaces is a KNOWN audible pop with
      # zero mitigation, so any change is measurable against a bad known state.
      # >>> If the amp's own enable click is worse than the pop, set amp_blank_ms to 0
      #     and this becomes a no-op with no other edits needed. <<<
      #
      #
      # ---- ONE DESIRE, COMPARED AGAINST ONE TRACKED REALITY ----
      #
      # Replaces the two condition-pair branches that used to live here. They could not
      # express `amp_switch` correctly: the enable branch did not consult it at all,
      # and bolting the check on would have left `amp_off` able to desync from the
      # hardware whenever the switch was toggled (switch writes the GPIO, shadow flag
      # does not follow, and then neither branch fires because both are guarded on that
      # same stale flag — the amp then sits electrically live across the next cold
      # start, i.e. the pop returns for one playback after every switch-on).
      #
      # Computing the DESIRE once and comparing it to the tracked state is immune to
      # that: one writer, one comparison, and a mismatch is always corrected on the
      # next tick. `amp_off` is still tracked purely so an unchanged desire costs no
      # GPIO write at 100Hz.
      #
      # >>> THE AMP IS THE LOAD-BEARING HALF OF THE SILENCE GATE. <<<
      # `snd_block` is an independent conjunct here, so it forces the amp off
      # REGARDLESS of Amp Blank Width — including at 0, which the old branch structure
      # could not have expressed. That matters because the amp is a hardware disconnect
      # downstream of everything the codec does, and nothing in ESPHome's audio stack
      # touches it; the REG31 mute above is the half that can be cleared behind our
      # back. Two halves, failing in different directions.
      #
      # >>> THE COST IS REAL AND IS AUDIBLE: ~50ms of soft start on every reply. <<<
      # Unchanged by this rewrite, and not removable by scheduling — an amp awake
      # across the MCLK cold start is precisely what brings the pop back. The lever is
      # padding the audio, not moving the gate.
      #
      # ⚠️ AND THE PADDING CANNOT BE DONE FROM THIS DEVICE (#12). The obvious
      # device-side version — play ~100ms of silence at on_tts_start so the amp wakes
      # during it — is not merely redundant, it is IMPOSSIBLE, and the reason is one
      # flag in ESPHome's own source:
      #
      #   reply    voice_assistant.cpp:817 and :886
      #            make_call().set_media_url(url).set_announcement(true).perform()
      #            -> NO enqueue command
      #   announce voice_assistant.cpp:1064-1067
      #            .set_command(MEDIA_PLAYER_COMMAND_ENQUEUE)
      #
      # and in speaker_media_player.cpp:152-164, `if (!enqueue)` runs
      # `announcement_playlist_.clear()` and then start_url(). So a reply's own play
      # call CLEARS whatever we queued ahead of it. A silent pad would be destroyed by
      # the very audio it was padding — and it would be worse than doing nothing,
      # because it would load the driver, get wiped, and add one more clock stop/start
      # to a path whose entire problem is clock stop/starts.
      #
      # THIS IS WHY THE ANNOUNCE-PATH CORROBORATION DOES NOT TRANSFER. #12 notes,
      # correctly, that pushed announcements have no soft onset because the herald is
      # enqueued ahead of them. That is true and it is evidence the mechanism is right —
      # but it works ONLY because the announce path sets ENQUEUE and the reply path does
      # not. A reused mechanism does not carry its guarantees with it (#23's lesson, in
      # audio instead of navigation).
      #
      # AND THE EXISTING 50ms OF PRELOAD IS A HARDCODED CONSTANT, NOT A KNOB — this is
      # the lever that looks most promising and it is closed too. The ~50ms residual
      # exists because a playback preloads 5 x 10ms of memset-zero silence before
      # i2s_channel_enable(). If that were configurable, raising it WOULD be padding the
      # audio, on the device. From i2s_audio_speaker_standard.cpp:23-24:
      #
      #     static constexpr uint32_t DMA_BUFFER_DURATION_MS = 10;
      #     static constexpr size_t   DMA_BUFFERS_COUNT      = 5;
      #
      # Both are file-local `static constexpr` in the component, exposed to no YAML
      # option, so changing them means forking a core ESPHome component. And they are
      # not inert: WRITE_TIMEOUT_TICKS is DMA_BUFFER_DURATION_MS * (DMA_BUFFERS_COUNT+1)
      # and dma_buffers_duration_ms feeds the ring-buffer sizing — so buying 50ms of amp
      # runway also moves the write timeout and the buffer budget on a board whose
      # display already competes for main-loop time. That competition is why
      # `buffer_duration` is 500ms and not 100ms, and it was AUDIBLE. A poor trade for
      # one phoneme, and it would need re-verifying against choppiness rather than
      # arguing.
      #
      # So the padding has to come from wherever the TTS audio is PRODUCED, i.e. HA.
      # Nothing on the device can substitute, and no amount of firmware cleverness
      # changes the flag on someone else's `make_call()`.
      - lambda: |-
          // `snd_block` already carries amp_switch (it is an input to `permitted`
          // above), so this does not re-test it — one question, asked once. Naming it
          // twice is how the two writers got out of step in the first place.
          const bool want = !id(snd_block) &&
                            id(amp_switch).state &&
                            (id(amp_blank_ms_g) == 0 || id(spk)->is_running());
          if (want == id(amp_off)) {          // amp_off means "currently disabled"
            if (want) id(amp_enable)->turn_on();
            else      id(amp_enable)->turn_off();
            id(amp_off) = !want;
          }

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# N16R8 module: 8MB OPI (octal) PSRAM. Octal consumes GPIO33-37 —
# do not use those pins. Without this, display buffers won't fit.
psram:
  mode: octal
  speed: 80MHz

logger:
  # NOTE: the i2c bus scan prints at [C]/CONFIG level, and in ESPHome's
  # ordering CONFIG is MORE verbose than INFO — so level: INFO silently
  # hides the scan results. Keep DEBUG until bring-up is finished.
  level: DEBUG
  #
  # TO VERIFY THE BANDED REDRAW (the one test that matters), swap the above for
  # the block below. mipi_spi logs both the dirty box and the flush time every
  # frame (mipi_spi.h:570, 575-576) at VERBOSE.
  #
  # The global `level:` is a COMPILE-TIME ceiling — esph_log_v is compiled out
  # entirely unless the global level is VERBOSE, so per-tag VERBOSE alone does
  # nothing. Raise the global and dial the noisy tags back down:
  #
  # level: VERBOSE
  # logs:
  #   mipi_spi: VERBOSE
  #   sensor: INFO
  #   voice_assistant: DEBUG
  #   esp32_rmt_led_strip: INFO
  #   i2s_audio: INFO
  #
  # Expected on a SPEAKING frame:  "x_low 0, y_low 188, x_high 239, y_high 263"
  #                                "Total update took 10..13ms"
  #
  # That upper figure was 7..10ms before the hearth-wyrm landed in this band. The
  # wyrm covers ~25% of the band's area and its per-pixel shading is the added cost,
  # so 10..13ms IS the healthy reading now. Anyone comparing against the old number
  # would report the wyrm as a performance regression — which is why it is corrected
  # here rather than left for the reader to reconcile. If it exceeds ~16ms, the two
  # documented flame-loop optimisations (cache the neck; restrict the per-pixel loop
  # to the stage columns) are the levers, in that order.
  # Expected between ticks:        nothing at all (empty box -> flush skipped,
  #                                mipi_spi.h:573).
  # If a flame frame logs y_low 0, band isolation is broken.

api:
  encryption:
    key: !secret api_key
  # Wake word can only be armed once HA is actually on the other end: arming is
  # `voice_assistant.start_continuous`, which sends a pipeline-start request over
  # this connection. Arming in on_boot would race the WiFi/API handshake and lose.
  #
  # This fires for ANY api client (the esphome CLI and the OTA dashboard included),
  # not just HA. That is harmless — wake_word_arm is `mode: restart` and no-ops when
  # the assistant is already running — but it is why the arm lives in a guarded
  # script rather than being inlined here.
  # ---- slack_note: the bridge tells us which conversation an announce
  # belongs to (contract: slack-bridge.md "Voice replies"; the ha session's
  # brief, 2026-08-09). Matches the newest announce entry with this exact
  # speech and stamps its channel; falls back to the newest announce when the
  # text drifted (the bridge may trim). The chronicle's reply button reads it.
  services:
    - service: slack_note
      variables:
        channel: string
        speech: string
      then:
        - lambda: |-
            int fallback = -1;
            for (int i = (int) id(chron).size() - 1; i >= 0; i--) {
              const std::string &e = id(chron)[(size_t) i];
              if (e.empty() || e[0] != 'a') continue;
              if (fallback < 0) fallback = i;
              if (e.substr(1) == speech) {
                id(chron_chan)[(size_t) i] = channel;
                return;
              }
            }
            if (fallback >= 0) id(chron_chan)[(size_t) fallback] = channel;
    # ---- show_image: the vision (2026-08-24, JP: "add the ability to
    # display slack images"). Bridge 1.4.0 stashes the announced image's
    # thumb at HA's /local/ember/ and the ember_slack_vision automation
    # relays it here. The device fetches over TLS (edge name, IDF cert
    # bundle) into PSRAM; on_download_finished is what opens the vision,
    # so a failed fetch degrades to the spoken announce and nothing else.
    - service: show_image
      variables:
        url: string
        caption: string
        urls: string
      then:
        - lambda: |-
            id(vision_caption) = caption;
            // urls (2026-08-24 evening, JP sent two photos and saw one):
            // ALL of the message's images as '|'-packed /local paths; url
            // stays as the absolute first for compatibility. Swipe moves
            // vision_idx through the set.
            std::string pk = urls;
            if (pk.empty()) {
              size_t sl0 = url.find("/local/");
              pk = (sl0 == std::string::npos) ? url : url.substr(sl0);
            }
            id(vision_urls) = pk;
            id(vision_idx) = 0;
            id(vision_url) = url;
            id(vision_view) = 0;
            id(vision_px) = 0;
            id(vision_py) = 0;
            // Stamp the newest announce entry with the WHOLE set (JP:
            // images "should appear in the chronicle") — same newest-'a'
            // targeting as slack_note's fallback: the announce this image
            // rode in on is seconds old at most. Stored as /local paths so
            // an edge-name change can't strand the chronicle.
            for (int i = (int) id(chron).size() - 1; i >= 0; i--) {
              const std::string &e = id(chron)[(size_t) i];
              if (!e.empty() && e[0] == 'a') {
                id(chron_img)[(size_t) i] = pk;
                break;
              }
            }
        - lambda: 'id(vision_img)->set_url(id(vision_url).c_str());'
        - component.update: vision_img
  on_client_connected:
    - script.execute: wake_word_arm

ota:
  - platform: esphome
    password: ${ota_password}

# ---- the vision's plumbing (2026-08-24) ----
# http_request exists for online_image; TLS to the HA edge rides the ESP-IDF
# certificate bundle (Let's Encrypt roots included), and the ~45KB handshake
# heap is fine on this PSRAM board. online_image holds ONE image — the newest
# vision — as RGB565 in PSRAM (240x188 = ~90KB); resize downscales the
# bridge's thumb_480 at decode to fit the overlay's image area (232px minus
# title and caption strips). update_interval: never — the show_image service
# is the only trigger, so the device never polls for a picture nobody sent.
http_request:
  timeout: 15s

online_image:
  # The FIT buffer: fullscreen-capable (240x320) since the tap-to-fullscreen
  # work — the framed view draws it through a clipping rect instead of a
  # smaller buffer, so one fetch serves both views. ~150KB RGB565 in PSRAM.
  - id: vision_img
    url: "https://ha.jphe.in:8123/local/ember/placeholder.jpg"
    format: jpeg
    type: RGB565
    resize: 240x320
    update_interval: never
    on_download_finished:
      - lambda: |-
          // Entered HERE, not in the service: a vision only opens once its
          // image is actually in memory, so mode 8 can never paint a stale
          // or half-fetched frame. Same action-only discipline as every
          // opener since the tome's per-report bug.
          id(ui_last_ms) = millis();
          id(ui_sel) = -1;
          id(ui_action) = 0;
          id(ui_mode) = 8;
          id(ui_gen)++;
    on_error:
      - lambda: 'ESP_LOGW("vision", "image fetch failed - staying on the hearth");'
  # The ZOOM buffer: the stash is a 480-wide thumb and the panel is 240, so
  # decoding at up to 480 yields true 2x detail. Fetched lazily on the first
  # pinch-out per image (zoom_url tracks which image it holds); ~355KB RGB565
  # in PSRAM. While it downloads, the zoomed view shows the fit buffer.
  - id: zoom_img
    url: "https://ha.jphe.in:8123/local/ember/placeholder.jpg"
    format: jpeg
    type: RGB565
    resize: 480x376
    update_interval: never
    on_download_finished:
      - lambda: |-
          if (id(ui_mode) == 8 && id(vision_view) == 2) id(ui_gen)++;
    on_error:
      - lambda: 'ESP_LOGW("vision", "zoom fetch failed - staying at fit scale"); id(zoom_url) = "";'

# ---- douse (2026-08-24, JP: "an off option") ----
# Deep sleep until the BOOT button is pressed — the battery alarm has said
# "or bid me goodnight" since the ladder was built, and this is finally that.
# GPIO0 is RTC-capable and already the board's one button; pressing it (LOW)
# wakes the chip cold, which is a full reboot into a normal boot. While
# doused: no display, no radio, no OTA — recovery is the same button. On the
# desk unit this works identically; it is simply "off until pressed".
deep_sleep:
  id: hearth_sleep
  wakeup_pin:
    number: GPIO0
    inverted: true
    ignore_strapping_warning: true
    # GPIO0 is ALSO the BOOT binary_sensor — deliberately: one button, two
    # roles, in two non-overlapping lifetimes (awake it clicks; asleep it
    # wakes). allow_other_uses on both is the schema's way of saying we did
    # this on purpose.
    allow_other_uses: true
    mode:
      input: true
      pullup: true

# ⚠️ THE RECOVERY PATH FOR A BOARD YOU CANNOT REACH WITH A CABLE.
#
# Added 2026-08-03 with the mobile variant (#44), and it is that board that makes
# it necessary rather than merely tidy: the desk unit is on a bench with a USB-C
# socket in easy reach, so a failed OTA there costs a cable. The mobile unit lives
# behind 2 x M3x22 and a battery cover, so the same failure costs a disassembly of
# a device with a bare 18650 in it.
#
# What it buys: if the firmware reboots repeatedly (num_attempts), the next boot
# comes up with WiFi and the OTA server ONLY — no display, no I2S, none of the
# code that might be the thing crashing — so a fixed build can be pushed over the
# air. Without it, a boot-looping board is only recoverable over serial.
#
# boot_is_good_after is the important number, not num_attempts: a boot is only
# "successful" once the device has stayed up this long, so a crash 20 s in still
# counts as a failed boot and still counts toward safe mode. Defaults are used
# deliberately (10 attempts / 1 min / 5 min reboot timeout) — this has never had
# to fire, so there is no measurement here to justify tuning them.
safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

########################  buses  ########################

# ES8311 codec (0x18) and FT6336G touch (0x38) share one bus.
i2c:
  - id: i2c_bus
    sda: GPIO16
    scl: GPIO15
    frequency: 100kHz
    scan: true

spi:
  - id: lcd_spi
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

########################  audio  ########################

i2s_audio:
  - id: i2s_bus
    i2s_mclk_pin: GPIO4
    i2s_bclk_pin: GPIO5
    i2s_lrclk_pin: GPIO7

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_bus
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true
    # ESPHome's default mic_gain is 42DB — the MAXIMUM. Stacked on
    # voice_assistant's auto_gain: 31dBFS and volume_multiplier: 2.0 that
    # clips and pins the dBFS meter. Start conservative; this is tuning
    # knob #2 after the mic channel question.
    mic_gain: 36db
    # Deliberately NOT setting use_microphone: true.
    # In ESPHome's es8311 driver that flag enables a PDM *digital* mic.
    # This board's mic is an ANALOG MEMS part wired differentially into
    # MIC1P/MIC1N, so the default (false) is correct — it leaves
    # REG14 = 0x1A ("analog MIC + max PGA gain").

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO8        # -> ES8311 DSDIN (schematic net I2S_DI)
    dac_type: external
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    # 500ms is ESPHome's OWN DEFAULT. This was 100ms — copied from the
    # m5stack-atom-echo config, which has NO DISPLAY competing for the main
    # loop. Here a full display frame blocks the loop for up to 60ms and a
    # scroll-band repaint for 18-22ms, and the scroll band repaints on
    # on_tts_start — i.e. exactly when playback begins. 100ms of runway
    # against a 60ms blocking redraw is a coin flip, and JP heard it as
    # choppy audio. At 16kHz/16-bit mono this is 16000 bytes; PSRAM is free.
    # >>> Do not lower this to "save memory". The memory is not the scarce
    #     resource here; main-loop time is. <<<
    buffer_duration: 500ms

    # ⚠️ TWO DIFFERENT 500ms VALUES LIVE ON THIS COMPONENT. Do not conflate them.
    # buffer_duration (above) is the measured choppiness fix and STAYS at 500ms.
    # `timeout` is a different problem: how long the driver stays LOADED after the
    # last audio. While loaded, the speaker holds I2SAudioComponent's single shared
    # `Mutex lock_` (i2s_audio.h:64-71). The microphone acquires that lock with a
    # NON-BLOCKING try_lock() (i2s_audio_microphone.cpp:98) and on failure backs off
    # a FULL SECOND:
    #     "Driver failed to start; retrying in 1 second"
    #     status_momentary_error("driver_fail", 1000)    (:399-403)
    #
    # So at the 500ms default, ANY touch-to-talk within ~500ms of audio ending —
    # Ember finishing a reply, the done chime, an announcement — costs a 1.0s mic
    # stall with an error in the log that reads like a hardware fault. Pre-existing,
    # not new; 100ms shrinks the window it can happen in by 5x.
    #
    # This is only safe BECAUSE the DAC-mute manager below fixes the pop: a shorter
    # timeout means more driver load/unload cycles, and until now every one of those
    # was an audible transient. Fixing the pop is what makes this tunable at all.
    #
    # >>> Do NOT set `timeout: never`. It would remove the transient entirely and
    #     silently starve the microphone forever — try_lock() could never succeed,
    #     and the only symptom is "Ember can't hear me". <<<
    #
    # REVERTED 100ms -> 500ms (Revision 8), because 100ms made the pop WORSE and
    # did not fix what it was aimed at.
    #
    # It was lowered to shrink the window where the speaker holds the shared lock and
    # starves the mic. But the captured log shows the contention running the OTHER
    # way: the SPEAKER failing with "Parent bus is busy" because the MIC held the lock
    # for the length of an utterance. No `timeout` value affects that direction.
    #
    # Meanwhile it multiplied driver cycles: at 100ms, six volume taps in two seconds
    # are six full load/unload cycles (JP's log shows exactly that — six
    # Starting/Stopped pairs). At 500ms they COALESCE into one session, because the
    # driver stays loaded between taps. Since each cycle is a clock stop/start, cycle
    # count is what correlates with audible artifacts — so a longer timeout is the
    # cheap, certain reduction.
    #
    # The mic-starvation problem it was meant to solve is now handled precisely in the
    # `talk_begin` script, which WAITS for the speaker to release the lock instead of
    # letting the mic's blind 1-second backoff absorb it.
    timeout: 500ms

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO6         # -> ES8311 ASDOUT (schematic net I2S_DO)
    adc_type: external
    pdm: false                 # analog mic behind the codec, not PDM
    channel: left              # ES8311 is mono; ADC data sits in the LEFT slot
    sample_rate: 16000
    bits_per_sample: 16bit
    # NOTE: deliberately NO on_data lambda here.
    #
    # on_data fires at 62.5Hz (i2s_audio_microphone.cpp READ_DURATION_MS = 16)
    # and its automation runs SYNCHRONOUSLY inside mic_task — priority 23,
    # 4096-byte stack. Anything slow there directly starves the I2S read, and
    # writing globals from that task while the main loop reads them for drawing
    # is a cross-task race.
    #
    # sound_level (below) gives the same information at 20Hz through a proper
    # lock-free ring buffer and publishes from loop(), so its on_value runs in
    # the main loop. Since a visual waveform only needs ~16-20Hz anyway, the
    # hand-rolled path bought nothing and cost thread-safety. Everything that
    # touches the display now runs single-threaded in the main loop.
    #
    # (The one exception, added deliberately and kept to a single 32-bit add,
    # is the speaker frame counter registered in on_boot. See the note there.)

output:
  - platform: gpio
    id: amp_enable
    pin: GPIO1                 # amp SHUTDOWN — ACTIVE LOW
    inverted: true

  - platform: ledc
    id: backlight_pwm
    pin: GPIO45                # Also the VDD_SPI strapping pin, but SAFE here:
    frequency: 20000Hz         # the schematic has R32 = 10K gate-to-GND on the
                               # BSS138 that drives the backlight, which hard-
                               # wires the strap LOW in hardware. The strap is
                               # latched at reset while GPIO drivers are still
                               # inputs, so R32 always wins — no firmware
                               # setting can cause the 1.8V brownout.
                               # Active-HIGH, so no `inverted:`.
                               # Screen dark through boot is expected.

  # GPIO18 = CTP_RST is deliberately left UNCONFIGURED.
  #
  # The schematic shows no pull-up/pull-down on this net, so in principle it
  # floats and should be driven — Oracle flagged that, correctly in theory.
  # But empirically, BOTH attempts to touch this pin broke the touch driver:
  #   - `reset_pin: GPIO18` on the touchscreen  -> "touch driver failed to start"
  #   - a gpio `output:` held high at on_boot   -> "touch driver failed to start"
  # Left unconfigured, the FT6336 pulls RSTN high internally and reports
  # chipid 100. celer's config (the only other working one for this board)
  # also omits it. Tested beats derived.
  #
  # FOLLOW-UP: proper reset handling probably needs a timed low pulse BEFORE
  # i2c setup, not a static level. Tracked as hardening, not shipped blind.

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON

  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    pin: GPIO42
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    # `pulse` is registered via register_monochromatic_effect(), which also
    # appends it to ADDRESSABLE_EFFECTS (light/effects.py:126-139) — so it is
    # valid on a WS2812. Costs no LCD SPI at all.
    effects:
      - pulse:
          name: bank
          transition_length: 2s
          update_interval: 2s
          min_brightness: 8%
          max_brightness: 22%
      - pulse:
          name: crucible
          transition_length: 350ms
          update_interval: 350ms
          min_brightness: 45%
          max_brightness: 100%

########################  runtime controls  ########################
# Live-adjustable from HA so tuning doesn't need a reflash. The es8311 boots
# at set_volume(0.75) = 0dB (es8311.cpp:33), which JP reported as too loud.
number:
  - platform: template
    id: spk_volume
    name: Speaker Volume
    icon: mdi:volume-high
    optimistic: true
    restore_value: true
    initial_value: 45
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    set_action:
      - audio_dac.set_volume:
          id: es8311_dac
          volume: !lambda 'return x / 100.0f;'

  # MIC GAIN — the ES8311's analog ADC PGA, made live.
  #
  # It was a compile-time constant (`mic_gain: 36db` on the audio_dac). That is the wrong
  # shape for a knob whose correct value depends on the room, the speaker's distance and
  # how loudly they talk — every adjustment cost a reflash.
  #
  # ⚠️ THE STEP IS 6dB AND THAT IS NOT A STYLE CHOICE. REG16 takes a 3-bit field with
  # exactly eight legal values, 0/6/12/18/24/30/36/42 dB (ES8311MicGain in the driver's
  # header). Nothing between them is representable, so a continuous slider would report a
  # setting the hardware cannot hold. Quantise here rather than silently rounding later.
  #
  # WHY IT WRITES THE REGISTER DIRECTLY. `set_mic_gain()` only assigns a member — the
  # driver writes REG16 once, in setup() (es8311.cpp:200). Calling the setter alone changes
  # nothing until the next boot, which would look exactly like a control that does not work.
  # So both happen: the member is kept honest for any later re-init, and the register is
  # written for the change to take effect now.
  #
  # DEFAULT 36dB, DELIBERATELY BELOW THE MAXIMUM. ESPHome's own default is 42dB — the top of
  # the range — and stacked on voice_assistant's auto_gain and volume_multiplier it clips and
  # pins the dBFS meter. Higher is not better here: it is more sensitive AND more clipped.
  - platform: template
    id: mic_gain_num
    name: Mic Gain
    icon: mdi:microphone-settings
    optimistic: true
    restore_value: true
    initial_value: 36
    min_value: 0
    max_value: 42
    step: 6
    unit_of_measurement: "dB"
    mode: slider
    set_action:
      - lambda: |-
          // 0..42dB in 6dB steps -> the 3-bit REG16 field, 0..7.
          int g = (int) lroundf(x / 6.0f);
          if (g < 0) g = 0;
          if (g > 7) g = 7;
          id(es8311_dac)->set_mic_gain((es8311::ES8311MicGain) g);
          id(es8311_dac)->write_byte(0x16, (uint8_t) g);   // ES8311_REG16_ADC
          ESP_LOGI("mic", "gain -> %ddB (REG16=0x%02X)", g * 6, g);

  # THE OPEN EXPERIMENT, made turnable. Oracle's adjudication (2026-07-29) found the
  # decisive test had never actually been run: the "pop returned with blanking off"
  # result predates talk_begin's audio_dac.mute_on, so it shows blanking works
  # WITHOUT codec mute — not that codec mute is insufficient WITH it.
  #
  #   0   -> codec mute alone. If the pop returns, the transient is downstream of the
  #          digital mute and amp gating is the primary fix, not a redundant one.
  #   180 -> default. Clears the FM8002E's ~100ms typical wake (TD), the only hard
  #          number in the whole fix.
  #   300 -> headroom, if 180 proves marginal.
  #
  # Changing this cannot strand the amp — the PROPERTY is unchanged and the REASON is
  # not the one that used to be written here.
  #
  # It used to say "amp_blank sets a DEADLINE that the 10ms interval restores". That was
  # already false when written (amp_blank had no callers) and the machinery is now
  # deleted outright (#17). Retargeted rather than removed, because a live control whose
  # comment claims safety from a deleted mechanism is precisely the failure that let the
  # amp_switch bug (#1) hide for as long as it did.
  #
  # The property now holds for a simpler and stronger reason: the amp is a single DESIRE
  # recomputed from live hardware on every 10ms tick —
  #
  #     want = !snd_block && amp_switch.state && (amp_blank_ms_g == 0 || spk->is_running())
  #
  # so there is no pending state for a value change to strand. Set this to 0 and `want`
  # simply stops consulting `is_running()`; nothing has to be unwound, because nothing
  # was latched.
  - platform: template
    id: amp_blank_num
    name: Amp Blank Width
    icon: mdi:flash-off
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    initial_value: ${amp_blank_ms}
    min_value: 0
    max_value: 400
    step: 20
    unit_of_measurement: "ms"
    mode: box
    set_action:
      - lambda: 'id(amp_blank_ms_g) = (uint32_t) x;'

########################  operating mode  ########################
# The HA-facing surface for op_mode. Same shape as the volume control: ONE authority
# (the global) with surfaces that are clients of it, rather than two stores that agree
# by convention. See the `on_volume` note on the media_player for the precedent.
#
# Options are listed quietest-last, so THE OPTION INDEX IS THE STORED VALUE and there
# is no mapping table at all. An earlier draft of this design needed one (and got to be
# clever about it being self-inverse); a monotonic control needs none, which is
# strictly better — a table that does not exist cannot drift.
select:
  - platform: template
    id: sel_mode
    name: Ember Mode
    icon: mdi:hexagon-multiple
    optimistic: true
    restore_value: false        # op_mode is the thing that persists, not this view
    options:
      - "Normal"
      - "No talking"
      - "Hush"
    initial_option: "Normal"
    set_action:
      # ⚠️ `i` IS NOT AVAILABLE HERE. A template select's set_action is a
      # `Trigger<StringRef>` (template/select/template_select.h:69), so the lambda gets
      # the chosen option as `x` and NOTHING ELSE — no index. An earlier draft of this
      # used `i` and `esphome config` reported "Configuration is valid!"; it failed at
      # `esphome compile` with "'i' was not declared in this scope". See the compile-vs-
      # config note in the header.
      #
      # Deriving the index with index_of() is better than a positional assumption
      # anyway: it reads the order off the select's OWN option list, so adding or
      # reordering an option cannot silently change which mode a row means.
      - lambda: |-
          const auto idx = id(sel_mode)->index_of(x.c_str(), x.size());
          if (!idx.has_value() || *idx > 2) return;
          id(op_mode) = (uint8_t) *idx;
          id(ui_gen)++;                  // the header names the mode, so repaint it
          id(force_full_repaint) = true; // one ~60ms frame; a mode change is rare

########################  announce path  ########################
# WHY THIS EXISTS: `assist_satellite.announce` returned HTTP 500 because
# FEATURE_ANNOUNCE is gated STRICTLY on voice_assistant's own media_player
# (voice_assistant.h:168-171). No media_player on voice_assistant => the satellite
# never advertises announce => HA cannot push speech at all: no timer chimes, no
# doorbell TTS, no notifications, only conversational replies.
#
# A standalone media_player NOT wired into voice_assistant does NOT fix it — the
# feature flag would still be unset and announce would still 500. It had to go on
# voice_assistant, which is `cv.Exclusive` with `speaker:` (:110-113).
#
# WHAT THAT COST, AND WHY IT ISN'T A LOSS:
#   Losing `speaker:` forbids on_tts_stream_start/on_tts_stream_end (:82-86), which
#   is what used to set SPEAKING and snapshot the frame counter. The display lambda
#   now DERIVES speaking from the speaker itself (spk->is_running() + frames
#   advancing). That is the same source of truth the animation already used, so the
#   grounding is intact — and it is strictly better, because it also lights up for
#   pushed announcements, which never fire a stream trigger at all.
#
# The frame counter is unaffected: the pipeline calls
# `decoder->add_sink(this_pipeline->speaker_)` — "Send audio directly to the
# speaker" (audio_pipeline.cpp:473-475) — so `spk` is still the direct sink and its
# add_audio_output_callback fires exactly as before. No mixer, no resampler.
media_player:
  - platform: speaker
    id: media_out
    name: Ember Speaker
    # YIELD THE MICROPHONE FOR PUSHED AUDIO. The touch path is covered in ui_dispatch;
    # this is the other way sound starts — an HA announcement, a finished timer — with
    # no tap to hang the yield off.
    #
    # ⚠️ READ THIS BEFORE REUSING on_announcement ANYWHERE ELSE. The unmute manager
    # below explicitly REJECTED this trigger, and that rejection is still correct:
    # on_announcement fires when the media_player enters its announcing state, which is
    # BEFORE the pipeline starts the speaker and before i2s_channel_enable(). Unmuting
    # there lands ahead of the clock transient, so the pop survives.
    #
    # That same early timing is exactly what this needs. "Too early to unmute" is "just
    # in time to hand over the I2S bus" — it fires before the speaker's first try_lock,
    # so the speaker wins the bus immediately instead of failing and retrying a second
    # later. Same trigger, opposite requirement. Do not "unify" the two.
    on_announcement:
      - micro_wake_word.stop:
    # Only the announcement pipeline is needed, and that is what removes the need
    # for a `mixer`: EVERY voice_assistant output path calls .set_announcement(true)
    # — conversational TTS (voice_assistant.cpp:817), streaming TTS (:886) and
    # on_announce (:1061,1067). A media_pipeline would only be for
    # media_player.play_media, and adding one WOULD force a mixer, because
    # announcement and media pipelines may not share a speaker
    # (speaker/media_player/__init__.py:91-100).
    announcement_pipeline:
      speaker: spk
      format: FLAC
      # These are inherited from `spk` if omitted (media_player/__init__.py:91-92),
      # but they are stated explicitly because they are what HA transcodes TO. Left
      # implicit, a future change to the speaker would silently retune the wire
      # format. 16k/mono also matches the es8311, so nothing has to resample and
      # `spk` never restarts mid-stream on a stream-info change.
      sample_rate: 16000
      num_channels: 1
    # Hearth chimes, embedded in flash as progmem (~250KB of the 16MB).
    #
    # `files:` is TOP-LEVEL on the media_player, not per-pipeline
    # (speaker/media_player/__init__.py:156), so these play through the existing
    # announcement_pipeline — no media_pipeline, therefore still no mixer and still
    # no resampler. All six are 16kHz/mono/16-bit, matching `spk` and the es8311
    # exactly, so nothing in the chime path can perturb what spk_frames means.
    #
    # Path is CORE.relative_config_path (audio_file/__init__.py:95). `scratch/sounds`
    # is a symlink to `../esphome/sounds` precisely so this line is IDENTICAL in the
    # scratch copy and the committed esphome/ copy — otherwise the path would have to
    # be edited on every sync, which is a silent breakage waiting to happen.
    files:
      - id: chime_done
        file: sounds/chime_done.wav
      - id: chime_error
        file: sounds/chime_error.wav
      - id: chime_announce
        file: sounds/chime_announce.wav
      - id: chime_thinking
        file: sounds/chime_thinking.wav
      - id: chime_timer
        file: sounds/chime_timer.wav
      # 145ms. Length is a SAFETY constraint, not taste — it is short enough that
      # the mic can be opened after it finishes without adding perceptible latency.
      # Do not lengthen it and do not point this id at chime_listening.wav.
      - id: chime_touch
        file: sounds/chime_touch.wav
      # HAPTIC — a felt tap rather than a heard note. 24ms, fundamental + octave,
      # NO inharmonic partials, because a bell rings and a tap must not. Fires on
      # every touch target so the glass acknowledges contact even when the result
      # isn't visible yet. Loud (peak 0.55) BECAUSE it's short: the ear integrates
      # energy over ~30ms, so a brief transient has to be hot to register at all.
      - id: chime_haptic
        file: sounds/chime_haptic.wav
      # GUTTERING — the mobile cell is low. Declared in the SHARED config even
      # though only the mobile plays it (case 7 is gated by ${has_battery}), because
      # a media file id referenced by a compiled-in play action must exist on both
      # boards. Costs the desk unit 58KB of flash it never plays; the alternative —
      # a wrapper-only media file — would fork the chime script per device, which is
      # the copy-drift shape this repo keeps paying for.
      - id: chime_guttering
        file: sounds/chime_guttering.wav
      # chime_listening.wav is deliberately NOT declared — see the chime script.
    volume_increment: 5%
    volume_initial: 45%
    # ⚠️ VOLUME IS NOT A SECOND AUTHORITY — and it very nearly was.
    # Speaker::set_volume() forwards straight to audio_dac_->set_volume()
    # (speaker/speaker.h:70-77): the SAME es8311 register number.spk_volume writes.
    # So the media_player's slider is not an independent software gain, it is a
    # second writer to one knob. Mirroring it back into spk_volume makes the
    # media_player a CLIENT of the number rather than a competitor: whichever
    # surface HA touches, spk_volume ends up authoritative and both stay in sync.
    # This terminates rather than ping-pongs — spk_volume's set_action calls
    # audio_dac.set_volume directly, which does not re-enter Speaker::set_volume.
    on_volume:
      - number.set:
          id: spk_volume
          value: !lambda 'return id(media_out).volume * 100.0f;'
      # ⚠️ SpeakerMediaPlayer::set_volume_ clears REG31 on its way through — twice, via
      # I2SAudioSpeakerBase::set_volume() and again directly. So adjusting volume from
      # HA while a muted reply is playing would UNMUTE IT. Re-assert here, at the
      # event, rather than waiting up to 250ms for the watchdog's cadence to notice.
      # The amp gate is what makes this defence-in-depth rather than the only thing
      # standing between a quiet mode and a leak.
      - if:
          condition: { lambda: 'return id(snd_block);' }
          then:
            - audio_dac.mute_on: es8311_dac
            - lambda: 'id(dac_muted) = true;'

    ####################################################################
    # POP SUPPRESSION — keep the DAC muted while idle.
    #
    # SYMPTOM: an audible pop before EVERY audio — chimes, TTS replies,
    # announcements alike.
    #
    # CAUSE: the ES8311's DAC output DC-steps when the I2S clocks start. The
    # speaker starts and stops per utterance (one `Created ring buffer` per
    # playback), and GPIO1 is ALWAYS_ON with nothing toggling it per-utterance,
    # so the amp is faithfully amplifying a step — it is NOT a class-D turn-on
    # click, and it is not the assets (all have a 4ms raised-cosine attack).
    #
    # FIX: mute the DAC while idle, so the next I2S start happens INTO a muted
    # DAC and is never amplified. Unmute once audio is actually flowing.
    #
    # ⚠️ CORRECTION (#3) — THIS USED TO CLAIM THE UNMUTE SLEWS. IT DOES NOT.
    # The old rationale was "REG37 is the DAC ramp rate, set to 0x08 by the driver,
    # so the unmute slews instead of stepping". Per the datasheet DAC_RAMPRATE is
    # bits 7:4, and 0x08 sets those to 0 = SOFT RAMP DISABLED; bit 3 is DAC_EQBYPASS,
    # which is exactly what the driver's own comment says it is setting.
    # THE MUTE AND UNMUTE ARE BOTH A HARD STEP.
    #
    # The fix still works, and for a better reason than the one stated: it works
    # because the DAC is ALREADY muted when the clocks start, so the transient is
    # never amplified — not because the unmute is gentle. Muting *across* the
    # transient would still not work, and that was never about ramping either: the
    # reply cold start popped with the DAC provably muted.
    #
    # This matters beyond tidiness. A hard step is what makes the silence gate sound:
    # asserting the mute cannot leak a slewing tail. Anyone reasoning from the old
    # comment would conclude the opposite.
    #
    # WHY NOT `timeout: never` ON THE SPEAKER — it is the obvious fix and it is
    # a trap on this board. It would keep the I2S driver loaded and remove the
    # transient outright, but `I2SAudioComponent` has ONE shared `Mutex lock_`
    # (i2s_audio.h:64-71); the speaker holds it while its driver is loaded, and
    # the microphone acquires it with NON-BLOCKING `try_lock()`
    # (i2s_audio_microphone.cpp:98). A permanently-loaded speaker means the mic
    # silently fails to start with nothing logged — i.e. "Ember can't hear me",
    # traded for a pop. Do not do it.
    #
    # FAILURE DIRECTION IS DELIBERATE: a mute that never clears is a SILENT
    # DEVICE, which is strictly worse than a pop. So unmuting is triggered from
    # three independent places and backed by a watchdog (see `interval:`), while
    # muting happens only from on_idle. If any single path fails, the worst case
    # is the pop coming back — never silence.
    # on_announcement / on_play REMOVED as unmute anchors — they fire when the
    # media_player enters its playing state, which is BEFORE the pipeline starts the
    # speaker and therefore before i2s_channel_enable(). Unmuting there is ahead of
    # the clock transient, so the pop survives and the fix looks like it did nothing.
    # The 10ms is_running() anchor in `interval:` replaces them; it is the only
    # signal that means "the clocks are already up". Do not add them back.
    on_idle:
      # Mute AFTER playback ends, so the DAC is already muted before the next
      # I2S start. This also absorbs the stop transient.
      - audio_dac.mute_on: es8311_dac
      - lambda: 'id(dac_muted) = true;'

switch:
  # ⚠️ WAS `platform: output` WITH `output: amp_enable`, AND THAT WAS THE BUG.
  #
  # It made the switch a SECOND WRITER to amp_enable, competing with the 10ms
  # watchdog. Two consequences, both of which this file's own comments claimed were
  # impossible:
  #
  #   1. Turning the switch OFF did not mute the device. The watchdog's amp-enable
  #      branch did not consult it, so the next audio re-enabled the amp.
  #   2. HA's reported state could disagree with the electrical state, because the
  #      watchdog wrote the GPIO directly and never went through the switch.
  #
  # HOW IT HID, which is the instructive part: the `amp_blank` script — whose deadline
  # branch DID check `switch.is_on: amp_switch` — was never executed. There was no
  # `script.execute: amp_blank` anywhere in this file. So the one branch that honoured
  # the switch was dead code, and the comment describing its behaviour ("the interval
  # only restores the amp if the switch is on") read as if it described the live
  # branch. The output also looked correct, because the amp being ON is normal.
  # (Past tense throughout: that script is deleted (#17). This paragraph is the
  # post-mortem of bug #1, kept because the shape is worth keeping, and it is NOT a
  # description of any code that exists today.)
  #
  # THE FIX IS TO DELETE THE COMPETITOR, not to reconcile two writers — the same move
  # that settled volume and the LED. This switch is now pure INTENT and the 10ms
  # watchdog is the sole writer of amp_enable.
  #
  # restore_mode stays ALWAYS_ON deliberately: a persisted OFF would be a silent
  # permanent mute weeks later, which is the landmine SpeakerMediaPlayer's persisted
  # is_muted already represents. Do not change this to RESTORE_DEFAULT_ON.
  - platform: template
    id: amp_switch
    name: Speaker Amplifier
    icon: mdi:speaker
    optimistic: true
    restore_mode: ALWAYS_ON

  # prefers-color-scheme has no meaning on a bare SPI panel, so JP's
  # dark/light rule is honoured by exposing the daylight ramp as a control
  # rather than pretending a media query applies.
  - platform: template
    id: hearth_daylight
    name: Daylight Hearth
    icon: mdi:white-balance-sunny
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(theme_light) = true;
          id(force_full_repaint) = true;
    turn_off_action:
      - lambda: |-
          id(theme_light) = false;
          id(force_full_repaint) = true;

  # ⚠️⚠️ HUSH HAS CHANGED MEANING. THIS IS A BEHAVIOUR CHANGE TO AN EXISTING CONTROL,
  # NOT A NEW FEATURE ALONGSIDE ONE. Anyone who learned the old behaviour will be
  # surprised, so it is spelled out here rather than left to be inferred.
  #
  #   BEFORE: "do not listen to me." It wrapped the entire body of `talk_begin`, so
  #           with Hush on, TAPPING THE SCREEN DID NOTHING AT ALL.
  #   NOW:    "do not make noise." Ember listens and converses normally; the reply
  #           arrives on screen instead of out of the speaker, and chimes are silent
  #           too. It is the quietest of the three modes, not a mute button on the
  #           microphone.
  #
  # The old gate in `talk_begin` is DELETED. Do not restore it — it is the one line
  # whose meaning inverts, and restoring it would make the quietest mode also the
  # deafest, which is not what it says on the tin.
  #
  # The entity survives so existing dashboards and automations referencing
  # switch.ember_hush keep working, and it is a CLIENT in the shape this file already
  # uses for volume: its state is a `lambda:` over op_mode rather than a stored bool,
  # so there is no second bit to drift and it CANNOT disagree with the mode. That is
  # also why restore_mode must be DISABLED.
  #
  # The old comment's honesty about the hardware is preserved and can now be
  # strengthened: sound_level is `passive: true`, so it never STARTS the microphone —
  # with the pipeline stopped nothing is captured at all, in any mode.
  - platform: template
    id: sw_hush
    name: Hush
    icon: mdi:volume-off
    restore_mode: DISABLED
    lambda: 'return id(op_mode) == 2;'
    turn_on_action:
      - lambda: 'id(sel_mode)->make_call().set_index(2).perform();'
    turn_off_action:
      - lambda: 'id(sel_mode)->make_call().set_index(0).perform();'

button:
  - platform: restart
    id: btn_restart
    name: Restart
    entity_category: diagnostic

  # Touch-controller recovery. Recipe and datasheet timings from
  # scratch/hosyond-s3/nebula-touch-reset.md §4-B.
  #
  # Exposed as a button so it is reachable from HA *remotely* — the whole point is
  # that recovering the touchscreen must not require the touchscreen. It is also
  # wired to the power menu, which the BOOT button can drive without touch.
  #
  # SAFE with respect to the boot-path rule: GPIO18 stays UNCONFIGURED at boot.
  # This only ever drives it at runtime, on explicit request, and hands it back to
  # the FT6336G's internal 3K pull-up (datasheet Figure 3-2) when done. It cannot
  # regress boot because it never runs during boot.
  #
  # nebula flagged `attach_interrupt_` re-entry as unverified. VERIFIED since:
  # ft63x6::setup() calls attach_interrupt_ -> ESP32InternalGPIOPin::attach_interrupt
  # (esp32/gpio.cpp:68-98), which guards gpio_install_isr_service behind a static
  # bool and then calls gpio_isr_handler_add(). IDF's handler_add REPLACES the
  # per-pin handler rather than appending, and we re-register the identical
  # (func, arg) for the identical pin — so re-running setup() is idempotent here.
  # It does not leak an ISR or double-fire.
  #
  # The blocking delay()s total ~310ms. That WILL log "took a long time"; it is a
  # deliberate manual recovery action, not a loop-rate path.
  - platform: template
    id: btn_rouse_touch
    name: Rouse Touch Sensor
    icon: mdi:gesture-tap
    entity_category: diagnostic
    on_press:
      - lambda: |-
          ESP_LOGW("ember", "touch recovery: pulsing CTP_RST");
          gpio_set_direction(GPIO_NUM_18, GPIO_MODE_OUTPUT);
          gpio_set_level(GPIO_NUM_18, 0);
          delay(10);                    // Trst >= 5ms  (FT6336G datasheet Table 3-5)
          gpio_set_level(GPIO_NUM_18, 1);
          delay(300);                   // Tpon >= 300ms before the chip reports
          gpio_set_direction(GPIO_NUM_18, GPIO_MODE_INPUT);  // back to the 3K pull-up
          id(touch)->setup();           // re-reads chip id; no reset (reset_pin unset)

binary_sensor:
  # Published by mic_sync_check. `problem` so ON means "these disagree" — the state a
  # dashboard needs to contradict itself with, not a health badge to look green.
  - platform: template
    id: mic_gain_desync
    name: Mic Gain Desync
    device_class: problem
    entity_category: diagnostic

  # The ONLY usable button on this PCB.
  #
  # K1/K2 are RESET and BOOT. RESET is hardwired to CHIP_PU (it resets the MCU and
  # the LCD) and cannot be read. So GPIO0/BOOT is the entire hardware input budget,
  # and GPIO 2/14/21 are the only free broken-out pins — adding real buttons means
  # soldering, which is out of scope.
  #
  # GPIO0 is a strapping pin (esp32/gpio_esp32_s3.py:35). The warning is advisory
  # only (pins.py:271-279) and `ignore_strapping_warning` silences it; it is
  # justified here because we only ever READ the pin at runtime, and strapping is
  # sampled once at reset. We attach no external pull — the board already has one.
  #
  # ⚠️ ONE REAL HAZARD: holding BOOT low *across a reset* enters ROM download mode.
  # Both handlers below are `on_click`, which fires on RELEASE, so the button is
  # always up before any action (including restart) runs. Do not convert these to
  # `on_press` without re-thinking that.
  - platform: gpio
    id: btn_boot
    name: Boot Button
    entity_category: diagnostic
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
      allow_other_uses: true   # shared with deep_sleep's wakeup (douse)
    # ---- SHORT AND DOUBLE LIVE IN on_multi_click; LONG STAYS AN on_click ----
    #
    # 2026-08-09, the chronicle's doorway. GPIO0/BOOT is the entire hardware
    # input budget, single and long were both spoken for, and the power menu
    # CANNOT grow a fifth row (its own static_assert: 72 + 5*46 - 3 = 299 is
    # past the overlay's floor at 263 — the same wall the mode submenu's
    # fourth row hit, one screenful up). A double-click is the only gesture
    # left in the budget.
    #
    # WHY THE SINGLE MOVED: on_click filters by press LENGTH alone, so each
    # half of a double-click IS a valid single — the two handlers cannot
    # coexist for sub-800ms presses without the single firing twice per
    # double. on_multi_click disambiguates by the gap: a lone short press is
    # only confirmed single after 410ms of silence. That buys the double at
    # the price of +410ms latency on opening the volume overlay — felt, and
    # judged worth it; every OTHER single-press meaning (cursor moves, menu
    # steps) happens with an overlay already up, where two quick presses were
    # already two distinct actions and remain exactly that.
    # ⚠️ The LONG press (900-6000ms) stays a plain on_click below: no multi
    # pattern here matches a press ≥900ms, so recovery-by-button — the reason
    # this button carries menus at all — does not depend on multi-click
    # disambiguation working.
    on_multi_click:
      # DOUBLE — open the chronicle, newest page first. From ANY mode: the
      # gesture is rare enough that stealing it from overlay contexts costs
      # nothing (a double inside the volume overlay used to mean two volume
      # steps; it now means "show me the chronicle", which is at worst one
      # surprise, not a trap — the overlay it replaces auto-dismisses anyway).
      - timing:
          - ON for 30ms to 800ms
          - OFF for 40ms to 400ms
          - ON for 30ms to 800ms
        then:
          - lambda: |-
              id(ui_last_ms) = millis();
              id(chron_page) = 0;                 // page 0 = the newest entries
              id(chron_sel) = -1;
              id(ui_mode) = 4;
              id(ui_action) = 0;
              id(ui_gen)++;
      # SINGLE — byte-for-byte the old short-press semantics, plus the two
      # chronicle modes dismissing back to the hearth.
      - timing:
          - ON for 30ms to 800ms
          - OFF for at least 410ms
        then:
          - lambda: |-
              id(ui_last_ms) = millis();
              if (id(ui_mode) == 0) {
                id(ui_mode) = 1;              // summon the volume overlay
                id(ui_action) = 0;
              } else if (id(ui_mode) == 1) {
                id(ui_action) = 2;            // step up (wraps — see below)
              } else if (id(ui_mode) >= 4) {
                // chronicle list or detail: the button backs out. Detail steps
                // back to the list; the list closes to the hearth. Two presses
                // from anywhere in the chronicle to a clean screen, no touch
                // required — the recovery property the menus were built on.
                if (id(ui_mode) == 5) {
                  id(ui_mode) = 4;
                } else {
                  id(ui_mode) = 0;
                  id(force_full_repaint) = true;
                }
                id(ui_action) = 0;
              } else if (id(ui_mode) == 3) {
                // ---- FOUR CURSOR POSITIONS IN A THREE-ROW MENU: THE CANCEL ----
                //
                // -1 (nothing lit) is the fourth position and it is the CANCEL. It
                // already meant dismiss on a long press — the branch below reads
                // `(ui_sel >= 0 && ui_sel < 3) ? apply : dismiss` and always has. The
                // defect was that -1 was UNREACHABLE once the cursor moved: a plain
                // `% 3` walks 0,1,2,0,1,2 forever, so from any lit row the only button
                // exit was to APPLY a mode. Cycling back through -1 costs one branch
                // and needs no new drawn row.
                //
                // A FOURTH DRAWN ROW WAS THE OTHER OPTION AND IT DID NOT FIT when this
                // was written (rows then sat at 72/118/164 in an overlay treated as
                // 32..187). STALE SINCE 2026-08-24: rows now sit at 58/99/140 (41px
                // pitch, five power rows) and every overlay has been full-height since
                // #39 — a fourth row would fit today. The -1 cancel stays anyway: it
                // costs no row, and a cursor position that means "nothing" is still
                // the right shape for a menu that must never commit by accident.
                //
                // ⚠️ THE MENU EXISTS BECAUSE RECOVERY MUST NOT NEED THE TOUCHSCREEN.
                // GPIO0/BOOT is the entire hardware input budget, and `btn_rouse_touch`
                // is a row in the power menu for exactly that reason. A mode submenu
                // whose only button exit commits a mode change is a menu you cannot
                // back out of with a wedged touch controller. The 12s auto-dismiss is a
                // timeout, not an escape. Surfaced by check_navigability.py; JP's call.
                int s = id(ui_sel) + 1;
                id(ui_sel) = (s >= 3) ? -1 : s;
                id(ui_action) = 0;
              } else {
                // Advance the cursor. THE ROW COUNT DIFFERS PER MENU — the power menu
                // has ui_pm_n rows, the mode submenu has 3 (handled above) — so the
                // hardcoded modulus that used to be here walked the mode cursor onto a
                // fourth row that is never drawn. The tap hit-test would have refused to
                // apply it, so the symptom is a cursor that vanishes for one press
                // rather than an error: invisible in review, and only reachable from the
                // button path.
                id(ui_sel) = (id(ui_sel) + 1) % ${ui_pm_n};
                id(ui_action) = 0;
              }
              id(ui_gen)++;
          # cycle: TRUE only on this path. A single button cannot express two
          # directions, so it must wrap 100% -> 0% to be able to go down at all.
          # The on-screen -/+ below use cycle: false, where wrapping would be a bug.
          - if:
              condition:
                - lambda: 'return id(ui_action) == 2;'
              then:
                - number.increment:
                    id: spk_volume
                    cycle: true
                - lambda: 'id(ui_gen)++;'

    on_click:
      # ---- LONG: open the power menu, or activate the highlighted item ----
      - min_length: 900ms
        max_length: 6000ms
        then:
          - lambda: |-
              id(ui_last_ms) = millis();
              id(ui_action) = 0;
              if (id(ui_mode) >= 4) {
                // A long press inside the chronicle closes it outright — the
                // long press means "power menu" everywhere else, and opening a
                // menu ON TOP of the chronicle would need an overlay stack this
                // UI deliberately does not have. Close first, press again.
                id(ui_mode) = 0;
                id(force_full_repaint) = true;
              } else if (id(ui_mode) == 3) {
                // ⚠️ WITHOUT THIS BRANCH THE MODE SUBMENU IS UNREACHABLE FROM HARDWARE.
                // A long press with ui_mode == 3 fell through to the `else` below and
                // re-opened the POWER menu instead of picking a mode — so the mode
                // could only ever be changed by touch or from Home Assistant.
                //
                // That breaks the load-bearing reason these menus are on the button at
                // all: GPIO0/BOOT is the ENTIRE hardware input budget (K1/RESET is
                // hardwired to CHIP_PU and cannot be read), and the whole point is that
                // recovering the device must not require the touchscreen. A mode you
                // cannot leave without a working touch controller is precisely the trap
                // `btn_rouse_touch` exists to avoid.
                //
                // ui_sel == -1 still means dismiss, for the same reason as below: a
                // stray long press must not commit a choice nobody aimed at.
                id(ui_action) = (id(ui_sel) >= 0 && id(ui_sel) < 3) ? 10 : 4;
              } else if (id(ui_mode) == 2) {
                // Activate whatever the cursor is on. ui_sel == -1 (the initial
                // value) deliberately means "dismiss", so a stray long-press can
                // never fire a destructive item.
                switch (id(ui_sel)) {
                  case 0:  id(ui_action) = 5; break;   // mode submenu
                  case 1:  id(ui_action) = 6; break;   // bank
                  case 2:  id(ui_action) = 7; break;   // rouse
                  case 3:  id(ui_action) = 36; break;  // douse (deep sleep)
                  case 4:  id(ui_action) = 8; break;   // rekindle
                  default: id(ui_action) = 4; break;   // dismiss
                }
              } else {
                id(ui_mode) = 2;
                id(ui_sel) = -1;
              }
              id(ui_gen)++;
          - script.execute: ui_dispatch

########################  overlay action dispatch  ########################
# The hit-test lambdas decide WHAT, this script does it. Split that way so every
# volume change still flows through the documented `number.*` actions ->
# TemplateNumber::control() -> set_action (audio_dac.set_volume) + publish_state
# (template_number.cpp:38-46). HA therefore stays in sync and spk_volume remains
# the single source of truth — nothing here writes the DAC directly.
########################  hearth chimes  ########################
# WHICH EVENTS EARN A CHIME — and the two that don't:
#
#   done      YES  marks "the mic is closed". You cannot know that by ear otherwise,
#                  and it is privacy-relevant, so it earns its place even though
#                  Ember stopping talking is already a hint.
#   error     YES  the strongest case after announce. The deliberate minor second
#                  cannot be mistaken for a normal event, and an error is exactly
#                  when you are NOT looking at the screen wondering why nothing
#                  happened.
#   announce  YES  the strongest case of the six. A pushed announcement arrives
#                  unprompted, so without a herald the first word is always missed.
#   timer     YES  a finished timer is useless if unheard. Wiring on_timer_finished
#                  also sets has_timers_ -> FEATURE_TIMERS (voice_assistant.h:164),
#                  which is what makes HA Assist timers work on this satellite.
#   thinking  OFF BY DEFAULT (taste). Flip ${chime_on_thinking} to 1 to try it.
#                  It fires on every single interaction and is immediately followed
#                  by speech, which is its own announcement — so it is redundant with
#                  the thing it announces. Whether that is charming or maddening
#                  depends on how long local Qwen takes, which only JP can judge.
#                  A switch is the right answer for a TASTE call; it would be the
#                  wrong answer for a correctness problem, which is why listening
#                  below is not a switch.
#   listening NOT WIRED AT ALL — this one is a correctness problem, not taste:
#                  chime_listening.wav is 1.425s, and it would play out of `spk`
#                  while the mic is streaming to HA. Mic and speaker share one I2S
#                  hub in one enclosure and there is NO acoustic echo cancellation
#                  (noise_suppression and auto_gain are not AEC). So HA's VAD would
#                  almost certainly fire on the chime, then see the chime's trailing
#                  silence and END the utterance before the user says a word. The
#                  symptom would be "Ember can't hear me" — an STT bug that isn't
#                  an STT bug, which is the most expensive kind to diagnose.
#                  The screen already acknowledges the tap instantly and
#                  unambiguously (fire -> amber, header -> LISTENING, LED -> amber),
#                  so this is also the least necessary of the six on a device that
#                  has a display.
#                  IF WANTED, the safe pattern is: play a SHORT tone, then open the
#                  mic after it finishes, so nothing is ever captured:
#                      - media_player.speaker.play_on_device_media_file: ...
#                      - delay: <tone length>
#                      - voice_assistant.start:
#                  That needs a ~300ms asset (chime_listening is 4x too long for it);
#                  generate_chimes.py can produce one. Costs that much added latency
#                  on every push-to-talk, which is why it is a follow-up and a
#                  judgement call rather than something shipped silently.
script:
  # ---- ARM THE SERVER-SIDE WAKE WORD ("don-kee") ----
  #
  # Inert unless ${wake_word_mode} is 2 (server-side). See the substitution block.
  #
  # THE ONE NON-OBVIOUS THING, and the reason this is not simply `use_wake_word: true`
  # on the voice_assistant block: `use_wake_word` is not a mode, it is a flag stamped
  # onto EVERY pipeline-start request. voice_assistant.cpp:336 reads
  #
  #     if (!this->continue_conversation_ && this->use_wake_word_)
  #         flags |= VOICE_ASSISTANT_REQUEST_USE_WAKE_WORD;
  #
  # with no test for whether this particular start was continuous or touch-initiated.
  # So leaving the flag permanently true would make a TAP start at the wake-word stage
  # too: you would press the glass and then still have to say "don-kee" before Ember
  # heard you. That is a silent regression of the primary interaction, and it would
  # not show up in `esphome config` — only on the device, under a finger.
  #
  # Hence the flag is owned here and toggled around every conversation: true only for
  # the idle continuous listen, false for the duration of a real conversation. The
  # touch path clears it (see talk_begin) and on_end/on_error re-arm by calling this.
  - id: wake_word_arm
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return ${wake_word_mode} == 2;'
              # Do not stomp a conversation in flight. on_end re-arms, so a tap that
              # lands while armed is not lost — it just re-arms a moment later.
              - not:
                  voice_assistant.is_running:
          then:
            - lambda: 'id(va).set_use_wake_word(true);'
            - voice_assistant.start_continuous:

  # ---- IS THE CODEC WHERE HA THINKS IT IS? ----
  #
  # ONE READER, TWO CALLERS: the boot trigger 25s in, and a 60s interval. It exists as a
  # script rather than twice inline for the reason this repo keeps relearning — a second
  # hand-written copy of a check is a rumour about the check.
  #
  # WHY IT IS AN ENTITY AND NOT JUST A LOG. It began as ESP_LOGI, which put the only tell
  # for "the number and the codec have diverged" in a log nobody watches, while the thing
  # doing the lying is a dashboard card. A reviewer named the asymmetry exactly: a stale
  # COMMENT has contradicting code beside it, and a stale MESSAGE has nothing. So the
  # verdict is published where the false claim would be read.
  #
  # A FAILED READ IS NOT A DESYNC and must not be reported as one. On an I2C failure the
  # sensors are left alone and a warning is logged: conflating "cannot see" with "wrong"
  # would produce a confident answer from a blind instrument, which is §14 and §17 both.
  - id: mic_sync_check
    mode: single
    then:
      - lambda: |-
          uint8_t reg = 0xFF;
          if (!id(es8311_dac)->read_byte(0x16, &reg)) {
            ESP_LOGW("mic", "sync check: REG16 read FAILED — reporting nothing rather "
                            "than guessing");
            return;
          }
          const int want = (int) lroundf(id(mic_gain_num).state / 6.0f);
          const bool bad = (reg != want);
          id(mic_gain_codec).publish_state((float) (reg * 6));
          id(mic_gain_desync).publish_state(bad);
          if (bad) {
            ESP_LOGW("mic", "SYNC CHECK MISMATCH: number=%.0fdB (want REG16=0x%02X) | "
                            "codec REG16=0x%02X (%ddB)",
                     id(mic_gain_num).state, want, reg, reg * 6);
          } else {
            ESP_LOGI("mic", "sync check: %ddB, codec agrees (REG16=0x%02X)", reg * 6, reg);
          }
  # ⚠️ THE `amp_blank` SCRIPT LIVED HERE AND IS DELETED (#17). Do not reinstate it.
  #
  # It had ZERO callers, so it never ran — but the interesting part is that reviving it
  # would now be actively harmful rather than merely redundant. Its deadline machinery
  # was designed alongside the two condition-pair branches that used to manage the amp,
  # and those are gone: the amp is now one desire recomputed every 10ms tick. A revived
  # deadline would FIGHT that expression forever, each asserting the pin the other way.
  #
  # So this is not "a revert is available". Blanking-as-a-deadline is incompatible with
  # gating-as-a-recomputation, and the recomputation is what makes `amp_switch` and the
  # silence gate work at all.
  #
  # The analysis that used to sit above it has MOVED to the amp gate in `interval:`,
  # which is the code it actually explains. It was not deleted — the MCLK/REG31 argument
  # is why the amp gate exists, and the FM8002E naming decision is the traceability for
  # every number in this subsystem.

  # Unmute the DAC. Called from three independent triggers (on_announcement,
  # on_play, and the watchdog interval) because the dangerous failure here is
  # asymmetric: a stuck MUTE is a silent device, a stuck UNMUTE is only the pop
  # coming back. So unmuting is made redundant on purpose and muting is not.
  #
  # `mode: single` — concurrent calls are a no-op rather than stacking I2C writes
  # on the shared bus (the codec and the touch controller share GPIO15/16).
  - id: dac_unmute
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(dac_muted);'
          then:
            - audio_dac.mute_off: es8311_dac
            - lambda: 'id(dac_muted) = false;'

  # ONE place that knows both the file and its length, because those two facts must
  # not drift apart: the length is what sizes the not-speech window.
  #
  # `announcement: true` on every call. With only an announcement pipeline
  # configured, single_pipeline_() (speaker_media_player.h:112) routes everything
  # there anyway so the flag is currently cosmetic — but
  # `media_pipeline_->start_file()` is dereferenced with NO null guard
  # (speaker_media_player.cpp:177). If anyone ever adds a media_pipeline, an
  # unflagged chime would route to it. Setting it true makes that impossible.
  #
  # enqueue: false is deliberate — a chime should interrupt a stale chime, not
  # queue behind it. The one place ordering matters is the announce herald, and
  # that works out because on_announce fires tts_start (our chime, enqueue false)
  # BEFORE it ENQUEUEs the announcement itself (voice_assistant.cpp:1056 then
  # :1064-1067), so the speech lands behind the chime rather than cutting it off.
  # ---- HUSH'S CHIME GUARD LIVES IN A WRAPPER, NOT IN THE BODY ----
  #
  # Chimes are separate plays through the same speaker, so suppressing them is a
  # DIFFERENT lever from suppressing speech — which is exactly what makes the
  # three-mode split cheap: mode 1 closes the silence gate, mode 2 additionally closes
  # this one. Neither knows about the other.
  #
  # Two shapes were available and one is a trap. Putting
  # `if (id(op_mode) >= 2) return;` at the top of the body's first lambda would NOT
  # work: a `return` in a lambda cannot abort its sibling actions in the enclosing
  # action list — that is the bug oracle-verifier found on the `va_state == 1` guard,
  # which is why the seven play actions each re-check their own conditions.
  #
  # Adding the condition to all seven plays would work but is the fragile shape: one
  # edit per call site, and it silently fails to cover the eighth sound somebody adds
  # later.
  #
  # So `chime` becomes a one-line wrapper holding the single guard and the real work
  # moves to `chime_play`. Every existing call site still says `chime`, so nothing can
  # bypass it — including call sites that do not exist yet. Transparent in timing:
  # neither script contains a `delay:`, so `script.execute` runs to completion
  # synchronously and the announce herald still lands AHEAD of the speech it heralds,
  # which is load-bearing.
  - id: chime
    mode: restart
    parameters:
      which: int
    then:
      - if:
          condition: { lambda: 'return id(op_mode) < 2;' }
          then:
            - script.execute: { id: chime_play, which: !lambda 'return which;' }

  # ---- the chronicle's one writer ----
  # Every utterance enters the ring through here, so the cap and the dedupe
  # live in exactly one place. Dedupe matters because on_tts_start can fire
  # for a retry of the same announcement, and a chronicle that shows the same
  # line twice reads as a stutter in Ember's memory rather than as plumbing.
  - id: chron_push
    mode: queued
    max_runs: 10
    parameters:
      kind: string
      text: string
    then:
      - lambda: |-
          if (text.empty()) return;
          // A replay must not re-log: the chronicle is what happened, and a
          // playback of memory is not a new event. Matched against the entry
          // being played rather than "any entry" so a genuine re-utterance of
          // an old line (Ember says the same thing tomorrow) still records.
          if (id(chron_play_idx) >= 0 && id(chron_play_idx) < (int) id(chron).size() &&
              id(chron)[(size_t) id(chron_play_idx)].substr(1) == text) {
            return;
          }
          std::string e = kind + text;
          if (!id(chron).empty() && id(chron).back() == e) return;
          id(chron).push_back(e);
          id(chron_chan).push_back("");
          id(chron_img).push_back("");
          if (id(chron).size() > 100) {
            id(chron).erase(id(chron).begin());
            id(chron_chan).erase(id(chron_chan).begin());
            id(chron_img).erase(id(chron_img).begin());
          }

  - id: chime_play
    mode: restart
    parameters:
      which: int   # 0 done · 1 error · 2 announce · 3 thinking · 4 timer · 5 touch · 6 haptic · 7 guttering
    then:
      - lambda: |-
          // Declare "the next N ms of audio is NOT speech" BEFORE starting it, so
          // the display lambda can never observe the audio without the guard.
          // Durations are the real file lengths + 250ms of slack for pipeline
          // start-up: done 1.580 · error 1.050 · announce 1.540 · thinking 0.370
          // · timer 1.860 · touch 0.145 · guttering 1.800.
          // File length + 250ms of driver load/unload — measured uniform across all eight.
          static const uint32_t LEN_MS[8] = {1830u, 1300u, 1790u, 620u, 2110u, 395u, 274u, 2050u};
          if (which < 0 || which > 7) return;
          // ---- NEVER PREEMPT AUDIO THAT IS ALREADY PLAYING ----
          //
          // `enqueue: false` does not "risk corruption" — it DESTROYS the in-flight
          // item by design: watch_media_commands_() calls announcement_playlist_
          // .clear() and then start_file() on the running pipeline
          // (speaker_media_player.cpp:152-164). The preempted item's remaining audio
          // is discarded and never resumed. All seven of our plays carry that flag.
          //
          // And `va_state` cannot detect the case that matters. It is 0 for the ENTIRE
          // duration of a spoken reply (RESPONSE_FINISHED -> set_state_(IDLE, IDLE),
          // voice_assistant.cpp:516), so the `va_state != 1` guard is blind to exactly
          // the condition it needs to see. Consequence, reproducible in ten seconds
          // before this guard: ask Ember something, tap the screen while it answers,
          // and the reply dies mid-sentence. A VOLUME tap was worse — it fires the
          // haptic AND the tick, so it killed the reply and then killed its own tick.
          //
          // spk->is_running() asks the direct question, and it covers call sites that
          // do not exist yet — which is the property a per-site flag like had_tts
          // lacks. Applied to done/error/thinking/touch/haptic: the announce herald is
          // enqueued AHEAD of the speech it heralds (verified), and a timer finishing
          // is the one sound whose whole job is to interrupt.
          //
          // ⚠️ THE GUARD IS TWO HALVES AND ONLY THE SECOND ONE DECLINES THE PLAY.
          // This `return` gates `chime_until` and NOTHING ELSE — a return in a lambda
          // cannot abort its sibling actions in the enclosing action list, which is
          // stated twice more in this script and is the bug oracle-verifier found on
          // the `va_state == 1` guard. The play actions below each re-test
          // `!id(spk)->is_running()` in their own condition, and THAT is what makes a
          // sound decline. Membership in the list above is necessary and inert.
          //
          // #15 is the proof, and it is why this is spelled out here rather than left
          // to be re-derived: case 3 was added to this enumeration and its play
          // condition was left alone, so the fix read as complete, compiled clean, and
          // changed nothing at all. If you add a case here, add it there too — and if
          // you are checking whether a case is guarded, read the play condition, not
          // this list.
          //
          // Case 3's claim is the weakest of any sound the device makes: the thinking
          // chime is a "still working" filler, so it is the LAST audio that should be
          // allowed to destroy something already playing. The reachable case is a timer
          // (case 4, deliberately unguarded because interrupting is its whole job)
          // still ringing when a new turn starts — without the play-side guard,
          // thinking clears the playlist and kills it.
          //
          // Latent until now only because chime_on_thinking defaults to 0, which is
          // the worst kind of latent: it would first misbehave for whoever flips that
          // switch to try the feature, with no reason to suspect the chime.
          // Case 7 (guttering) joins the guarded set: a low-cell warning is latched
          // firmware-side and there is a whole escalation ladder behind it (the HA
          // automation at critical), so it can afford to be polite — it must never
          // destroy a reply in flight. Per §15: membership here is inert on its own;
          // the play condition below is the half that declines.
          if ((which == 0 || which == 1 || which == 3 || which == 5 || which == 6 ||
               which == 7) &&
              id(spk)->is_running()) {
            return;
          }
          // Do not start audio while the microphone holds the shared I2S lock. The
          // captured log shows what happens otherwise: the speaker fails with
          // "Parent bus is busy" (i2s_audio_speaker_standard.cpp:400-403) and then
          // burns TWO one-second retries before the mic releases. The chime is lost
          // either way, so failing fast here is purely better — and it removes a
          // pair of scary errors that look like a hardware fault.
          //
          // NOTE this failure costs no transient: :400 returns ESP_ERR_INVALID_STATE
          // BEFORE i2s_new_channel(), so a failed start never touches the hardware.
          // Failed starts are a LATENCY problem, not a pop source.
          // Gates chime_until only. The PLAY actions are guarded in their own
          // conditions below — a `return` here cannot abort sibling actions in
          // the enclosing action list, which is the bug oracle-verifier found.
          if (id(va_state) == 1) return;
          // The announce herald is the ONE chime that must NOT be guarded: it is
          // the leading edge of real speech, and the fire should already be
          // burning as it rings.
          // The herald's exemption has a PREMISE, and a speech-muting mode removes it.
          // It normally skips chime_until because it is the leading edge of real
          // speech — but in mode 1 no audible speech follows, so left exempt it would
          // be classified as speech by the silence gate and muted. That would silence
          // the one sound mode 1 is supposed to keep, and the one that matters most
          // there: there is no reply behind it to catch the ear. Same shape of
          // reasoning as the original exemption, inverted.
          if (which != 2 || id(op_mode) >= 1) {
            id(chime_until) = millis() + LEN_MS[which];
          } else {
            // ...but its frames DO land between the mark and the speech, so the
            // fuse would run ~1.5s ahead of the words. Lengthen the estimate by
            // exactly the herald so the fuse still tracks.
            if (id(tts_est_ms) > 0) id(tts_est_ms) += LEN_MS[2];
          }
      - if:
          condition: { lambda: 'return which == 0 && id(va_state) != 1 && !id(spk)->is_running();' }
          then:
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: chime_done
                announcement: true
                enqueue: false
      - if:
          condition: { lambda: 'return which == 1 && id(va_state) != 1 && !id(spk)->is_running();' }
          then:
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: chime_error
                announcement: true
                enqueue: false
      - if:
          condition: { lambda: 'return which == 2 && id(va_state) != 1;' }
          then:
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: chime_announce
                announcement: true
                enqueue: false
      - if:
          # `!id(spk)->is_running()` IS THE HALF THAT ACTUALLY DECLINES THE PLAY. The
          # enumeration in the lambda above cannot do it — see the note there. Do not
          # remove this on the grounds that case 3 is already in that list.
          condition: { lambda: 'return which == 3 && id(va_state) != 1 && !id(spk)->is_running();' }
          then:
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: chime_thinking
                announcement: true
                enqueue: false
      - if:
          condition: { lambda: 'return which == 4 && id(va_state) != 1;' }
          then:
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: chime_timer
                announcement: true
                enqueue: false
      - if:
          condition: { lambda: 'return which == 5 && id(va_state) != 1 && !id(spk)->is_running();' }
          then:
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: chime_touch
                announcement: true
                enqueue: false
      - if:
          condition: { lambda: 'return which == 6 && id(va_state) != 1 && !id(spk)->is_running();' }
          then:
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: chime_haptic
                announcement: true
                enqueue: false
      - if:
          # The `!is_running()` here is the half that actually declines — the
          # enumeration in the lambda above cannot (see §15 note there). Only ever
          # invoked from the battery ladder, which is itself gated by
          # ${has_battery}, so on the desk unit this branch is unreachable dead
          # weight rather than a wrong sound.
          condition: { lambda: 'return which == 7 && id(va_state) != 1 && !id(spk)->is_running();' }
          then:
            - media_player.speaker.play_on_device_media_file:
                id: media_out
                media_file: chime_guttering
                announcement: true
                enqueue: false

  # Starting a conversation.
  #
  # ⚠️ THE TOUCH TONE WAS REMOVED FROM THIS PATH, AND MUST NOT COME BACK.
  #
  # Revision 6 played the 145ms tone here and then delayed 190ms before opening the
  # mic, so the tone could never be captured. That reasoning was sound but
  # incomplete, and the shipped version had a worse bug than the one it avoided:
  #
  #   t=0     tone starts -> speaker takes the shared I2S lock
  #   t=145   tone ends
  #   t=190   delay expires, voice_assistant.start -> mic start_driver_()
  #           -> try_lock() FAILS (speaker holds the lock for its whole `timeout`)
  #           -> "Driver failed to start; retrying in 1 second"
  #   t≈245   speaker finally releases the lock (at timeout: 100ms)
  #   t≈1190  mic retries and succeeds
  #
  # So the tone advertised "speak now" and then the mic was deaf for ~1 second. That
  # is the same "Ember can't hear me" failure chime_listening was refused over,
  # reached by a completely different route: the shared-lock backoff rather than VAD.
  #
  # Waiting out the lock instead would mean a ~350ms+ delay on every push-to-talk,
  # for a cue the screen already gives instantly and for free. The visual spark is
  # the touch feedback; audio is the wrong medium for it on this hardware. The tone
  # also cost an extra driver load, i.e. an extra pop, immediately before speech.
  #
  # mode: single is still load-bearing: it debounces the double-touches a capacitive
  # panel reports, so a fumbled tap cannot start two conversations.
  #
  # STOPPING is deliberately NOT routed through here — cancelling is instant.
  - id: talk_begin
    mode: single
    then:
      # YIELD THE MICROPHONE. No-op unless the wake word is armed (mode 1), and no-op
      # again on the wake-word entry, where stop_after_detection has already dropped it.
      # This is really the TOUCH entry's yield: a tap arrives with the wake word holding
      # the shared I2S bus, and the wait-for-is_stopped() below plus the reply that
      # follows both need it back.
      #
      # HERE AND NOT IN ui_dispatch, which looks like the better choke point and is not:
      # ui_dispatch is where every touch target converges INCLUDING pure navigation, so
      # yielding there makes cursor moves and menu dismissals stop the wake word.
      # check_navigability.py catches exactly that — clean button-only exits drop from
      # 11 to 1. talk_begin is reached only when a conversation actually begins.
      #
      # ⚠️ NOT INSTANT, and do not read it as a guarantee. mww->stop() unwinds through
      # the wake-word task, which calls microphone_source_->stop() on its own schedule
      # (micro_wake_word.cpp:216), so the I2S lock comes back some time after this
      # returns rather than at it. If the speaker asks before then it still eats the
      # 1s try_lock backoff. This shortens that window; it does not close it, and
      # whether the touch chime is audibly late is a question for the first flash.
      - micro_wake_word.stop:

      # ⚠️ THE `switch.is_off: sw_hush` GATE THAT USED TO WRAP THIS ENTIRE BODY IS
      # DELETED, AND ITS DELETION IS THE POINT OF THE THREE-MODE SPEC.
      #
      # Hush used to mean "do not listen to me", so with it on a tap did NOTHING. It
      # now means "do not make noise": Ember converses in all three modes and the reply
      # lands on screen. Gating the conversation here would make the quietest mode also
      # the deafest, which is not what the control says.
      #
      # The `if:` wrapper is kept with an always-true condition rather than unindenting
      # ~100 lines of load-bearing comments and waits, so that this diff is reviewable
      # and the sequencing notes below stay attached to the actions they explain.
      #
      # ✅ THE FORWARD-COMPATIBILITY NOTE CAME DUE. This block read "wake word is
      # currently off" until 2026-08-25, which had been stale since 2026-08-03: mode 1
      # is the flashed default and micro_wake_word runs with NO mode gate here, exactly
      # as the note specified — every mode listens, hush means "do not make noise",
      # not "do not listen". Still worth stating, because an earlier draft required the
      # opposite and a half-applied memory of it would reintroduce a gate nobody wants.
      # (Retired on observation of the contradiction with the FLASHED AND HEARD block
      # in the substitutions — a stale banner here is how verification.md §32 happened.)
      - if:
          condition: { lambda: 'return true;' }
          then:
            - lambda: |-
                // Clear stale error text the instant the tap lands, so the device
                // feels responsive before the pipeline has answered.
                if (id(va_state) == 4) {
                  id(said_text).clear();
                  id(heard_text).clear();
                  id(scroll_gen)++;
                }
            # Wait for the speaker to actually release the shared I2S lock rather than
            # letting the mic discover it is taken. The mic's try_lock() failure is not
            # cheap: it costs a FULL SECOND of backoff
            # ("Driver failed to start; retrying in 1 second",
            # i2s_audio_microphone.cpp:399-403). Waiting the ~0-500ms that is actually
            # required is strictly less latency than losing a blind second, and it is
            # what makes `timeout: 500ms` safe to restore above.
            #
            # is_stopped() is a sound proxy for "lock free": stop_i2s_driver_() — which
            # calls parent_->unlock() — runs at i2s_audio_speaker.cpp:93, BEFORE
            # state_ = STATE_STOPPED at :99. So by the time this condition passes the
            # lock is already released.
            #
            # The timeout is a backstop, not an expectation: if the speaker is somehow
            # stuck we proceed anyway and accept the mic's own retry rather than
            # hanging the tap forever.
            # >>> ORDER IS LOAD-BEARING. Two waits, and the FIRST one is the fix. <<<
            #
            # `script.execute` is non-blocking, and the media_player needs ~110ms to
            # read and decode a WAV before it claims the speaker (measured: ANNOUNCING
            # at 44.947, speaker start attempted at 45.055). So when ui_dispatch fires
            # the haptic and immediately runs this script, `speaker.is_stopped` is still
            # TRUE — the chime has not started yet — and the wait below passed
            # instantly. The microphone then took the shared I2S lock, and the chime's
            # decode finished into a bus it could never get:
            #
            #   Parent bus is busy / Driver failed to start; retrying in 1 second
            #
            # repeating for the whole utterance. Worse than a lost tone: the
            # media_player had already entered ANNOUNCING and reported PLAYING, so when
            # the TTS response URL arrived it was queued behind an item that could
            # never drain, and the reply was never spoken. Short utterances sometimes
            # survived — the mic released early enough for the chime to drain and free
            # the player — which is exactly why this presented as "it only worked on
            # the very short one".
            #
            # Waiting for is_playing FIRST closes the gap: we do not test for release
            # until the thing we are waiting on has actually acquired. Its timeout is a
            # backstop for the case where no audio was queued at all.
            # >>> The `wait_until: speaker.is_playing` that used to sit here is GONE,
            #     and removing it is a bug fix, not a simplification. <<<
            #
            # It existed to close a race with the haptic tone: script.execute is
            # non-blocking, so `is_stopped` was true merely because the tone had not
            # started yet, and waiting for acquire-then-release fixed that.
            #
            # Then option (c) removed the tone from the talk path entirely — so NOTHING
            # is ever queued here, `is_playing` never becomes true, and the wait burned
            # its FULL 1500ms timeout before every single tap. The microphone opened 1.5s
            # after the tap, so speech went into a closed mic and VAD ended the turn on
            # silence. JP's report: "my touches to activate are being deactivated
            # instantly." The wyrm startles immediately, which made it look like the tap
            # registered and was then cancelled.
            #
            # A guard whose premise has been deleted does not become harmless — it
            # becomes a timeout. The is_stopped wait below is still needed and still
            # correct: it covers tapping to interrupt while a REPLY is playing, which is
            # audio this path did not start.
            - wait_until:
                condition:
                  speaker.is_stopped: spk
                timeout: 900ms
            # The MICROPHONE's clock start is the one transient DAC mute provably cannot
            # suppress. Nothing is blanked here: the amp is already off because the 10ms
            # watchdog gates it on the speaker. (This used to say "see the amp_blank
            # script"; that script is deleted — the argument now lives on the amp gate in
            # `interval:`, which is the code that implements it.)
            # RACE FIX (oracle-verifier #6). `on_idle` is the ONLY thing that
            # mutes the DAC, and it fires from speaker_media_player::loop() — a
            # DIFFERENT component's loop pass, additionally gated on the pipeline
            # draining. Meanwhile the wait above is satisfied as soon as
            # stop_i2s_driver_() runs. So a tap could reach voice_assistant.start
            # BEFORE on_idle had muted, and the mic's clock start then happened
            # into an UNMUTED DAC. That is the pop, and it needs no impossibility
            # to explain it.
            #
            # REG31's mute bits (DAC_DSMMUTE bit 6, DAC_DEMMUTE bit 5) are LATCHED
            # I2C register bits, not clocked state, and ESPHome never rewrites
            # REG31 on restart — so asserting mute here genuinely holds across the
            # MCLK stop/start. (An earlier revision of this file claimed the
            # opposite; that claim was refuted from the datasheet.)
            - audio_dac.mute_on: es8311_dac
            - lambda: 'id(dac_muted) = true;'
            # Whether AMP GATING is redundant given the mute above is UNSETTLED and is
            # testable by ear: set the "Amp Blank Width" number to 0 and tap to talk.
            # Pop returns => codec mute is insufficient, amp gating is primary.
            # Pop stays away => the gating really is redundant and can be deleted.
            # (The subject here is the `amp_blank_ms_g == 0` clause in the amp gate, NOT
            # the deleted `amp_blank` script — the knob still works, and it is the gate
            # it turns off. An earlier revision of this comment claimed amp_blank_ms was
            # already 0. It never was, in any commit — a doc describing an unapplied
            # intent.)
            # The amp's own enable click, which
            # matters because this board's 0.39uF coupling caps are at the top of
            # the range the amp datasheet recommends (i.e. worst-case pop).
            # NO AMP BLANK IS CALLED HERE, and none is needed: the 10ms watchdog gates
            # the amp on the speaker, so at a tap (speaker stopped) the amp is ALREADY
            # off. The `amp_blank` script this comment used to point at is DELETED (#17)
            # — not "kept in case the symmetric policy is reverted", which is what this
            # said while the script sat there with zero callers. Reverting is not
            # available: a deadline would fight the recomputation. See the note at the
            # script's old site.
            #
            # ---- SERVER-SIDE WAKE-WORD HAND-OFF (no-op unless ${wake_word_mode} is 2) ----
            #
            # When the wake word is armed the assistant is ALREADY RUNNING — it is
            # sitting in a continuous listen waiting for "don-kee". That breaks the
            # tap in a way that is invisible in config and silent on device, because
            # voice_assistant.cpp:682 guards the whole of request_start with
            #
            #     if (this->state_ == State::IDLE) { ... }
            #
            # and does nothing at all otherwise. So `voice_assistant.start` below
            # would be DROPPED ON THE FLOOR for every tap while armed: no error, no
            # log, just a screen that never starts listening. The stop is not
            # politeness, it is what makes the tap work.
            #
            # Clearing use_wake_word first is the other half: the flag is stamped on
            # every start request (see wake_word_arm), so leaving it true would make
            # this tap-initiated pipeline start at the wake-word stage and demand the
            # phrase anyway. Cleared here, restored by on_end/on_error.
            #
            # The wait is bounded because request_stop() walks the state machine down
            # through STOP_MICROPHONE rather than jumping to IDLE, so IDLE arrives a
            # few loops later. 1s is a ceiling, not a delay — the common case exits
            # in a couple of ms. If it ever times out the start below still runs and
            # simply no-ops, which is the same failure we have today, not a worse one.
            #
            # ALL OF THIS IS SKIPPED when the wake word is off: the assistant is idle,
            # is_running() is false, and the tap path is byte-for-byte what it was.
            - lambda: 'id(va).set_use_wake_word(false);'
            - if:
                condition:
                  voice_assistant.is_running:
                then:
                  - voice_assistant.stop:
                  - wait_until:
                      condition:
                        not:
                          voice_assistant.is_running:
                      timeout: 1s
            - voice_assistant.start:

  - id: ui_dispatch
    mode: single
    then:
      # >>> NO micro_wake_word.stop HERE. It was tried, and check_navigability.py was
      # right to reject it. Yielding the microphone at this point is unconditional, so
      # it fires for PURE NAVIGATION too — moving the cursor or dismissing a menu would
      # stop the wake word, and the harness measured the real cost: clean button-only
      # exits fell from 11 to 1, because every path through here suddenly changed
      # device state. Menu navigation must not make Ember deaf. The yield lives in
      # talk_begin instead, which is only reached when a conversation actually starts.
      #
      # HAPTIC FIRST, for every action including dismiss and bank. This is the one
      # place all touch targets converge (on_touch only hit-tests and sets
      # ui_action), so wiring it here means any future UI target gets feedback for
      # free and cannot forget to ask for it.
      #
      # It inherits chime's `va_state != 1` guard, so nothing plays while the mic
      # is open — this board has no AEC and the speaker shares one I2S hub with the
      # microphone.
      #
      # ui_action == 0 means the touch hit nothing, and gets no acknowledgement:
      # the feedback should mean "that landed", not "something was touched".
      #
      # EXEMPT: the talk action (ui_action == 3). Two independent reasons, and the
      # exemption is also an experiment.
      #
      # 1. It cannot be protected. The pop JP hears "before the chime" IS this
      #    haptic's own driver cold start (device log: ANNOUNCING at 08.403,
      #    `i2s_audio.speaker: Starting` at 08.502 with the amp live and the DAC
      #    unmuted). The mute only arms ~1.1s later inside talk_begin, so the
      #    protection sits BEHIND the transient it is meant to cover — no
      #    value of amp_blank_ms can reach it. Hoisting the blank ahead of the tone
      #    does not work either: amp off at T+0, re-enabled at T+180, awake at
      #    ~T+280, so a 24ms tone starting ~110ms in is simply silenced.
      #
      # 2. The talk tap already HAS feedback, and better feedback: the wyrm startles
      #    — head up, jaw open, eye flaring — and the struck coal flares under the
      #    finger. Both are visual, so neither can collide with the microphone or
      #    with speech. The file's own history agrees: the touch TONE was previously
      #    removed from this path for shared-I2S-lock contention, and reintroducing
      #    audio here under the name "haptic" hit the same wall.
      #
      # AND THIS STAGES THE EXPERIMENT NOBODY HAS RUN. With no tone at tap time, the
      # only remaining transient on this path is the mic's own MCLK restart — which
      # happens INSIDE talk_begin, the one place the config was designed to protect.
      # No pop => the protection works and the question is closed. Still pops => the
      # protection is ineffective and amp gating can be retired outright. Until now
      # the protection had never been given a transient it was in position to cover.
      # EXEMPT: the talk action (3), and now the mic gain pair (14, 15).
      #
      # Gain is exempt for a reason specific to what it controls. A tone plays out of the
      # SPEAKER and says nothing whatsoever about how well the MICROPHONE hears — it is
      # acknowledgement dressed as measurement, on the one control where that is actively
      # misleading. Worse, the overlay stops at y=264 and the telemetry band below it keeps
      # showing `%.1f dBFS   peak %.1f`, so the honest readout is on screen while you
      # adjust — and a chime would be captured by the very microphone being adjusted and
      # spike the number you are reading. (Caveat worth stating rather than implying: that
      # meter is `passive: true`, so it only reads while something else has the mic running.
      # It is live during a conversation, not while the overlay merely sits open.)
      #
      # Visual feedback is not lost by the exemption — the lit stone count changes on the
      # same frame as the tap.
      - if:
          condition:
            lambda: 'return id(ui_action) != 0 && id(ui_action) != 3
                          && id(ui_action) != 14 && id(ui_action) != 15;'
          then:
            - script.execute:
                id: chime
                which: 6
      # cycle: false on both on-screen targets. `number.increment`/`decrement`
      # default to cycle: TRUE (number/__init__.py:392), which would silently
      # wrap 100% -> 0% when you press "+" at maximum. That default is wrong for
      # a volume control and has to be overridden explicitly.
      # The tone fires AFTER the change, so you hear the NEW level. Volume is the
      # one control whose result cannot be judged visually, which is why it earns a
      # tone where menu taps don't — it isn't acknowledgement, it's the readout.
      #
      # This is the ONLY surviving use of chime_touch, and unlike the talk path it is
      # safe: no listening follows a volume tap, so the shared-I2S-lock backoff that
      # killed the talk tone cannot bite. The residual is that a touch-to-talk within
      # ~100ms of a volume tap would still hit the mic's 1s retry — but the overlay
      # has to be dismissed first, which takes longer than that.
      - if:
          condition: { lambda: 'return id(ui_action) == 1;' }
          then:
            - number.decrement: { id: spk_volume, cycle: false }
            - lambda: 'id(ui_gen)++;'
            - script.execute: { id: chime, which: 5 }
      - if:
          condition: { lambda: 'return id(ui_action) == 2;' }
          then:
            - number.increment: { id: spk_volume, cycle: false }
            - lambda: 'id(ui_gen)++;'
            - script.execute: { id: chime, which: 5 }

      # MIC GAIN -/+ . DELIBERATELY SILENT, unlike the volume pair above.
      #
      # Volume earns a tone because it is the one control whose result cannot be judged
      # visually — the tone IS the readout. Mic gain is the opposite: a tone plays out of
      # the SPEAKER and says nothing whatsoever about how well the microphone hears. It
      # would be acknowledgement dressed up as measurement, on the one control where the
      # honest readout already exists on screen (the level meter) and where a chime would
      # additionally be captured by the very microphone being adjusted.
      #
      # cycle: false for the same reason as volume: number.increment wraps by default, and
      # a gain control that jumps from 42dB to 0dB when you press "+" is a bug.
      - if:
          condition: { lambda: 'return id(ui_action) == 14;' }
          then:
            - number.decrement: { id: mic_gain_num, cycle: false }
            - lambda: 'id(ui_gen)++;'
      - if:
          condition: { lambda: 'return id(ui_action) == 15;' }
          then:
            - number.increment: { id: mic_gain_num, cycle: false }
            - lambda: 'id(ui_gen)++;'

      # talk toggle — the gesture that existed before, unchanged, and gated by hush
      - if:
          condition: { lambda: 'return id(ui_action) == 3;' }
          then:
            - if:
                condition:
                  - lambda: 'return id(va_state) == 0 || id(va_state) == 4;'
                then:
                  # Toned + delayed, so the tone is never captured by the mic.
                  - script.execute: talk_begin
                else:
                  # Cancelling is instant: no tone, no delay. Waiting 190ms to stop
                  # something would feel broken in a way that waiting to start does not.
                  - voice_assistant.stop:

      # The mode chip tap (action 17) — cycle Normal -> No talking -> Hush.
      # Routed through the SELECT, exactly like the mode submenu's action 10:
      # the select's own on_value carries every side effect (op_mode global,
      # the Hush switch view, HA state), so a tap and an automation write are
      # indistinguishable downstream. The haptic is fired BEFORE the mode
      # changes so that leaving-hush and entering-hush feel the same at the
      # fingertip; entering hush, it is the last sound until hush lifts, which
      # reads as the door closing rather than as a dropped tap.
      - if:
          condition: { lambda: 'return id(ui_action) == 17;' }
          then:
            - script.execute: { id: chime, which: 6 }
            - lambda: |-
                id(sel_mode)->make_call()
                    .set_index((size_t) ((id(op_mode) + 1) % 3))
                    .perform();
                id(ui_action) = 0;

      # ---- slack reply (30) ----
      # One event, nothing else — the bridge drives the ask_question, posts
      # the transcript, and speaks ONLY on failure. Success is silent by the
      # bridge's design: the reply appearing in Slack is the confirmation, and
      # a firmware chime here would double-confirm. Entries that know their
      # channel pass it; the rest omit it and the bridge replies to the last
      # Slack message announced on this hearth.
      # NOT homeassistant.event: ESPHome may only fire `esphome.*` events, so
      # the device calls the ember_slack_reply_fire relay script, which fires
      # the bridge's real event (and drops an empty channel key, preserving
      # the last-announced fallback).
      - if:
          condition: { lambda: 'return id(ui_action) == 30;' }
          then:
            - homeassistant.service:
                service: script.ember_slack_reply_fire
                data:
                  device: ${name}
                  channel: !lambda |-
                    if (id(chron_sel) >= 0 &&
                        id(chron_sel) < (int) id(chron_chan).size())
                      return id(chron_chan)[(size_t) id(chron_sel)];
                    return std::string("");
            - lambda: |-
                id(ui_mode) = 0;
                id(force_full_repaint) = true;
                id(ui_action) = 0;

      # ---- the front-screen reply rune (33): answer the LATEST tagged word ----
      # Same relay as the chronicle detail's reply (30) but the target is
      # resolved here: the newest entry that carries a Slack address. The
      # hit-test only arms when one exists, so the empty fallback below is
      # defensive — a chron_push between touch and release could in principle
      # reshuffle, and the relay's empty-channel path (bridge falls back to
      # last-announced) is the right answer to that race anyway.
      - if:
          condition: { lambda: 'return id(ui_action) == 33;' }
          then:
            - homeassistant.service:
                service: script.ember_slack_reply_fire
                data:
                  device: ${name}
                  channel: !lambda |-
                    const auto &cc = id(chron_chan);
                    for (int i = (int) cc.size() - 1; i >= 0; i--)
                      if (!cc[(size_t) i].empty())
                        return cc[(size_t) i];
                    return std::string("");
            - lambda: 'id(ui_action) = 0;'

      # ---- the horn's picker (27-29) ----
      # 27 parses the names list, skips this hearth's own name, resolves the
      # tapped row, stashes it in ic_pick, and hands the summons to HA — the
      # capture-and-carry lives in script.ember_intercom_to, so the firmware
      # stays the dumb button the intercom family was designed around.
      - if:
          condition: { lambda: 'return id(ui_action) == 27;' }
          then:
            - lambda: |-
                id(ic_pick).clear();
                const std::string &all = id(ic_targets).state;
                const int want = id(ic_page) * 6 + id(ui_sel);
                int vis = 0;
                size_t pos = 0;
                while (pos <= all.size()) {
                  size_t bar = all.find('|', pos);
                  if (bar == std::string::npos) bar = all.size();
                  const std::string nm = all.substr(pos, bar - pos);
                  if (!nm.empty() && nm != "${friendly_name}") {
                    if (vis == want) { id(ic_pick) = nm; break; }
                    vis++;
                  }
                  pos = bar + 1;
                }
            - if:
                condition: { lambda: 'return !id(ic_pick).empty();' }
                then:
                  - homeassistant.service:
                      service: script.ember_intercom_to
                      data:
                        source_sat: ${satellite_entity}
                        target_name: !lambda 'return id(ic_pick);'
                  - lambda: |-
                      id(ui_mode) = 0;
                      id(force_full_repaint) = true;
                      id(ui_action) = 0;
            - lambda: 'id(ui_action) = 0;'
      - if:
          condition: { lambda: 'return id(ui_action) == 28 || id(ui_action) == 29;' }
          then:
            - lambda: |-
                int p = id(ic_page) + (id(ui_action) == 28 ? 1 : -1);
                if (p < 0) p = 0;
                id(ic_page) = p;   // overrun clamps at draw time, where the
                                   // visible count is actually known
                id(ui_action) = 0;

      # ---- brightness (25/26): the third audio-overlay row ----
      # light.turn_on ACTIONS, not a lambda touching id(backlight) — partly
      # for the transition/light-call semantics, and partly because the
      # navigability harness compiles every dispatch lambda verbatim and
      # should not need a light stub for a control the button never drives.
      # Floor at 10%: a 0% screen is indistinguishable from a dead one, and
      # banking is how the screen goes dark on purpose.
      - if:
          condition: { lambda: 'return id(ui_action) == 25;' }
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda |-
                  const float b = id(backlight).remote_values.get_brightness();
                  return b - 0.10f < 0.10f ? 0.10f : b - 0.10f;
            - lambda: |-
                id(ui_gen)++;
                id(ui_action) = 0;
      - if:
          condition: { lambda: 'return id(ui_action) == 26;' }
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda |-
                  const float b = id(backlight).remote_values.get_brightness();
                  return b + 0.10f > 1.0f ? 1.0f : b + 0.10f;
            - lambda: |-
                id(ui_gen)++;
                id(ui_action) = 0;

      # ---- openers that must run on RELEASE (19 tome, 24 help) ----
      # These change ui_mode, and a mode change inside on_touch hands the rest
      # of the same finger's report stream to the new mode's hit-test — the
      # open-then-instantly-dismiss bug the tome shipped with.
      - if:
          condition: { lambda: 'return id(ui_action) == 19;' }
          then:
            - lambda: |-
                id(chron_page) = 0;
                id(chron_sel) = -1;
                id(ui_mode) = 4;
                id(ui_gen)++;
                id(ui_action) = 0;
      - if:
          condition: { lambda: 'return id(ui_action) == 24;' }
          then:
            - lambda: |-
                id(help_page) = 0;
                id(ui_mode) = 6;
                id(ui_gen)++;
                id(ui_action) = 0;
      - if:
          condition: { lambda: 'return id(ui_action) == 31 || id(ui_action) == 32;' }
          then:
            - lambda: |-
                int hp = id(help_page) + (id(ui_action) == 32 ? 1 : -1);
                if (hp < 0) hp = 0;
                if (hp > 4) hp = 4;
                id(help_page) = hp;
                id(ui_gen)++;
                id(ui_action) = 0;

      # ---- the reading font (34/35): the audio overlay's fourth row ----
      # Clamped over the three baked rungs (15/17/20pt — see the font: block).
      # force_full_repaint so the scroll band re-renders in the new size while
      # you're still choosing: the selection is judged by reading, not labels.
      - if:
          condition: { lambda: 'return id(ui_action) == 34 || id(ui_action) == 35;' }
          then:
            - lambda: |-
                int s = id(font_scale) + (id(ui_action) == 35 ? 1 : -1);
                if (s < 0) s = 0;
                if (s > 2) s = 2;
                if (s != id(font_scale)) {
                  id(font_scale) = s;
                  id(force_full_repaint) = true;
                }
                id(ui_gen)++;
                id(ui_action) = 0;

      # ---- douse (36): deep sleep until the BOOT button (2026-08-24) ----
      # Backlight off first so the goodnight is visible as a goodnight, a
      # beat of delay so the light call lands, then the chip sleeps. There
      # is deliberately NO confirmation step beyond the menu's own shape:
      # the row is cursor-last-but-one, amber, and reachable only through a
      # menu that opens on a held button — the same act that wakes her.
      - if:
          condition: { lambda: 'return id(ui_action) == 36;' }
          then:
            - lambda: 'id(ui_action) = 0;'
            - light.turn_off: backlight
            - delay: 400ms
            - deep_sleep.enter: hearth_sleep

      # ---- the vision's gestures (37 open-from-chronicle, 38 tap-advance) ----
      # 37: a chronicle entry that carries an image re-opens it — the stash
      # keeps the newest 24 server-side, so a very old entry's fetch may 404
      # and the vision simply doesn't open (on_error logs, nothing changes).
      # 38: tap advances framed -> fullscreen -> gone; zoomed taps to full.
      - if:
          condition: { lambda: 'return id(ui_action) == 37;' }
          then:
            - lambda: |-
                id(ui_action) = 0;
                if (id(chron_sel) < 0 ||
                    id(chron_sel) >= (int) id(chron_img).size() ||
                    id(chron_img)[(size_t) id(chron_sel)].empty())
                  return;
                const std::string &pk = id(chron_img)[(size_t) id(chron_sel)];
                id(vision_urls) = pk;
                id(vision_idx) = 0;
                std::string rel = pk.substr(0, pk.find('|'));
                id(vision_url) = (rel[0] == '/') ? (std::string("${ha_base}") + rel) : rel;
                const std::string &e = id(chron)[(size_t) id(chron_sel)];
                std::string cap = e.substr(1);
                if (cap.size() > 30) { cap.resize(29); cap += "..."; }
                id(vision_caption) = cap;
                id(vision_view) = 0;
                id(vision_px) = 0;
                id(vision_py) = 0;
                id(vision_img)->set_url(id(vision_url).c_str());
                id(vision_img)->update();
      - if:
          condition: { lambda: 'return id(ui_action) == 38;' }
          then:
            - lambda: |-
                id(ui_action) = 0;
                if (id(vision_view) == 0) {
                  id(vision_view) = 1;
                } else if (id(vision_view) == 2) {
                  id(vision_view) = 1;
                  id(vision_px) = 0;
                  id(vision_py) = 0;
                } else {
                  id(ui_mode) = 0;
                  id(vision_view) = 0;
                  id(force_full_repaint) = true;
                }
                id(ui_gen)++;
      # ---- 39/40: swipe between one message's images (wraps) ----
      - if:
          condition: { lambda: 'return id(ui_action) == 39 || id(ui_action) == 40;' }
          then:
            - lambda: |-
                const bool fwd = (id(ui_action) == 39);
                id(ui_action) = 0;
                const std::string &pk = id(vision_urls);
                if (pk.empty()) return;
                int cnt = 1;
                for (char c : pk) if (c == '|') cnt++;
                if (cnt < 2) return;
                int idx = (id(vision_idx) + (fwd ? 1 : cnt - 1)) % cnt;
                // walk to the idx-th segment
                size_t a = 0;
                for (int i = 0; i < idx; i++) a = pk.find('|', a) + 1;
                size_t b = pk.find('|', a);
                std::string rel = pk.substr(a, b == std::string::npos
                                                   ? std::string::npos : b - a);
                if (rel.empty()) return;
                id(vision_idx) = idx;
                id(vision_url) = (rel[0] == '/')
                                     ? (std::string("${ha_base}") + rel) : rel;
                id(vision_px) = 0;
                id(vision_py) = 0;
                id(ui_last_ms) = millis();
                id(vision_img)->set_url(id(vision_url).c_str());
                id(vision_img)->update();

      # ---- the chronicle's actions (18, 20-23) ----
      # 18 open an entry · 20/21 page older/newer · 22 back to list · 23 SPEAK.
      - if:
          condition: { lambda: 'return id(ui_action) == 18;' }
          then:
            - lambda: |-
                // Row -> ring index. Page 0 shows the NEWEST four, rows top-down
                // newest-first, so the mapping runs from the back of the vector.
                const int n = (int) id(chron).size();
                const int idx = n - 1 - (id(chron_page) * 3 + id(ui_sel));
                if (idx >= 0 && idx < n) {
                  id(chron_sel) = idx;
                  id(ui_mode) = 5;
                }
                id(ui_action) = 0;
      - if:
          condition: { lambda: 'return id(ui_action) == 20 || id(ui_action) == 21;' }
          then:
            - lambda: |-
                const int n = (int) id(chron).size();
                const int pages = n == 0 ? 1 : (n + 2) / 3;
                int p = id(chron_page) + (id(ui_action) == 20 ? 1 : -1);
                if (p < 0) p = 0;
                if (p > pages - 1) p = pages - 1;
                id(chron_page) = p;
                id(ui_action) = 0;
      - if:
          condition: { lambda: 'return id(ui_action) == 22;' }
          then:
            - lambda: |-
                id(ui_mode) = 4;
                id(ui_action) = 0;
      # SPEAK — replay through the house's one sanctioned announce path, aimed
      # back at this same hearth. The chime herald plays first (that is the
      # announce contract) and the highlight clock re-anchors when the TTS
      # actually starts (see on_tts_start), so HA round-trip latency cannot
      # drift the karaoke.
      - if:
          condition: { lambda: 'return id(ui_action) == 23 && id(chron_sel) >= 0 && id(chron_sel) < (int) id(chron).size();' }
          then:
            - homeassistant.service:
                service: script.ember_announce
                data:
                  satellite: ${satellite_entity}
                  message: !lambda 'return id(chron)[(size_t) id(chron_sel)].substr(1);'
            - lambda: |-
                id(chron_play_idx) = id(chron_sel);
                id(chron_play_ms) = millis();   // provisional; re-anchored at tts start
                id(ui_action) = 0;

      # The horn — the intercom corner (action 16). Idle-gated exactly like the
      # talk start: mid-conversation the satellite cannot run ask_question
      # anyway, and a press that QUEUED one would fire seconds later, after the
      # moment has passed — a late summon is worse than a dropped one. The event
      # is the entire firmware-side job; packages/ember_intercom.yaml on the HA
      # side does the listening and the relaying, which is what keeps this path
      # out of the I2S/VA state machine entirely.
      - if:
          condition: { lambda: 'return id(ui_action) == 16;' }
          then:
            - if:
                condition:
                  - lambda: 'return id(va_state) == 0 || id(va_state) == 4;'
                then:
                  # 2026-08-09: the horn opens the SPEAKER PICKER (ui_mode 7)
                  # when HA has published a target list, and falls back to the
                  # old paired event when it hasn't (boot, HA down, empty
                  # list). The fallback is why the paired relay automation
                  # still exists — a horn that goes silent because a sensor is
                  # stale would be a regression from the fixed pairing.
                  - if:
                      condition:
                        - lambda: 'return id(ic_targets).has_state() && !id(ic_targets).state.empty();'
                      then:
                        - lambda: |-
                            id(ic_page) = 0;
                            id(ui_sel) = -1;
                            id(ui_mode) = 7;
                            id(ui_gen)++;
                      else:
                        - event.trigger:
                            id: intercom_evt
                            event_type: pressed

      # Row 0 opened a submenu rather than toggling, because the mode is a three-way
      # choice and a toggle cannot express it. The Hush entity still toggles for
      # anything that automates it (it is a view onto mode == 2).
      - if:
          condition: { lambda: 'return id(ui_action) == 5;' }
          then:
            - lambda: |-
                id(ui_mode) = 3;                    // the mode submenu
                id(ui_sel) = -1;                    // nothing preselected
                id(ui_last_ms) = millis();
                id(ui_gen)++;
                id(ui_action) = 0;

      # Apply the mode the cursor is on. ui_sel carries the row, and because the modes
      # are monotonic the row index IS the mode value — no mapping at the tap site.
      - if:
          condition: { lambda: 'return id(ui_action) == 10 && id(ui_sel) >= 0 && id(ui_sel) < 3;' }
          then:
            - lambda: |-
                id(sel_mode)->make_call().set_index((size_t) id(ui_sel)).perform();
                id(ui_action) = 4;                  // then dismiss

      - if:
          condition: { lambda: 'return id(ui_action) == 6;' }
          then:
            - light.turn_off: backlight
            - lambda: |-
                id(screen_banked) = true;
                id(ui_action) = 4;                  // then dismiss

      - if:
          condition: { lambda: 'return id(ui_action) == 7;' }
          then:
            - button.press: btn_rouse_touch
            - lambda: 'id(ui_action) = 4;'          # then dismiss

      # Rekindle LAST, and it is item index 3 so a cycling cursor reaches every
      # harmless option before it. on_click fires on release, so BOOT is already
      # up — the board cannot fall into ROM download mode on this path.
      - if:
          condition: { lambda: 'return id(ui_action) == 8;' }
          then:
            - button.press: btn_restart

      - if:
          condition: { lambda: 'return id(ui_action) == 4;' }
          then:
            - lambda: |-
                id(ui_mode) = 0;
                id(ui_sel) = -1;
                id(force_full_repaint) = true;      // one ~60ms frame, clean slate

      - lambda: 'id(ui_action) = 0;'

sensor:
  # What the CODEC actually holds, read back from REG16 — not what the number says it
  # should hold. The whole point is that these are two different facts.
  - platform: template
    id: mic_gain_codec
    name: Mic Gain (codec)
    unit_of_measurement: "dB"
    accuracy_decimals: 0
    icon: mdi:microphone-settings
    entity_category: diagnostic

  - platform: adc
    pin: GPIO9
    name: Battery Voltage
    id: batt_v_sensor
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0          # onboard 2:1 divider
      # Median over 5 samples (5 minutes at 60s) — the speaker pulls the rail
      # down during playback, and a single sagged reading must not gutter the
      # candle or fire the chime. Median rather than mean: one deep sag sample
      # is discarded entirely instead of dragging the average. send_every: 1
      # keeps HA seeing a value every 60s, just a filtered one.
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
    # ---- THE CELL LADDER (mobile only; folds out at has_battery 0) ----
    #
    # Runs on the filtered value, once a minute. Everything battery-shaped hangs
    # off this one hook: SOC for the candle and the exported sensor, the low
    # latch, and the guttering chime. The CRITICAL act (speak + broadcast) is
    # deliberately NOT here — it lives in the ember_battery_watch HA package,
    # because it needs script.ember_broadcast's quiet-hours routing, and the
    # device cannot know about Slack. Division of labour matches the announce
    # chain: the device owns its own noises, HA owns who else gets told.
    on_value:
      - lambda: |-
          if (${has_battery} == 0) return;   // desk: floating pin, all noise
          if (std::isnan(x)) return;
          id(batt_v_filt) = x;
          // Rested-voltage -> SOC, piecewise linear, calibrated to THIS cell's
          // observed 2026-08-06/07 discharge rather than a datasheet curve.
          // Between the table's ends it clamps: >4.15 is 100, <3.20 is 0.
          // Sized declarations, not `[]`, and that is LOAD-BEARING for tooling:
          // check_art_sync.py treats every `static const <type> NAME[] = {...}`
          // (empty brackets) in this file as a flame-art table that must exist in
          // dragon_spans.inc. Sizing the array is how a non-art table opts out —
          // the same convention that keeps LEN_MS[8] in the chime script invisible
          // to it. Do not "tidy" the sizes away; the check starts failing.
          static const float VS[11] = {4.15f, 4.00f, 3.90f, 3.80f, 3.70f, 3.60f,
                                       3.50f, 3.45f, 3.40f, 3.30f, 3.20f};
          static const int   PC[11] = {100,   92,    80,    65,    52,    38,
                                       22,    15,    9,     4,     0};
          const int N = 11;
          int soc;
          if (x >= VS[0]) soc = 100;
          else if (x <= VS[N-1]) soc = 0;
          else {
            soc = 0;
            for (int i = 1; i < N; i++) {
              if (x > VS[i]) {
                soc = PC[i] + (int) ((PC[i-1] - PC[i]) * (x - VS[i]) /
                                     (VS[i-1] - VS[i]) + 0.5f);
                break;
              }
            }
          }
          id(batt_soc) = soc;
          // One chime per discharge: latch on crossing low, release only after
          // a +5-point recovery (i.e. the charger, not sag jitter — the median
          // already ate single-sample sag, this hysteresis eats the slow kind).
          if (!id(batt_low_latched) && soc <= ${batt_low_pct}) {
            id(batt_low_latched) = true;
            id(chime)->execute(7);
          } else if (id(batt_low_latched) && soc >= ${batt_low_pct} + 5) {
            id(batt_low_latched) = false;
          }
          // ---- charging + sated, read from the TREND (2026-08-10, v2) ----
          // The TP4054's CHRG pin goes to a 10K pull-up (R11) and NOTHING
          // else — no GPIO, not even the reference design's LED (board fact,
          // the vendor schematic; the net appears exactly once). So the only
          // place charge state shows is the voltage's behaviour over time.
          //
          // v2 THE SAME DAY, and the reason is measured, not aesthetic: v1
          // compared single filtered samples 5 minutes apart with a ±4mV
          // flat band and ±8/15mV latch thresholds — sized for the ~±3mV the
          // median filter was ASSUMED to leave. The mobile's real trace
          // (2026-08-10 12:05-12:42 PDT, plugged and resting the whole time)
          // swung +32 to -42mV per window with no state change underneath.
          // JP watched the bolt appear on the boot transient and vanish on
          // the next swing ("it was on mobile, and now it's not"). A
          // detector whose thresholds sit INSIDE the noise floor is a
          // random-number generator with good intentions.
          //
          // v2 shape, all three changes aimed at that trace:
          //  - Compare 3-sample MEDIANS ~7 minutes apart (both ends
          //    denoised), drawn from a 10-minute ring.
          //  - FILLING latches on dv >= +20mV (real CC charge measures about
          //    +42mV per span) and clears only on one big fall (<= -18mV —
          //    the unplug load step) or three sustained <= -10mV windows
          //    (the post-termination relaxation tail). One noisy window can
          //    no longer unlatch anything.
          //  - SATED (plugged AND full — the SL2305 power path rests the
          //    cell unloaded, so plugged-full is high AND flat; unplugged,
          //    the cell carries Ember at ~C/12 and falls) latches on three
          //    consecutive |dv| <= 12mV windows at >= 4.02V, and unlatches
          //    only on real decline (<= -20mV), real drain (< 3.98V), or
          //    the charger starting again. The 4.02 floor sits BELOW the
          //    TP4054's ~4.05 relaxation band (a floor above it made the
          //    dish flicker on a cell that never left the plug) and above
          //    the 3.6-3.8V plateau, the only place discharge is genuinely
          //    flat.
          // Worst honest cases, stated: up to ~20 minutes of gold dish
          // after unplugging a full cell (the < 3.98V test ends it), and a
          // ~10-minute dim gap between "motes stop" and "sated latches"
          // while the cell relaxes — a window in which neither claim would
          // be true anyway. Warmup after any reboot: 10 ring samples plus 3
          // flat windows, so ~13 minutes to the first gold dish.
          // Statics, not globals: nothing else reads the trail, and a
          // reboot that forgets ten minutes of history re-learns it in ten.
          static float vtrail[10] = {0};
          static uint8_t vt_n = 0, vt_i = 0;
          vtrail[vt_i] = x;
          vt_i = (uint8_t) ((vt_i + 1) % 10);
          if (vt_n < 10) {
            vt_n++;
          } else {
            auto med3 = [](float a, float b, float c) -> float {
              const float lo = a < b ? a : b, hi = a < b ? b : a;
              return c < lo ? lo : (c > hi ? hi : c);
            };
            // vt_i points at the OLDEST slot after the post-increment above
            const float oldm = med3(vtrail[vt_i], vtrail[(vt_i + 1) % 10],
                                    vtrail[(vt_i + 2) % 10]);
            const float newm = med3(vtrail[(vt_i + 7) % 10],
                                    vtrail[(vt_i + 8) % 10],
                                    vtrail[(vt_i + 9) % 10]);
            const float dv = newm - oldm;
            static uint8_t fall_n = 0;
            fall_n = (dv <= -0.010f)
                         ? (uint8_t) (fall_n >= 3 ? 3 : fall_n + 1) : 0;
            if (!id(batt_chg) && dv >= 0.020f) {
              id(batt_chg) = true;
            } else if (id(batt_chg) && (dv <= -0.018f || fall_n >= 3)) {
              id(batt_chg) = false;
            }
            static uint8_t flat_n = 0;
            const bool flatf = newm >= 4.02f && !id(batt_chg)
                               && dv > -0.012f && dv < 0.012f;
            flat_n = flatf ? (uint8_t) (flat_n >= 3 ? 3 : flat_n + 1) : 0;
            if (!id(batt_sated)) {
              id(batt_sated) = (flat_n >= 3);
            } else if (dv <= -0.020f || newm < 3.98f || id(batt_chg)) {
              id(batt_sated) = false;
            }
          }

  # Calibrated dBFS level, straight from ESPHome's purpose-built component.
  #
  # passive: true is what makes this safe on this board: it NEVER starts or
  # stops the microphone, it only piggybacks on audio another component has
  # already started (Microphone::add_data_callback is a CallbackManager, so
  # N consumers are fine). That means zero contention with voice_assistant
  # over the shared I2S hub.
  #
  # Capped at 20Hz (measurement_duration floor is 50ms), which is why the
  # fast waveform below still uses the on_data ring buffer instead.
  #
  # Publishes NAN while the mic isn't running (e.g. during TTS playback) —
  # the on_value guards below hold the last good value rather than drawing junk.
  - platform: sound_level
    id: sound_lvl
    microphone:
      microphone: mic
      channels: 0
    passive: true
    measurement_duration: 50ms
    rms:
      name: Mic RMS
      id: mic_rms_db
      on_value:
        # Runs in the MAIN LOOP (sound_level publish_state()s from loop()),
        # so touching display state from here is safe.
        - lambda: |-
            if (!std::isnan(x)) {
              id(db_rms) = x;
              id(mic_live) = true;
              // Push into the rolling waveform history. 20Hz x 120 samples
              // = 6 seconds of visible history.
              float f = (x - ${db_floor}f) / (${db_ceil}f - ${db_floor}f);
              if (f < 0.0f) f = 0.0f;
              if (f > 1.0f) f = 1.0f;
              id(level_hist)[id(hist_idx)] = f;
              id(hist_idx) = (id(hist_idx) + 1) % ${hist_len};
            } else {
              id(mic_live) = false;
            }
    peak:
      name: Mic Peak
      id: mic_peak_db
      on_value:
        - lambda: |-
            if (!std::isnan(x) && x > id(db_peak_hold)) id(db_peak_hold) = x;

  # BRING-UP AFFORDANCE for the frames-derived speaking animation.
  #
  # During TTS this MUST climb at ~16000/s. If it stays flat, then
  # audio_output_callback_ is not reaching us — most likely a resampler or mixer
  # sits between voice_assistant and `spk`, so frames are counted at a different
  # stage. Fallback (an is_running()-gated wall clock) is in
  # scratch/hosyond-s3/luna-visual-design.md section 5.3.
  #
  # Caveat: float has a 24-bit mantissa, so this reads exactly only up to
  # 16.7M frames (~17 min of cumulative playback). Diagnostic only — the
  # display maths uses the uint32_t directly and is unaffected.
  - platform: template
    name: Speaker Frames
    id: spk_frames_sensor
    lambda: 'return (float) id(spk_frames);'
    update_interval: 1s
    accuracy_decimals: 0
    entity_category: diagnostic

  # ---------------- THE HOUSE, SEEN FROM THE HEARTH ----------------
  #
  # THE FIRST STATE THIS DEVICE HAS EVER IMPORTED FROM HOME ASSISTANT. Everything
  # else here flows outward — sensors Ember publishes, a voice pipeline it feeds.
  # These four (plus the text_sensor below) flow inward, which has one consequence
  # worth stating plainly: they are NaN until HA connects and says otherwise. That
  # is not an error path, it is the normal first second of every boot, and the
  # display must render it as "I don't know" rather than as zero.
  #
  # All five read ONE entity, sensor.ember_house_watch, whose Jinja does every
  # set-union, dedupe and truncation this display needs. See
  # homeassistant/packages/ember_house_watch.yaml for the four traps that shaping
  # avoids — most importantly that a naive count of light.* would include Ember's
  # OWN backlight and never read zero.
  #
  # `internal: true` on all of them: they came FROM Home Assistant, so publishing
  # them back would create a second, staler copy of the same truth in the same
  # system, plus five entities nobody asked for.
  - platform: homeassistant
    id: house_rooms
    entity_id: sensor.ember_house_watch
    internal: true
  - platform: homeassistant
    id: house_lights
    entity_id: sensor.ember_house_watch
    attribute: lights
    internal: true
  - platform: homeassistant
    id: house_cooling
    entity_id: sensor.ember_house_watch
    attribute: cooling
    internal: true
  - platform: homeassistant
    id: house_heating
    entity_id: sensor.ember_house_watch
    attribute: heating
    internal: true

# The room names, already joined with " . " and already capped at four with a
# "+N" tail by the template sensor. The device does no string work beyond
# printing this.
text_sensor:
  # The horn's target menu: online speakers, pipe-joined names, published by
  # sensor.ember_speaker_targets (ember_intercom.yaml). Names ONLY — ESPHome
  # text states cap at 255 bytes — and the chosen name goes back to HA, which
  # resolves it against the same enumeration. The device filters its own
  # friendly_name out at draw time; every other row is a place a word can go.
  - platform: homeassistant
    id: ic_targets
    entity_id: sensor.ember_speaker_targets
    attribute: names
    internal: true
  - platform: homeassistant
    id: house_names
    entity_id: sensor.ember_house_watch
    attribute: names
    internal: true

########################  the horn — intercom event  ########################
#
# The intercom button's whole firmware-side output: one event entity. HA sees
# `event.<name>_intercom` fire and runs the relay (ask_question -> announce on
# the peer hearth) from packages/ember_intercom.yaml. An EVENT entity rather
# than a device-side `homeassistant.action` call, for two reasons: it needs no
# "allow the device to perform Home Assistant actions" permission, and the
# entity id itself carries which hearth pressed it — the automation derives
# source and peer from that, so the shared firmware stays identical on both
# boards (the wrapper pattern, issue #44).
event:
  - platform: template
    id: intercom_evt
    name: Intercom
    icon: mdi:bugle
    event_types:
      - pressed

########################  visualiser state  ########################

globals:
  # ---- the cell's state, written by the battery ADC's on_value ----
  # batt_soc is -1 until the first sample lands, and the candle draws a COLD
  # WICK for -1 rather than an empty candle: "I don't know" and "empty" must
  # never share a glyph (the same rule the house row enforces with "hearths
  # unknown", and for the same reason — the two errors cost differently).
  # restore_value: no on all three, deliberately: after a reboot the first real
  # sample re-derives everything within 60s, and a restored latch from before a
  # night on the charger would eat the next discharge's one chime.
  - id: batt_soc
    type: int
    restore_value: no
    initial_value: '-1'
  - id: batt_v_filt
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: batt_low_latched
    type: bool
    restore_value: no
    initial_value: 'false'
  # Charging, inferred from the voltage TREND (the TP4054's CHRG pin isn't
  # wired — see the detector in the cell ladder). restore_value no for the
  # same reason as the rest of the ladder: five minutes of fresh samples
  # re-derive it, and a latch restored from before an overnight unplug lies.
  - id: batt_chg
    type: bool
    restore_value: no
    initial_value: 'false'
  # Sated: plugged in AND full — distinguishable from "unplugged and full"
  # by LOAD, thanks to the SL2305 power path (see the detector). restore no,
  # same reasoning as the rest of the ladder.
  - id: batt_sated
    type: bool
    restore_value: no
    initial_value: 'false'

  # Tracks the DAC mute state so unmuting is idempotent across the three
  # triggers that call it. Starts TRUE because on_boot mutes: the DAC must
  # already be muted before the first I2S start, or the first audio still pops.
  - id: dac_muted
    type: bool
    restore_value: false
    initial_value: 'true'

  # Rolling waveform history, 0.0-1.0, fed from sound_level's on_value at 20Hz.
  - id: level_hist
    type: float[120]
    restore_value: false

  - id: hist_idx
    type: int
    restore_value: false
    initial_value: '0'

  # Calibrated dBFS from sound_level (20Hz) — drives the fire in LISTENING.
  - id: db_rms
    type: float
    restore_value: false
    initial_value: '${db_floor}f'

  - id: db_peak_hold
    type: float
    restore_value: false
    initial_value: '${db_floor}f'

  # ---- THE CHRONICLE (2026-08-09, JP: "each ember should store the latest
  # maybe 100 messages where they can be scrolled fullscreen and played back
  # with word or sentence highlighting") ----
  #
  # A ring of the last 100 utterances this hearth heard, said, or relayed.
  # Each entry is one std::string whose FIRST BYTE is the kind — 'h' heard,
  # 's' said, 'a' announced — and the rest is the text. One vector instead of
  # parallel arrays because the invariant "kind and text belong together"
  # should be unbreakable by construction, not by discipline.
  #
  # VOLATILE ON PURPOSE (v1): ~24KB lives in heap and dies at reboot. Flash
  # persistence was considered and deferred — it needs a filesystem this
  # config doesn't carry, and "history since last wake" is honest as long as
  # the face never claims otherwise (an empty chronicle says "nothing yet
  # this waking"). If reboots prove frequent enough to hurt, that's the v2.
  - id: chron
    type: std::vector<std::string>
    restore_value: no
  # Parallel to `chron`, same indices: the Slack conversation id behind an
  # announced entry, or "" for everything else. A PARALLEL vector rather than
  # an encoding change inside the entries, deliberately: every text consumer
  # (list, detail, SPEAK, the karaoke anchor, the replay dedupe) keeps reading
  # entry.substr(1) untouched, and only the reply path reads this. Written by
  # the slack_note api service; the bridge's slack_bridge_announced event
  # feeds it via an automation in ember_slack.yaml.
  - id: chron_chan
    type: std::vector<std::string>
    restore_value: no
  # Third parallel vector (2026-08-24, JP: "if multiple images are sent they
  # should appear in the chronicle"): the /local image URL behind an announced
  # entry, or "" — same parallel-vector reasoning as chron_chan. Written by
  # the show_image api service; the bridge keeps the newest 24 files alive
  # server-side, so a very old entry's image may 404 — the vision's on_error
  # handles that by simply not opening.
  - id: chron_img
    type: std::vector<std::string>
    restore_value: no
  # The vision's state: current image URL (for the zoom re-fetch), which zoom
  # URL is actually in the zoom buffer, view (0 framed / 1 fullscreen /
  # 2 zoomed), and the zoom pan offsets in screen px.
  - id: vision_url
    type: std::string
    restore_value: no
  # All of one message's images, as /local paths packed with '|' (1.4.3+
  # bridge sends up to 6). vision_idx is which one is on the glass; swipe
  # left/right moves it. Packed string rather than a fourth vector so
  # chron_img can carry the whole set per entry unchanged.
  - id: vision_urls
    type: std::string
    restore_value: no
  - id: vision_idx
    type: int
    restore_value: no
    initial_value: '0'
  - id: zoom_url
    type: std::string
    restore_value: no
  - id: vision_view
    type: int
    restore_value: no
    initial_value: '0'
  - id: vision_px
    type: int
    restore_value: no
    initial_value: '0'
  - id: vision_py
    type: int
    restore_value: no
    initial_value: '0'
  - id: chron_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: chron_sel
    type: int
    restore_value: no
    initial_value: '-1'
  # Playback highlight clock: which entry is being re-spoken and when it was
  # asked for. The highlighter runs on the SAME calibrated estimator as the
  # progress fuse (tts_lead_ms + chars * tts_ms_per_char) — word timings do
  # not exist anywhere in the pipeline, but the estimator is bench-calibrated
  # and the fuse has already proven it lands within a beat of real speech.
  - id: chron_play_idx
    type: int
    restore_value: no
    initial_value: '-1'
  - id: chron_play_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # the help book's page (ui_mode 6)
  - id: help_page
    type: int
    restore_value: no
    initial_value: '0'
  # the horn's speaker picker (ui_mode 7): page, and the name the finger chose
  # — held in a global so the homeassistant.service action's lambda can read
  # it without re-parsing the list a second time.
  - id: ic_page
    type: int
    restore_value: no
    initial_value: '0'
  - id: ic_pick
    type: std::string
    restore_value: no

  # false while sound_level publishes NAN (mic not running, e.g. during TTS)
  - id: mic_live
    type: bool
    restore_value: false
    initial_value: 'false'

  # 0 idle · 1 listening · 2 thinking · 3 speaking · 4 error
  - id: va_state
    type: int
    restore_value: false
    initial_value: '0'

  # ---- the audio clock ----
  # Frames clocked to the DAC. WRITTEN FROM speaker_task (see the on_boot note),
  # read from the main loop. volatile + naturally-atomic 32-bit access.
  # Never widen this type and never add a second writer.
  - id: spk_frames
    type: volatile uint32_t
    restore_value: false
    initial_value: '0'

  # Snapshot of spk_frames when playback actually began. Main loop only.
  - id: spk_frames_mark
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Estimated utterance length, from the on_tts_start text. 0 = unknown, and
  # the fuse then hides itself rather than inventing a denominator.
  - id: tts_est_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ---- the words ----
  - id: heard_text
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: said_text
    type: std::string
    restore_value: false
    initial_value: '""'

  # Bumped whenever heard_text/said_text change, so the display repaints the
  # scroll band on CHANGE only — it is the most expensive band by far.
  - id: scroll_gen
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ---- theme + repaint control ----
  - id: theme_light
    type: bool
    restore_value: false
    initial_value: 'false'

  # A chime is audio through `spk`, so it raises is_running() and advances
  # spk_frames exactly like speech does — which would make the fire claim SPEAKING
  # for a doorbell tone. This is the same class of bug as on_announce firing on_end
  # early (Revision 4), so it gets the same treatment: an explicit window during
  # which audio is known NOT to be speech. Set by the chime script; the display
  # lambda refuses to promote to SPEAKING while it is open.
  - id: chime_until
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ---- touch feedback: the struck coal ----
  # A capacitive panel gives no click, so a tap currently has no acknowledgement at
  # all. These two say WHERE and WHEN the tap landed, and the flame band renders it
  # as a coal being struck: a local flare at the touch's column plus a brief
  # quickening of the whole hearth, both decaying over 500ms.
  #
  # This costs ZERO extra redraw. The flame band is already the animated band, so
  # the spark is just another term in the column-height maths — no new band, no
  # scheduler change, no overlay. -1 = no spark.
  - id: spark_col
    type: int
    restore_value: false
    initial_value: '-1'

  - id: spark_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # When the horn (the intercom corner) was last pressed. The glyph brightens for
  # ~400ms after this — feedback comes from the thing you touched, same rule that
  # keeps overlay taps from striking coals. 0 = never.
  - id: ic_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ---- RAW touch coordinate, for the handedness question ----
  # The config has NO transform:/swap_xy/calibration block, so the controller's
  # orientation is UNKNOWN rather than known-and-adjusted, and `spark_col` assumes
  # both the sign (`tx / 4`) and the range (clamped at `tx > 239`). If X is mirrored
  # the wrong coal flares on every tap; if this rotation reports 0..319 the clamp is
  # wrong as well. Both are answered by reading two numbers off the screen.
  #
  # RAW, deliberately — post-clamp values cannot show a range violation, because the
  # clamp is the thing under suspicion.
  #
  # ⚠️ MEASURED 2026-07-31, JP's finger on the mounted unit (#13 closed on this datum):
  #
  #     LEFT-edge tap   raw x = 50
  #     RIGHT-edge tap  raw x = 195
  #
  # Left < right, so +X runs with the finger: NOT mirrored — `tx / 4` keeps its sign.
  # Both values inside 0..239, so this rotation reports a 240-wide axis and the
  # `tx > 239` clamp is guarding the right ceiling; the 0..319 worry is dead. The ~50 px
  # of unreachable margin at each end is the bezel window, not the controller — a finger
  # cannot reach the panel's true edge on a mounted unit, so these are the practical
  # extremes, and a flare at col 12 vs col 49 for these taps is exactly what shipped.
  # A future rotation/transform change re-opens BOTH questions: re-measure, don't infer.
  - id: touch_raw_x
    type: int16_t
    restore_value: false
    initial_value: '-1'

  - id: touch_raw_y
    type: int16_t
    restore_value: false
    initial_value: '-1'

  # ---- reply paging ----
  # Which page of an overflowing reply is showing, how many there are, and when the
  # current one was raised. scroll_pages is PUBLISHED BY paint_scroll (it is the only
  # place that knows the measured line count) and READ BY the scheduler, which arms the
  # page timer only when it is > 1. A reply that fits therefore costs exactly what it
  # did before: one repaint on change and nothing ongoing.
  - id: scroll_page
    type: int
    restore_value: false
    initial_value: '0'

  - id: scroll_pages
    type: int
    restore_value: false
    initial_value: '1'

  - id: scroll_page_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ⚠️ THE TWO LINES THAT USED TO OPEN THIS BLOCK ARE DELETED, AND THEY WERE NEVER
  # ABOUT amp_blank_ms_g. They read "Deadline for restoring the amp after a blank. 0 =
  # nothing pending … see amp_blank" and they described `amp_unblank_at`, which sat ~16
  # lines further down and is now deleted (#17). They were already misplaced BEFORE that
  # deletion — this is not damage the deletion did, it is a pre-existing misalignment the
  # deletion turned into an orphan — so a reader met a live WIDTH knob under two lines
  # calling it a DEADLINE that pointed at a script with no callers. Comments in this
  # block now sit on the global they describe; keep it that way.
  #
  # Runtime-adjustable blank width. A SUBSTITUTION forced one flash per datapoint,
  # and the open question here is a listening comparison (0 / 180 / 300ms) that only
  # JP's ear can settle — so the knob has to be turnable while listening.
  #
  # restore_value is deliberately FALSE on the number that drives this: 0 is a
  # diagnostic state, not a preference, and a persisted 0 would silently reinstate
  # the pop weeks later with no trace of why. Every boot starts at the safe default.
  # (This board already has one persisted-audio-state landmine: SpeakerMediaPlayer
  # persists is_muted and restores it at boot, so one stray volume_mute would come
  # back muted forever. Not repeating that shape.)
  - id: amp_blank_ms_g
    type: uint32_t
    restore_value: false
    initial_value: '${amp_blank_ms}'
  # Is the amp currently blanked? Tracked so the watchdog doesn't re-issue the same
  # GPIO write every 10ms.
  - id: amp_off
    type: bool
    restore_value: false
    initial_value: 'false'
  # Deferred re-mute deadline. 0 = nothing pending. See the mute branch in the 10ms
  # watchdog for why the mute is delayed rather than immediate. Carries the zero-sentinel
  # guard at its write site (`if (remute_at == 0) remute_at = 1;`) because millis() + 200
  # lands on 0 once every ~49.7 days of uptime and the pending mute would be dropped
  # silently. #17 recorded that `amp_unblank_at` lacked this guard; that global is now
  # deleted, so this is the only deadline of the shape left and it HAS it.
  - id: remute_at
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # True when the current speech was PUSHED by HA (assist_satellite.announce /
  # tts.speak) rather than being a reply to something we heard. Set in on_tts_start.
  # Did this conversation produce spoken audio? Set in on_tts_start, cleared in
  # on_start. Exists because on_end fires BEFORE the reply audio plays, so on_end
  # cannot ask the media_player — it has to remember. See the on_end guard.
  - id: had_tts
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: is_announce
    type: bool
    restore_value: false
    initial_value: 'false'

  # Requests one full-frame repaint (boot, theme flip, overlay dismiss).
  - id: force_full_repaint
    type: bool
    restore_value: false
    initial_value: 'true'

  # ---- modal overlay state ----
  # 0 = normal · 1 = volume · 2 = power menu
  #
  # WHY MODAL, AND WHY SUMMONED FROM HARDWARE: touch-to-talk is "tap anywhere",
  # which leaves no screen region free for controls. Rather than carve the screen
  # into zones (invisible, needs relearning, and a mis-tap silently does the wrong
  # thing), the controls live in a modal overlay opened by the ONE hardware button.
  # While ui_mode == 0 the touch gesture is exactly what it was; while an overlay
  # is up, touch addresses the overlay and talk is suspended. One boolean of state
  # instead of a gesture recogniser.
  # The reading-font rung: 0 small (15pt) / 1 medium (17pt) / 2 large (20pt),
  # set from the audio overlay's fourth row (actions 34/35). Restored across
  # reboots — a reading preference is exactly the kind of thing that must not
  # reset when the power blips. See the bodyf selector in the display lambda.
  - id: font_scale
    type: int
    restore_value: yes
    initial_value: '1'
  # The vision's caption ("sender · #channel"), stamped by the show_image
  # service before the fetch begins. Not restored: a rebooted hearth has no
  # image in PSRAM, so a restored caption would caption nothing.
  - id: vision_caption
    type: std::string
    restore_value: no
  - id: ui_mode
    type: uint8_t
    restore_value: false
    initial_value: '0'

  # Power-menu highlight, -1 = nothing selected.
  # Exists ONLY so the menu is fully operable from the button alone when the touch
  # controller is wedged — which is the entire reason the menu is on hardware.
  # Starts at -1 so a stray long-press dismisses rather than firing an action.
  - id: ui_sel
    type: int
    restore_value: false
    initial_value: '-1'

  # Bumped whenever the overlay's appearance changes, so it repaints ONE-SHOT on
  # change and is never animated.
  - id: ui_gen
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Last interaction, for auto-dismiss.
  - id: ui_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Hit-test result, handed from the on_touch lambda to the YAML actions below so
  # volume still goes through the documented number.* action path rather than a
  # second source of truth.
  # 0 none · 1 vol- · 2 vol+ · 3 talk · 4 dismiss · 5 hush · 6 bank · 7 rouse · 8 rekindle
  - id: ui_action
    type: uint8_t
    restore_value: false
    initial_value: '0'

  # "Bank the fire" turned the backlight off. Tracked explicitly rather than read
  # back off the light component so the wake path has no API assumption in it.
  - id: screen_banked
    type: bool
    restore_value: false
    initial_value: 'false'

  # ---- OPERATING MODE: ONE MONOTONIC CONTROL ----
  #
  #     0  Normal      speech YES   chimes YES
  #     1  No talking   speech no    chimes YES
  #     2  Hush         speech no    chimes no
  #
  # PROGRESSIVELY QUIETER AND NOTHING ELSE VARIES. Conversation works fully in all
  # three — tap to talk, STT, the LLM, the reply text paging on screen, the wyrm
  # animating through its speaking state. The ONLY difference is what leaves the
  # speaker. This is not a capability ladder, so nothing in the state machine or the
  # display may degrade as it rises.
  #
  # Monotonic ordering is load-bearing, not cosmetic: both predicates become threshold
  # tests over one number —
  #
  #     speech audible  ==  op_mode == 0
  #     chimes audible  ==  op_mode <  2
  #
  # which is why this is ONE 3-position control rather than two switches. Two switches
  # would expose a fourth state (chimes off, speech on) that is not wanted, and an
  # unwanted reachable state is a worse surface than a missing one.
  #
  # restore_value is TRUE, and the contrast with amp_blank_num (FALSE) is principled:
  # THE MODE IS A PREFERENCE, THE BLANK WIDTH IS A DIAGNOSTIC. A mode that silently
  # reverts after a 3am power blip is a fault; a persisted diagnostic 0 that reinstates
  # the pop weeks later with no trace of why is also a fault. Opposite defaults, one
  # rule.
  - id: op_mode
    type: uint8_t
    restore_value: true
    initial_value: '0'

  # The silence gate's verdict, re-derived from LIVE HARDWARE every 10ms tick.
  # Never persisted and never latched: a stuck value cannot survive one tick.
  - id: snd_block
    type: bool
    restore_value: false
    initial_value: 'false'

  # Last time the gate re-stated itself to the codec. Exists because the things that
  # clear REG31 do NOT update dac_muted, so the gate cannot trust its own bookkeeping
  # and must re-assert on a cadence instead. 0 = gate open.
  - id: gate_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # A pushed announcement landed while speech was muted, so the SCREEN was the only
  # delivery. Persists until the next touch, because an announcement nobody was in the
  # room for is otherwise indistinguishable from one that never arrived. This matters
  # most in Hush, where nothing audible happens at all.
  - id: unread
    type: bool
    restore_value: false
    initial_value: 'false'

########################  display + touch  ########################

display:
  - platform: mipi_spi
    id: lcd
    model: ILI9341
    spi_id: lcd_spi
    cs_pin: GPIO10
    dc_pin: GPIO46             # strapping pin; fine as a runtime output
    # CRITICAL: mipi_spi's base ILI9341 model declares NO data_rate, so it
    # falls back to the 10MHz default (mipi_spi/display.py default_data_rate).
    # At 10MHz a full 240x320x16bpp frame is 122.9ms of pure wire time, which
    # is what made frames take 141-152ms — NOT render overhead.
    # 40MHz is proven safe for this chip by ESPHome's own cyd.py model.
    data_rate: 40MHz
    # No reset_pin — LCD RST is bonded to CHIP_PU/EN on this board.
    invert_colors: true        # panel requires inversion
    dimensions:
      width: 240
      height: 320

    ####################################################################
    # COST MODEL, calibrated from the two hardware measurements.
    #
    #   full frame @10MHz = 141-152ms  (wire alone would be 122.9ms)
    #   full frame @40MHz =  55-65ms   (wire alone would be  30.7ms)
    #
    # Two measurements, two unknowns. Solving total = render + wire/rate:
    #   wire@40MHz ~= 28.6ms  (so the bus runs at ~93% of theoretical — good)
    #   render     ~= 31ms    (constant, and therefore the BIGGER half)
    #
    # That render half is why `data_rate` alone couldn't fix this: it is CPU +
    # PSRAM time in draw_pixel_at, not transfer. Both halves scale with the
    # number of ROWS touched, which is exactly what the banded design below
    # reduces. Per row at 40MHz: ~0.089ms wire + render proportional to how
    # many pixels the band actually writes.
    #
    # PARTIAL REDRAW — how it works and why it is safe:
    #   mipi_spi maintains a dirty bounding box: draw_pixel_at() expands
    #   x_low_/y_low_/x_high_/y_high_ (mipi_spi.h:623-634) and update()
    #   flushes ONLY that box before resetting it (mipi_spi.h:573-591).
    #
    # auto_clear_enabled MUST be false. Its default is CONF_UNSPECIFIED, which
    # resolves to `CONF_LAMBDA in config` (display/__init__.py:132-137) => TRUE
    # for this config. That calls clear() -> fill(BLACK) -> dirties every pixel
    # BEFORE the lambda runs, forcing a full flush on every single frame. It is
    # what made the previous full-frame repaint mandatory rather than chosen.
    #
    # Frames where no band is due touch nothing at all: the box stays empty and
    # update() skips the flush entirely (mipi_spi.h:573,
    # `if (x_low_ > x_high_ || y_low_ > y_high_) continue;`). Idle frames cost
    # ZERO bytes on the wire and near-zero CPU.
    #
    # Bands are FULL WIDTH deliberately: that makes stride == w in
    # write_display_data_ (mipi_spi.h:390-399), so the whole band goes out as
    # ONE write_array instead of one SPI transaction per row.
    #
    # >>> DO NOT set `buffer_size:`. psram: octal is configured and no explicit
    #     size is given, so denominator() returns FRACTION=1 and the lambda is
    #     called exactly ONCE per update. A fractional buffer would call it once
    #     per horizontal slice, and the static band scheduler below would be
    #     stepped N times per frame — silently wrong timing, not a clean fail.
    ####################################################################
    auto_clear_enabled: false
    # 50ms = the fastest band's tick. At most ONE band paints per frame, so the
    # dirty box never spans two bands.
    # >>> If audio hiccups during a conversation, the knobs in preference
    #     order are: FLAM_H 76->60, then the flame tick 50->70ms. Raise this
    #     interval last.
    #
    #     DO NOT TOUCH NC OR CW. This line used to recommend "NC 60->40 with
    #     CW 4->6" as the third knob. Both halves are wrong: CW does nothing
    #     (the column index hardcodes it) and NC=40 makes the band render from
    #     uninitialised stack while the harness still passes. NC>60 is worse —
    #     an out-of-bounds WRITE, unprotected on this device. Both are now
    #     static_asserts at their declaration; read the note there. <<<
    update_interval: 50ms

    lambda: |-
      // ================= band geometry =================
      // Bands tile 0..319 exactly, and every boundary is a multiple of 4 so the
      // design is immune to whatever draw_rounding the model declares (mipi_spi
      // rounds the dirty box out to ROUNDING before flushing, mipi_spi.h:578-581).
      //
      //            y     h     wire@40MHz
      const int W       = it.get_width();
      const int SIGIL_Y =   0, SIGIL_H =  32;   //  2.9 ms
      const int SCRL_Y  =  32, SCRL_H  = 156;   // 14.0 ms
      const int FLAM_Y  = 188, FLAM_H  =  76;   //  6.8 ms   <- the animated band
      const int TELE_Y  = 264, TELE_H  =  56;   //  5.0 ms
      // The progress fuse deliberately lives in the TOP 4 ROWS OF THE FLAME BAND
      // rather than in a band of its own. It used to have one, and the host
      // harness showed why that was wrong: a 4-row repaint still consumes a whole
      // frame slot, so at a 200ms fuse tick the fire only got 260 of 400 slots
      // (~13fps instead of ~18). Folding it into the flame band costs nothing
      // extra, repaints it at the fire's rate, and reads better anyway — the fire
      // is burning along the fuse.
      const int FUSE_H  = 4;
      const uint32_t now = millis();

      // ================= palette: one fire-temperature ramp =================
      // Every state is a rung on ember->amber->gold->white-hot. The ONLY colour
      // off the ramp is `alarm`, because error means the fire went out.
      // The ramp is monotonic in luminance as well as hue, so the states stay
      // distinguishable to a red-green colour blind viewer — and every state is
      // ALSO carried by the sigil word and by its motion signature, never by
      // colour alone.
      Color c_bg, c_ink, c_dim, c_ash, c_bed, c_ember, c_amber, c_gold, c_tip, c_alarm;
      if (id(theme_light)) {
        c_bg    = Color(0xF2, 0xE8, 0xDA);   // parchment
        c_ink   = Color(0x2A, 0x1C, 0x12);
        c_dim   = Color(0x8A, 0x76, 0x62);
        c_ash   = Color(0xD8, 0xCA, 0xB8);
        c_bed   = Color(0x8C, 0x2E, 0x0A);
        c_ember = Color(0xB8, 0x3A, 0x0C);
        c_amber = Color(0xE0, 0x6A, 0x10);
        c_gold  = Color(0xF0, 0xA8, 0x20);
        c_tip   = Color(0xFF, 0xE0, 0x90);
        c_alarm = Color(0xA8, 0x14, 0x10);
      } else {
        c_bg    = Color(0x0A, 0x06, 0x04);   // warm near-black: cold hearth stone
        c_ink   = Color(0xF2, 0xDC, 0xB8);
        c_dim   = Color(0x6A, 0x52, 0x40);
        c_ash   = Color(0x3A, 0x32, 0x2C);
        c_bed   = Color(0x4A, 0x10, 0x02);   // the darkest coal
        c_ember = Color(0x8E, 0x22, 0x06);
        c_amber = Color(0xE0, 0x5A, 0x08);
        c_gold  = Color(0xFF, 0xA8, 0x1E);
        c_tip   = Color(0xFF, 0xE8, 0xB4);   // white-hot
        c_alarm = Color(0xFF, 0x3C, 0x18);
      }

      // ================= the audio clock, and the state derived FROM it =========
      // Read spk_frames ONCE per frame into a plain local; everything downstream
      // uses the local, so the whole frame is internally consistent.
      const uint32_t frames = id(spk_frames);
      static uint32_t last_frames = 0;
      static uint32_t last_change_ms = 0;
      if (frames != last_frames) { last_frames = frames; last_change_ms = now; }
      const uint32_t since_frames = now - last_change_ms;

      // >>> SPEAKING IS DERIVED, NOT TRIGGERED. <<<
      // Losing `speaker:` on voice_assistant (the price of announce) removed
      // on_tts_stream_start. This replaces it with the speaker's own state, which
      // is the same source of truth the fire's phase already uses — and it is
      // strictly better, because a pushed announcement fires NO stream trigger and
      // in fact reports va_state == 0 the whole time it is talking.
      //
      // The 1200ms ceiling matters: the i2s speaker can linger in is_running()
      // briefly after the last frame while it tears down. Without the ceiling the
      // fire would sit in `guttering` (ash, "BUFFER STALL") after every normal
      // utterance, which would read as an error. With it: 0-300ms normal fire,
      // 300-1200ms guttering (a real stall is visible), >1200ms playback is over.
      const bool audio_live = id(spk)->is_running() && since_frames < 1200u;
      const bool guttering  = audio_live && since_frames > ${stall_ms}u;

      // A chime is audio too, so audio_live alone would make the fire flare for a
      // doorbell tone. `chime_until` is the window during which the audio coming out
      // is known not to be speech. The announce herald deliberately does NOT set it,
      // because there it IS the leading edge of speech.
      const bool chiming = (int32_t) (id(chime_until) - now) > 0;

      // ---- touch spark envelope ----
      // Computed here, not inside paint_flame, because the SCHEDULER needs it too:
      // in IDLE the flame band only ticks every 200ms, which would sample a 500ms
      // spark two or three times and look like a stutter rather than a flare. While
      // a spark is live the band goes to 50ms — 10 frames, ~90ms of main loop over
      // half a second, and only when you actually touch the thing.
      // t*t gives a fast attack and softer settle: struck, not faded.
      float spark_k = 0.0f;
      if (id(spark_col) >= 0) {
        const uint32_t age = now - id(spark_ms);
        if (age < ${spark_ms_len}u) {
          const float t = 1.0f - (float) age / ${spark_ms_len}.0f;
          spark_k = t * t;
        }
      }
      const bool spark_live = spark_k > 0.0f;

      // ---- wyrm animation smoothers ----
      // These live HERE rather than with the scheduler statics further down for a
      // hard reason: paint_flame reads them, and a lambda body cannot name a
      // variable declared after it. They are only stepped on frames where the
      // flame band actually paints, which is what makes waking from IDLE (200ms
      // tick) slow and alerting mid-conversation (50ms tick) quick, for free.
      static float wake_s = 0.0f;   // 0 asleep .. 1 alert, one-pole smoothed
      static float lvl_s  = 0.0f;   // smoothed mic level: the head leans in on it

      int st = id(va_state);
      if (audio_live && !chiming && (st == 0 || st == 2)) st = 3;   // -> SPEAKING

      // ---- the mode's one visual consequence ----
      // NO NEW `st` VALUE, deliberately. An earlier draft added st == 5 for "speaking
      // but silenced" and it forced edits at ~10 call sites (accent, LED, fire height,
      // swallow, fuse, telemetry, the eye, the scheduler's idle rate), every one an
      // opportunity to miss one. A single boolean instead modifies only the places
      // where AUDIBILITY is the subject, and everything keyed on `st == 3` inherits
      // correct behaviour for free. That is right, not merely cheap: the fire, the
      // fuse and the swallow are grounded in audio that genuinely IS streaming, just
      // inaudibly — and the spec requires that nothing else degrade.
      const bool silenced = (st == 3) && id(op_mode) >= 1;

      // Snapshot the frame counter on the rising edge of playback — this is what
      // on_tts_stream_start used to do. Main loop only, so no cross-task concern.
      static bool was_live = false;
      if (audio_live && !was_live) id(spk_frames_mark) = frames;
      was_live = audio_live;

      // ================= the LED: one authority, shared with the fire =============
      // The WS2812 is the hearth's glow spilling out of the box, so it is driven from
      // the SAME derived `st` the flame band uses. Not a parallel state machine that
      // agrees by convention — literally the same variable, so the light and the
      // screen cannot disagree. A user reads whichever one they happen to be looking
      // at, so same-source-of-truth is the property worth protecting.
      //
      // WHY THIS REPLACED THE TRIGGERS RATHER THAN JOINING THEM.
      //   The LED used to be written by four voice_assistant triggers. Two writers
      //   would have needed an ownership handoff and would still drift. This is the
      //   shape that worked for volume: make one thing the authority and DELETE the
      //   competitor. All four `light.turn_on` actions are gone from voice_assistant.
      //   >>> Do not add a light.turn_on back to any trigger. It would not merely be
      //       redundant, it would fight this on every transition. <<<
      //
      // WHAT THIS FIXES, and it was worse than I had been reporting:
      //   Removing on_tts_stream_start in Revision 4 (forbidden once we took
      //   media_player for announce) silently deleted the LED's SPEAKING rung. The
      //   light went gold at THINKING and stayed gold through the entire spoken
      //   reply, then banked. Driving it from `st` restores white-hot — and gets the
      //   announcement case for free, because `st` is derived from the speaker rather
      //   than from a trigger that fires before the audio.
      //
      // COST: edge-triggered, so this is ~1 RMT write per state transition, not one
      // per frame. `led_shown` is a static local, main-loop only, no cross-task
      // concern, and it is re-derived from `st` every frame so it cannot get stuck.
      {
        // ⚠️ THE HUSH-GOES-DARK BEHAVIOUR IS DELETED, AND THAT IS A CORRECTNESS FIX,
        // not a simplification.
        //
        // It read `led_want = (st == 0 && sw_hush) ? -1 : st`, justified on privacy:
        // "a hushed device that looks identical to a listening one is the failure
        // worth avoiding, so the hearth goes DARK". That reasoning was sound for the
        // OLD meaning of hush, which blocked the conversation outright.
        //
        // Under the three-mode spec hush does NOT mean "I am not listening" — Ember
        // listens and converses in all three modes. A dark hearth would now assert
        // something FALSE about the microphone, which is worse than being
        // uninformative: it is exactly the class of lie this file's grounding rule
        // exists to prevent. The old telemetry line said "hushed - ember isn't
        // listening", which would also have become untrue; it is rewritten below.
        //
        // So the LED keeps carrying `st` and nothing else, and the mode rides on
        // BRIGHTNESS instead.
        const int led_want = st;
        static int led_shown = -99;
        static uint8_t led_mode = 0xFFu;
        // The modes are monotonic — progressively quieter — so the glow is monotonic
        // too: the hearth banks down as the device gets quieter. That is legible across
        // a room, and it does NOT give the LED a second meaning that could disagree
        // with the first: hue and effect still mean state, exactly as before, and the
        // mode only scales them. Same "one authority, shared with the fire" property
        // the note above claims.
        const float mode_k = (id(op_mode) == 0) ? 1.00f
                           : (id(op_mode) == 1) ? 0.65f : 0.35f;
        if (led_want != led_shown || id(op_mode) != led_mode) {
          led_shown = led_want;
          led_mode = id(op_mode);
          {
            auto c = id(status_led)->turn_on();
            // Idle fades in slowly (the fire settling); everything else snaps, because
            // a state change you had to wait for reads as lag.
            c.set_transition_length(led_want == 0 ? 800u : 120u);
            switch (led_want) {
              case 1:  // LISTENING - amber, rung 1
                c.set_rgb(1.00f, 0.40f, 0.04f); c.set_brightness(mode_k);
                c.set_effect("none"); break;
              case 2:  // THINKING - gold, rung 2, pulsing
                c.set_rgb(1.00f, 0.66f, 0.12f); c.set_brightness(mode_k);
                c.set_effect("crucible"); break;
              case 3:  // SPEAKING - white-hot, rung 3. Restored; see above.
                c.set_rgb(1.00f, 0.91f, 0.70f); c.set_brightness(mode_k);
                c.set_effect("none"); break;
              // ERROR does NOT dim. An error must be recognisable before it is
              // consistent, which is the same reason it is the one colour off the
              // fire ramp — and a quiet mode is exactly when you are relying on the
              // screen and the LED rather than on a chime you switched off.
              case 4:  // ERROR - the one colour off the ramp
                c.set_rgb(1.00f, 0.12f, 0.05f); c.set_brightness(1.00f);
                c.set_effect("none"); break;
              default:  // IDLE - banked coals, still breathing
                c.set_rgb(1.00f, 0.14f, 0.02f); c.set_brightness(0.20f * mode_k);
                c.set_effect("bank"); break;
            }
            c.perform();
          }
        }
      }

      // The reading font (2026-08-09, JP: "make the font a bit bigger", then
      // "font size should be configurable in the volume menu too"). Fonts are
      // compiled bitmaps, so configurable = three baked Roboto sizes and this
      // selector; body_pitch rides along or the sizes would collide on the
      // line below. Scope is READING text — Ember's reply and the chronicle
      // detail's playback. Chrome keeps fixed fonts so no band layout ever
      // depends on a runtime value.
      font::Font *bodyf = (id(font_scale) <= 0) ? id(font_body_s)
                        : (id(font_scale) >= 2) ? id(font_body_l)
                                                : id(font_body);
      const int body_pitch = (id(font_scale) <= 0) ? 18
                           : (id(font_scale) >= 2) ? 24 : 21;

      Color accent = c_ember;
      switch (st) {
        case 1: accent = c_amber; break;
        case 2: accent = c_gold;  break;
        case 3: accent = c_tip;   break;
        case 4: accent = c_alarm; break;
      }

      // ---- elapsed playback, RATE-AGNOSTIC ----
      // This used to be `frames / 16u`, hardcoding 16kHz. That is now a latent trap:
      // the media_player pipeline calls speaker_->set_audio_stream_info() with
      // whatever the decoder produced (audio_pipeline.cpp:474), so the speaker's
      // rate is not a constant any more. At 48kHz the old maths would have run the
      // fire 3x fast and slammed the fuse to 97% instantly.
      //
      // We pin sample_rate: 16000 on the announcement pipeline so HA transcodes to
      // match the es8311, which makes this agree with the old constant in practice —
      // but asking the speaker is free and removes the trap rather than documenting it.
      // Wrap-safe subtraction; uint32 microseconds is good for ~71 min of one
      // utterance, and this is per-utterance.
      const uint32_t spoken_ms =
          id(spk)->get_audio_stream_info().frames_to_microseconds(
              frames - id(spk_frames_mark)) / 1000u;

      float prog = 0.0f;
      if (id(tts_est_ms) > 0) {
        prog = (float) spoken_ms / (float) id(tts_est_ms);
        if (prog > 0.97f) prog = 0.97f;   // never claim done before tts_stream_end
      }

      // >>> THE GROUNDING: the animation phase advances on frames PLAYED, not on
      //     millis(). One full spatial cycle per ${flame_cycle_ms} ms of real
      //     audio. If the stream stalls, the fire stops. The shape is synthetic;
      //     the clock is not, so the screen cannot lie about whether sound is
      //     actually coming out. <<<
      const float ph = (float) spoken_ms * (6.28318f / ${flame_cycle_ms}.0f);

      auto db_to_frac = [&](float db) {
        float f = (db - ${db_floor}f) / (${db_ceil}f - ${db_floor}f);
        return f < 0.0f ? 0.0f : (f > 1.0f ? 1.0f : f);
      };

      // ================= text helper =================
      // Word-wrap on a character budget. O(n) and good enough: this runs only
      // when the text changes (a few times per conversation), never per frame.
      // ---- MEASURED word-wrap, and the reason text was being truncated ----
      // This used to wrap on a CHARACTER BUDGET (cpl_body: 30 / cpl_sm: 38) estimated
      // from Roboto's average advance. I flagged those as unmeasured from the start,
      // and they are the truncation JP is seeing: an average advance under-counts any
      // line with wide glyphs, so real lines overran the band and were clipped at the
      // right edge. Guessing a width when the renderer will tell you the answer was
      // the mistake.
      //
      // it.get_text_bounds() (display.h:689) measures the actual rendered width, so
      // this now wraps on PIXELS. O(words) measurements, and it only runs when the
      // text changes — a few times per conversation, never per frame.
      //
      // Returns the TOTAL number of lines the text needs, which is what lets the
      // caller detect overflow and page instead of silently dropping the rest. Draws
      // only lines [first, first + max_lines).
      //
      // Known limit, deliberately not handled: a single word wider than the band is
      // not hard-broken, so it will overrun. For speech that means a pathological URL;
      // splitting mid-word would cost a second measurement pass for a case Ember's
      // persona does not produce.
      auto wrap = [&](int x, int y, auto *fnt, Color col, const std::string &s,
                      int maxw, int lh, int max_lines, int first) -> int {
        int total = 0, drawn = 0;
        std::string line;
        auto flush = [&]() {
          if (total >= first && drawn < max_lines) {
            it.print(x, y + drawn * lh, fnt, col, line.c_str());
            drawn++;
          }
          total++;
          line.clear();
        };
        size_t i = 0;
        while (true) {
          size_t sp = s.find(' ', i);
          size_t end = (sp == std::string::npos) ? s.size() : sp;
          if (end > i) {
            std::string w = s.substr(i, end - i);
            std::string cand = line.empty() ? w : line + " " + w;
            int bx, by, bw, bh;
            it.get_text_bounds(0, 0, cand.c_str(), fnt,
                               display::TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
            if (bw > maxw && !line.empty()) {
              flush();
              line = w;
            } else {
              line = cand;
            }
          }
          if (end == s.size()) break;
          i = end + 1;
        }
        if (!line.empty()) flush();
        return total;
      };

      // ================= band painters =================
      // Each painter erases its OWN band first. That is what keeps the dirty box
      // band-sized now that auto_clear is off. NOTHING may draw outside its band.

      auto paint_sigil = [&]() {
        it.filled_rectangle(0, SIGIL_Y, W, SIGIL_H, c_bg);
        // While a modal overlay is up the header names the overlay, not the
        // conversation state — the overlay is what the touchscreen now addresses,
        // so it has to be what the header says.
        if (id(ui_mode) != 0) {
          const char *t = (id(ui_mode) == 1) ? "AUDIO" : "POWER";
          it.filled_circle(13, SIGIL_Y + 13, 5, c_gold);
          it.print(28, SIGIL_Y + 3, id(font_hdr), c_gold, t);
          it.print(W - 6, SIGIL_Y + 9, id(font_sm), c_dim,
                   display::TextAlign::TOP_RIGHT, "BOOT: tap=next  hold=pick");
          it.filled_rectangle(0, SIGIL_Y + 28, W, 3, c_gold);
          return;
        }
        const char *name; const char *sub;
        switch (st) {
          case 1:  name = "LISTENING"; sub = "speak - i'm here";                     break;
          case 2:  name = "THINKING";  sub = "turning it over";                      break;
          // A muted reply must not claim SPEAKING. The grounding rule here is that the
          // screen cannot lie about whether sound is coming out, and a muted playback
          // would make SPEAKING a lie about audibility. UNSPOKEN is plain English for
          // exactly this and — unlike "SILENCED" — cannot be mistaken for a fault.
          case 3:  name = silenced ? "UNSPOKEN" : "SPEAKING";
                   sub  = silenced ? "the reply is on screen" : "";                  break;
          // The WORD stays "ERROR" — an error must be recognisable before it is
          // charming. The metaphor lives in the sub-line.
          case 4:  name = "ERROR";     sub = "the fire guttered - touch to rekindle"; break;
          default: name = "EMBER";     sub = "banked - touch to wake";               break;
        }
        // At idle the sub-line names the mode, because in a quiet mode "touch to wake"
        // is true but incomplete — what a tap will DO is unchanged, what it will SOUND
        // like is not.
        if (st == 0 && id(op_mode) != 0) {
          sub = (id(op_mode) == 1) ? "no talking - replies on screen"
                                   : "hush - silent, replies on screen";
        }

        // ---- THE MODE CHIP: the object's motif, doing work ----
        // The hexagon is this object's motif at three physical scales already (a
        // 6.50mm honeycomb speaker grille, a 3.2mm hex field, ~16mm hex thumb
        // buttons). Here it is the fourth, and it is not decoration: the FILL LEVEL is
        // the mode, read as a fuel gauge, which is the natural shape for a MONOTONIC
        // control —
        //
        //     Normal  full        No talking  half        Hush  empty outline
        //
        // Fill level is a shape-and-luminance difference rather than a hue, so it
        // survives distance AND stays readable to a red-green colour blind viewer,
        // which is the rule the palette already follows. It fills from the BOTTOM
        // because a gauge draining downward is the one reading nobody has to be
        // taught.
        //
        // Cost: this band is erased and rewritten wholesale and repaints ON CHANGE
        // ONLY, so this is ~14 horizontal_line calls where the circle was ~10. It is
        // NOT in the flame band, so the write-once tiling invariant and the 18,240
        // px/frame figure are untouched. (Confirmed by luna: check_tiling is
        // band-scoped to the flame band, and paint_sigil already overdraws its own
        // erase.)
        {
          // ---- FLAT-TOP, and the orientation is structural rather than styling ----
          //
          // ⚠️ An earlier revision of this block said POINTY-top "matching the physical
          // hex caps". That was wrong about the caps, and it is corrected here rather
          // than quietly changed, because a wrong reason is what licenses a wrong
          // change later.
          //
          // The case carries BOTH orientations on purpose:
          //   FIELDS (stand grille, back panel) are POINTY-top — RegularPolygon(R, 6,
          //     rotation=30), which is the honeycomb lattice pitch.
          //   CAPS are FLAT-top — RegularPolygon(R, 6), rotated 30 degrees OUT of the
          //     lattice, because the pad is a LIVING HINGE that must stay attached
          //     along its +Y edge. A pointy-top hex has a VERTEX at +Y, and hinging on
          //     a point is a tear, not a hinge. Flat-top puts a full edge there.
          //
          // So the rule is not one orientation for the object — it is MATCH WHAT THE
          // ELEMENT REPRESENTS. This chip stands for the physical button beneath it, so
          // it is FLAT-top like the cap. The volume overlay's hearth stones are a FIELD
          // of hexes and should be POINTY-top like the grille.
          //
          // Geometry: R is the circumradius, so point-to-point is the HORIZONTAL extent
          // (2R, 15px here) and across-flats is the VERTICAL one (sqrt(3)*R, ~13px) —
          // transposed from the pointy-top form. Half-width tapers as R - |dy|/sqrt(3),
          // which is what produces the flat top and bottom edges.
          //
          // Sized for legibility at 240px rather than proportionally to the cap,
          // deliberately: the shipped caps are 9.01mm and 6.58mm across flats and may
          // still grow, so a proportional chip would need revisiting and this will not.
          const int cx = 13, cy = SIGIL_Y + 13, R = 7;
          const int H = (R * 866) / 1000;              // sqrt(3)/2 * R — vertical half
          for (int dy = -H; dy <= H; dy++) {
            const int a = (dy < 0 ? -dy : dy);
            const int hw = R - (a * 1000) / 1732;      // R - |dy| / sqrt(3)
            if (hw <= 0) continue;
            const bool filled = (id(op_mode) == 0) ||
                                (id(op_mode) == 1 && dy >= 0);
            if (filled) {
              it.horizontal_line(cx - hw, cy + dy, hw * 2 + 1, accent);
            } else if (a >= R - 1 || hw <= 2) {
              it.horizontal_line(cx - hw, cy + dy, hw * 2 + 1, c_dim);
            } else {
              it.draw_pixel_at(cx - hw, cy + dy, c_dim);
              it.draw_pixel_at(cx + hw, cy + dy, c_dim);
            }
          }
          if (st == 1 || st == 3) it.circle(cx, cy, 10, c_dim);   // halo when live
          // Unread: a pushed announcement arrived while speech was muted, so the
          // screen was the only delivery. Survives being missed; cleared by any touch.
          // On a battery build the candle owns the right edge, so the dot steps left
          // of it — compile-time folded, the desk keeps W-8 exactly.
          if (id(unread)) it.filled_circle(${has_battery} ? W - 22 : W - 8,
                                           SIGIL_Y + 8, 3, c_gold);
        }
        it.print(28, SIGIL_Y + 3, id(font_hdr), accent, name);
        // Right-aligned rather than measured off the name's width: no strlen, no
        // font metrics, and name-left / status-right is the better composition.
        // (Right anchor steps left of the candle on a battery build.)
        if (sub[0] != '\0') {
          it.print(${has_battery} ? W - 20 : W - 6, SIGIL_Y + 9, id(font_sm), c_dim,
                   display::TextAlign::TOP_RIGHT, sub);
        }

        // ---- THE CANDLE: the cell, read as wax (mobile builds only) ----
        //
        // `${has_battery}` is a literal 0 on the desk build, so this whole block
        // folds away there — which is not an optimisation but the CORRECTNESS
        // property: the desk's GPIO9 floats and its "voltage" is noise, so the only
        // honest desk candle is no candle.
        //
        // Reads bottom-up like every gauge here (the mode chip fills from the
        // bottom for the same reason): wax = charge. Five findable states beyond
        // the level — flame steady (healthy), flame guttering + stub (low: the
        // chime has already rung once), bare alarm spark (critical: HA is speaking
        // for it by now), motes climbing the candle's side (charging: filling
        // drawn as arrival), and the DISH GLOWING GOLD (on the charger — filling
        // or sated; gold dish + tall white flame + no motes is "plugged in at
        // 100%", JP's exact question 2026-08-10) — plus the cold wick for "no
        // sample yet", because unknown and empty must never share a glyph. State
        // is carried by SHAPE AND MOTION (lean, flicker, height, climb, and the
        // bolt), never colour alone, per the band's standing accessibility rule —
        // the gold dish briefly carried "sated" on colour alone; the bolt
        // (2026-08-10, same day) restored the rule.
        //
        // Fits y 2..27: wax max 14 tall on a +26 baseline, flame up to 6 above the
        // wick, top at +6 — clear of the band's own top and of the +28 rule.
        if (${has_battery}) {
          const int soc  = id(batt_soc);
          const int ccx  = W - 10;                       // candle centreline
          // The dish: gold whenever the hearth feeds it (filling or sated),
          // dim on the cell's own wax.
          it.horizontal_line(W - 16, SIGIL_Y + 27, 12,
                             (id(batt_chg) || id(batt_sated)) ? c_gold : c_dim);
          if (soc < 0) {
            // No sample yet: a cold wick and nothing else — no wax claim at all.
            it.filled_rectangle(ccx, SIGIL_Y + 21, 1, 6, c_dim);
          } else {
            const bool low  = soc <= ${batt_low_pct};
            const bool crit = soc <= ${batt_crit_pct};
            const bool rich = id(batt_v_filt) >= 3.98f;  // a rich cell: full, or
                                                         // riding the charger's
                                                         // voltage. batt_chg (the
                                                         // trend detector in the
                                                         // ladder) is what says
                                                         // FILLING — the CHRG pin
                                                         // isn't wired, so both
                                                         // claims come from the
                                                         // voltage, each honestly
            const int wax = (soc * 14 + 50) / 100;       // 0..14 px
            const int top = SIGIL_Y + 26 - wax;          // top of wax / wick base
            if (wax > 0) {
              it.filled_rectangle(ccx - 3, top, 7, wax, c_dim);
              // A lit rim on the wax top face — reads as molten edge, and gives
              // the column a crisp end so height is legible at a glance.
              it.horizontal_line(ccx - 3, top, 7, c_ash);
            }
            it.filled_rectangle(ccx, top - 2, 1, 2, c_ink);      // the wick
            if (crit) {
              // Bare spark, alarm-coloured, blinking on the gutter tick: the last
              // visual state before the cell is beyond the display's help.
              if ((now / 600u) % 2u == 0u)
                it.filled_rectangle(ccx - 1, top - 4, 3, 2, c_alarm);
            } else if (low) {
              // Guttering: a small flame that leans on alternate ticks. The 600ms
              // cadence is set by the scheduler's candle tick below — this just
              // reads the clock so paint and tick can never disagree.
              const int lean = ((now / 600u) % 2u) ? 1 : -1;
              it.filled_rectangle(ccx - 1 + lean, top - 5, 3, 3, c_amber);
              it.draw_pixel_at(ccx + lean, top - 6, c_gold);
            } else {
              // Steady: teardrop, taller and white-tipped when the cell is rich.
              const int fh = rich ? 4 : 3;
              it.filled_rectangle(ccx - 1, top - 2 - fh, 3, fh, c_amber);
              it.draw_pixel_at(ccx, top - 3 - fh, rich ? c_tip : c_gold);
            }
            if (id(batt_chg)) {
              // Charging: motes of light climbing the candle's left side into
              // the wax — filling drawn as arrival (2026-08-10, JP: "make the
              // candle also indicate when it's charging"). Three motes, five
              // rows apart, on the same 600ms clock the gutter lean reads, so
              // paint and tick can never disagree; the scheduler ticks the
              // band while charging so they actually climb. x is ccx-6 —
              // clear of the wax (ccx-3) and of the unread dot (W-22).
              const int ph3 = (int) ((now / 600u) % 15u);
              for (int m = 0; m < 3; m++) {
                const int my = SIGIL_Y + 25 - ((ph3 + m * 5) % 15);
                it.draw_pixel_at(ccx - 6, my, (m == 1) ? c_amber : c_gold);
              }
            }
            if (id(batt_chg) || id(batt_sated)) {
              // The bolt (2026-08-10, JP: "we should also have the lightning
              // bolt symbol for when it's plugged in") — the phone-battery
              // idiom, a 4x6 zigzag ON the wax. Shape, not colour: the gold
              // dish alone bent the band's accessibility rule, the bolt
              // squares it. Same condition as the dish — both mean "the
              // hearth feeds it", which is as close to "plugged in" as an
              // unwired CHRG pin lets firmware honestly claim.
              const int bx2 = ccx - 2, by2 = SIGIL_Y + 18;
              it.horizontal_line(bx2 + 2, by2 + 0, 2, c_tip);
              it.horizontal_line(bx2 + 1, by2 + 1, 2, c_tip);
              it.horizontal_line(bx2 + 0, by2 + 2, 4, c_tip);
              it.horizontal_line(bx2 + 2, by2 + 3, 2, c_tip);
              it.horizontal_line(bx2 + 1, by2 + 4, 2, c_tip);
              it.horizontal_line(bx2 + 0, by2 + 5, 2, c_tip);
            }
          }
        }

        // The state's temperature as a rule under the header.
        it.filled_rectangle(0, SIGIL_Y + 28, W, 3, accent);
      };

      auto paint_scroll = [&]() {
        const int MAXW = W - 12;
        const int SAID_LINES = ${said_lines};
        it.filled_rectangle(0, SCRL_Y, W, SCRL_H, c_bg);
        // ---- the tome — the chronicle's door, drawn (2026-08-09) ----
        // Retired at noon, back by nightfall: the morning's diagnosis (zone
        // under the bezel lip, taps falling through to talk) briefly moved the
        // door to the wyrm, until JP's correction: the wyrm's aura is the
        // WAKING, "but the chronicle button be more magical and work". It
        // works now because talk no longer claims the rest of the screen —
        // the zone in on_touch is 80x56 and collides with nothing. Drawn
        // AFTER the band erase and BEFORE the text so a long heard-line
        // slides under it rather than through it.
        {
          // An open tome, 30x26, spread pages with script, a gold clasp — and
          // more magic than its first printing: a crown of drifting motes on
          // both shoulders, a gold rune lighting the left page, and a c_tip
          // star risen off the spine. Still all primitives; the scroll band is
          // chrome (erase + overdraw, outside the flame invariants), so the
          // enchantment costs ~20 one-shot runs on a band that repaints rarely.
          const int bx = 204, by = SCRL_Y + 4;
          // covers: two leaves with a raised rim
          it.filled_rectangle(bx, by + 4, 14, 22, c_bed);
          it.filled_rectangle(bx + 16, by + 4, 14, 22, c_bed);
          it.horizontal_line(bx, by + 3, 14, c_ember);
          it.horizontal_line(bx + 16, by + 3, 14, c_ember);
          // page blocks, inset, with a soft outer step (page depth)
          it.filled_rectangle(bx + 2, by + 6, 11, 18, c_bg);
          it.filled_rectangle(bx + 17, by + 6, 11, 18, c_bg);
          it.filled_rectangle(bx + 3, by + 7, 9, 16, c_ash);
          it.filled_rectangle(bx + 18, by + 7, 9, 16, c_ash);
          it.filled_rectangle(bx + 4, by + 8, 7, 14, c_bg);
          it.filled_rectangle(bx + 19, by + 8, 7, 14, c_bg);
          // the spine valley
          it.filled_rectangle(bx + 14, by + 4, 2, 22, c_bed);
          // the rune: an illuminated capital on the left page, 3x4 of gold
          // with a c_tip heart — the page is LIT, not merely inked
          it.filled_rectangle(bx + 5, by + 9, 3, 4, c_gold);
          it.draw_pixel_at(bx + 6, by + 10, c_tip);
          // script: lines per page, the top ones gold — illuminated firsts
          it.horizontal_line(bx + 9, by + 11, 2, c_gold);
          it.horizontal_line(bx + 20, by + 11, 5, c_gold);
          it.horizontal_line(bx + 5, by + 15, 5, c_dim);
          it.horizontal_line(bx + 20, by + 15, 5, c_dim);
          it.horizontal_line(bx + 5, by + 19, 4, c_dim);
          it.horizontal_line(bx + 20, by + 19, 4, c_dim);
          // the clasp, with a glint
          it.filled_rectangle(bx + 29, by + 12, 3, 6, c_gold);
          it.draw_pixel_at(bx + 30, by + 13, c_tip);
          // the star off the spine: a 5px c_tip cross, the reader's candle
          it.draw_pixel_at(bx + 15, by - 4, c_tip);
          it.draw_pixel_at(bx + 14, by - 3, c_tip);
          it.draw_pixel_at(bx + 16, by - 3, c_tip);
          it.draw_pixel_at(bx + 15, by - 2, c_tip);
          // motes drifting off BOTH shoulders now, rising as they thin
          it.draw_pixel_at(bx + 26, by - 1, c_gold);
          it.draw_pixel_at(bx + 30, by + 1, c_tip);
          it.draw_pixel_at(bx + 33, by - 3, c_gold);
          it.draw_pixel_at(bx + 29, by - 5, c_amber);
          it.draw_pixel_at(bx + 35, by + 2, c_tip);
          it.filled_circle(bx + 31, by - 1, 1, c_amber);
          it.draw_pixel_at(bx + 3, by - 1, c_amber);
          it.draw_pixel_at(bx - 1, by - 3, c_gold);
          it.draw_pixel_at(bx - 4, by + 1, c_dim);
          it.draw_pixel_at(bx + 1, by - 5, c_tip);
          it.print(W - 2, by + 30, id(font_sm), c_dim,
                   display::TextAlign::TOP_RIGHT, "chronicle");
        }
        // A pushed announcement answers nothing, so captioning it "heard: -" would
        // be a small lie. Label the provenance instead.
        if (id(is_announce)) {
          it.print(6, SCRL_Y + 2, id(font_sm), c_gold, "a word from the house");
        } else {
          it.print(6, SCRL_Y + 2, id(font_sm), c_dim, "heard");
          if (!id(heard_text).empty()) {
            // The transcript gets 2 lines and an ellipsis if it overruns: you know
            // what you just said, so paging it would cost budget for no information.
            int need = wrap(6, SCRL_Y + 18, id(font_sm), c_ink, id(heard_text),
                            MAXW, 14, 2, 0);
            if (need > 2) {
              // right-aligned LEFT of the tome (2026-08-09, twice): the pager
              // ends at W-52 so it never runs under the chronicle's door.
              it.print(W - 52, SCRL_Y + 32, id(font_sm), c_ash,
                       display::TextAlign::TOP_RIGHT, "...");
            }
          } else {
            it.print(6, SCRL_Y + 18, id(font_sm), c_ash, "-");
          }
        }
        // ---- HEX-NOTCHED DIVIDER (#9 item 4) -- the rule keeps its job, ten cells
        // sit ON it as notches. Pointy-top by the orientation rule at the mode chip:
        // a chain of cells is a FIELD (grille family), not a cap. Vertical extent is
        // +48..+52 -- heard's second line ends at +46 and the reply begins at +58, so
        // the notches clear both. Chrome band: erases and overdraws by design, outside
        // the write-once invariant and the 18,240 px budget. ~50 one-shot runs.
        it.filled_rectangle(6, SCRL_Y + 50, W - 12, 1, c_ash);
        for (int i = 0; i < 10; i++) {
          const int hx = 18 + (i * (W - 36)) / 9;   // 18..222, symmetric over the rule
          for (int dy = -2; dy <= 2; dy++) {
            // half-widths {0,2,2,2,0}: 1px vertices, 5px flats -- pointy-top at this size
            const int hw = (dy == -2 || dy == 2) ? 0 : 2;
            it.horizontal_line(hx - hw, SCRL_Y + 50 + dy, 2 * hw + 1, c_ash);
          }
        }

        // Ember's reply PAGES rather than truncating. JP's framing was that he would
        // rather read it over time than lose it, and paging honours that at a cost
        // that rounds to nothing: one repaint every ${scroll_page_ms_len}ms only while
        // a reply actually overflows. A smooth scroll would need a repaint every
        // 50-100ms, and at 18-22ms per scroll-band paint that is 20-40% of the main
        // loop — it would compete directly with the fire, permanently, for a case that
        // is rare because the persona enforces terseness.
        if (!id(said_text).empty()) {
          const int need = wrap(6, SCRL_Y + 58, bodyf,
                                st == 4 ? c_alarm : c_ink, id(said_text),
                                MAXW, body_pitch, SAID_LINES,
                                id(scroll_page) * SAID_LINES);
          // Publish the page count for the scheduler. Only >1 arms the page timer, so
          // a reply that fits costs exactly what it did before: nothing.
          const int pages = (need + SAID_LINES - 1) / SAID_LINES;
          id(scroll_pages) = pages < 1 ? 1 : pages;
          if (id(scroll_pages) > 1) {
            it.printf(W - 6, SCRL_Y + 134, id(font_sm), c_dim,
                      display::TextAlign::TOP_RIGHT, "%d/%d",
                      id(scroll_page) + 1, id(scroll_pages));
          }
        } else {
          id(scroll_pages) = 1;
        }
      };

      auto paint_telem = [&]() {
        it.filled_rectangle(0, TELE_Y, W, TELE_H, c_bg);
        it.filled_rectangle(0, TELE_Y, W, 1, c_ash);
        if (st == 3) {
          it.printf(6, TELE_Y + 6, id(font_sm), guttering ? c_alarm : c_dim,
                    // Cast at the CALL SITE, not by switching to %lu. uint32_t's
                    // underlying type is implementation-defined, so %lu would be
                    // correct here and wrong on a target where uint32_t is unsigned
                    // int — moving the warning rather than removing it. An explicit
                    // (unsigned) makes the argument match %u on every target.
                    // Harmless on xtensa (both 32-bit); fixed because a STANDING
                    // count of 4 warnings is how a real new one gets missed.
                    "spoken %u.%us / ~%u.%us%s",
                    (unsigned) (spoken_ms / 1000u),
                    (unsigned) ((spoken_ms % 1000u) / 100u),
                    (unsigned) (id(tts_est_ms) / 1000u),
                    (unsigned) ((id(tts_est_ms) % 1000u) / 100u),
                    guttering ? "   BUFFER STALL" : "");
        } else if (id(mic_live)) {
          it.printf(6, TELE_Y + 6, id(font_sm), c_dim, "%.1f dBFS   peak %.1f",
                    id(db_rms), id(db_peak_hold));
        } else {
          it.print(6, TELE_Y + 6, id(font_sm), c_ash, "mic idle (no capture)");
        }
        // ---- THE RAW TOUCH COORDINATE LIVES ON THIS LINE, AND THAT IS THE FIX (#13) ----
        //
        // It was on the FIRST line of this band, inside the `else` of
        // `if (st == 3) … else if (mic_live) … else …`. That branch is unreachable at
        // the moment being measured, so THE INSTRUMENT COULD NOT SPEAK:
        //
        //   tap in normal mode -> ui_action 3 -> talk_begin -> voice_assistant.start
        //   -> the mic runs -> sound_level publishes non-NaN -> mic_live = TRUE
        //
        // within ~150-250 ms of the finger lifting, and it stays true for the rest of
        // the turn. So `else if (mic_live)` claimed the line for the dBFS meter, then
        // `st == 3` claimed it for the spoken/estimate readout, and by the time both
        // released it the 3000 ms window had long expired and the line read
        // "mic idle (no capture)". The band repaints at 2 Hz, so the coordinate was
        // visible for at most ONE frame and only if that 500 ms tick happened to fall
        // inside the sub-second gap before the microphone started — a coin flip, not a
        // measurement. Following the instruction as written ("tap the left edge, tap
        // the right edge, read two numbers") would have shown nothing, and the flash
        // that bought it would have been spent for no datum.
        //
        // THE SECOND LINE HAS NO SUCH CONTENTION. Nothing else writes it, and the whole
        // band sits at y264..319 — below the overlay's y32..263 — so it repaints on the
        // 500 ms telemetry tick in every ui_mode and in every va_state. The coordinate
        // now shows for the full 3 s regardless of what the conversation is doing.
        //
        // The cost is the mode caption for those 3 s, which is static, inferable from
        // the header, and not the thing under measurement.
        //
        // ⚠️ THE ONE PATH THAT DID WORK, recorded so nobody "confirms" the old placement
        // by accident: a tap that CANCELS an in-flight conversation stops the mic, so
        // mic_live goes false and the old line did appear. That is the second tap of a
        // double-tap, and the coordinate it reports is the cancel's, not the one you
        // were aiming to measure.
        //
        // FREE against the frame budget: this band is chrome, not the flame band. It
        // erases and overdraws by design, so it is outside the write-once invariant and
        // outside the 18,240 px/frame budget — one string replaced by another in a band
        // that already repaints.
        if (id(touch_raw_x) >= 0 &&
            (uint32_t) (millis() - id(spark_ms)) < 3000u) {
          it.printf(6, TELE_Y + 24, id(font_sm), c_gold,
                    "tap raw x=%d y=%d  ->  col %d",
                    (int) id(touch_raw_x), (int) id(touch_raw_y),
                    (int) id(spark_col));
        } else
        // print(), not printf() — no format specifiers, so no varargs.
        // ⚠️ WAS "hushed - ember isn't listening", WHICH WOULD NOW BE FALSE. Ember
        // listens in all three modes; only the speaker changes. The line names what is
        // actually true instead, at the one place that already repaints on a timer and
        // costs nothing extra.
        if (id(op_mode) == 1) {
          it.print(6, TELE_Y + 24, id(font_sm), c_gold,
                   "no talking - listening, replies on screen");
        } else if (id(op_mode) == 2) {
          it.print(6, TELE_Y + 24, id(font_sm), c_gold,
                   "hush - listening, silent, on screen");
        } else {
          // Identity, not poetry (2026-08-09): "ember - hearth spirit" told JP
          // nothing he didn't know, while three hearths on one shelf are
          // indistinguishable at a glance. Name + build sigil answers both
          // "which one are you" and "are you running the latest" from across
          // the room. ${sigil_version} is compile-time — see its substitution.
          it.print(6, TELE_Y + 24, id(font_sm), c_ash,
                   "${name} \xC2\xB7 ${sigil_version}");
        }

        // ============ THE HOUSE ROW — what is still awake ============
        //
        // ROW 3 OF THIS BAND, AND IT HAS TO BE ROW 3. TELE is 264..319; rows sit
        // at +6, +24 and +40, and +40 with a 12px font ends at 316 — inside the
        // band by 3px. A FOURTH row at +58 would end at 334 and draw into
        // nothing, which on this display is not a clipped glyph but a violation
        // of the one invariant the banded redraw rests on (nothing may draw
        // outside its own band, and the framebuffer PERSISTS, so the litter
        // would be permanent and would look like ghosting rather than like an
        // overflow). There is no room 4. Anything more goes in an overlay.
        //
        // WHY NOT SHARE +24 with the mode line above: at op_mode 1 or 2 that row
        // is taken, and losing the house indicator exactly when Ember is quiet is
        // backwards — quiet is when you glance at it.
        //
        // FREE, on the same grounds as the line above: this band is chrome, it
        // erases and overdraws by design, and it is outside the flame band's
        // write-once invariant and its 18,240 px/frame budget. Four coals is
        // ~256 px. It also needs NO band of its own, which is the expensive
        // mistake here — see the fuse note in the band geometry block: a 4-row
        // band still consumes a whole frame slot and cost the fire 5fps.
        {
          // Shape, not colour, carries the kind. The palette is one
          // fire-temperature ramp by deliberate design and `alarm` is its only
          // exception, so a cool blue for "cooling" is not available — and the
          // band's own accessibility rule is that no state is ever carried by
          // colour alone. A coal is round, heat rises to a point, a draught is
          // flat. Those read differently in greyscale.
          const int HY = TELE_Y + 40;
          const float rooms_f = id(house_rooms).state;

          if (std::isnan(rooms_f)) {
            // NOT "banked", and the distinction is the whole point: a stale
            // "every hearth banked" claims the house is dark when nothing is
            // known, which is a lie in the one direction that costs money. NaN
            // is also simply the first second of every boot, before HA connects.
            //
            // NaN is reached for the cases that matter: HomeassistantSensor
            // publish_state(NAN)s whatever it cannot parse as a number
            // (homeassistant_sensor.cpp:14-18, verified by reading it), so HA
            // reporting `unavailable` — upstream sensor missing, template
            // reloading, entity renamed — lands here. Observed live on the
            // 2026-08-03 bring-up during a template.reload.
            //
            // ⚠️ KNOWN GAP, DELIBERATELY NOT PAPERED OVER: a full API
            // disconnection pushes nothing at all, so the last value simply
            // persists and this row keeps showing a count that may be minutes
            // stale. It is NOT detectable from here without lying: the obvious
            // guard is "is an API client connected", and this file already
            // records that on_client_connected fires for ANY client including
            // the esphome CLI (see the api: block), so `esphome logs` alone
            // would satisfy it with HA absent. A guard that reads as a
            // freshness check while actually testing something else is worse
            // than the staleness it hides. If this ever needs closing, the
            // honest signal is a heartbeat FROM HA — a value that changes on a
            // timer, so absence of change is absence of HA — not a local
            // connection flag.
            it.print(6, HY, id(font_sm), c_dim, "hearths unknown");
          } else if ((int) rooms_f <= 0) {
            it.print(6, HY, id(font_sm), c_ash, "~ every hearth banked ~");
          } else {
            // ---- a coal per lit room, at most four, then "+N" ----
            const int lit  = std::isnan(id(house_lights).state)
                             ? 0 : (int) id(house_lights).state;
            const int cool = std::isnan(id(house_cooling).state)
                             ? 0 : (int) id(house_cooling).state;
            const int heat = std::isnan(id(house_heating).state)
                             ? 0 : (int) id(house_heating).state;
            const int shown = lit > 4 ? 4 : lit;
            int x = 8;

            for (int i = 0; i < shown; i++) {
              // BREATHING PERIOD IS SET BY THE BAND ROTATION, NOT BY TASTE. One
              // band repaints per frame at 50ms, so this row is redrawn about
              // every 200ms — 5fps. A short pulse would read as a stutter; at
              // 3500ms it reads as a breath. The 800ms per-coal offset keeps
              // them out of phase so they look like separate fires rather than
              // one blinking row.
              const float ph = (float) ((now + (uint32_t) i * 800u) % 3500u)
                               / 3500.0f;
              const float br = 0.58f + 0.42f * (0.5f + 0.5f * sinf(ph * 6.28319f));
              Color coal = Color(
                (uint8_t) (c_ember.r + (c_gold.r - c_ember.r) * br),
                (uint8_t) (c_ember.g + (c_gold.g - c_ember.g) * br),
                (uint8_t) (c_ember.b + (c_gold.b - c_ember.b) * br));
              it.filled_circle(x + 3, HY + 6, 3, coal);
              x += 10;
            }
            if (lit > 4) {
              it.printf(x, HY, id(font_sm), c_dim, "+%d", lit - 4);
              x += 18;
            }

            // ---- heat rises to a point: a 5px flame, one per heating zone ----
            for (int i = 0; i < (heat > 2 ? 2 : heat); i++) {
              it.horizontal_line(x,     HY + 10, 5, c_amber);
              it.horizontal_line(x + 1, HY + 8,  3, c_amber);
              it.horizontal_line(x + 2, HY + 6,  1, c_gold);
              x += 8;
            }
            // ---- a draught is flat: three stacked bars per cooling zone ----
            for (int i = 0; i < (cool > 2 ? 2 : cool); i++) {
              it.horizontal_line(x,     HY + 4,  5, c_dim);
              it.horizontal_line(x + 1, HY + 7,  4, c_ash);
              it.horizontal_line(x,     HY + 10, 5, c_dim);
              x += 8;
            }

            // ---- the room names, measured rather than guessed ----
            // get_text_bounds so a long list is dropped instead of running off
            // the panel. The template sensor has already capped it at four names
            // plus "+N", so this is the belt to that braces: a room called
            // something very long can still overrun, and silently printing off
            // the right edge is how you get litter in a persistent framebuffer.
            const std::string &nm = id(house_names).state;
            if (!nm.empty()) {
              int tx = 0, ty = 0, tw = 0, th = 0;
              it.get_text_bounds(0, 0, nm.c_str(), id(font_sm),
                                 TextAlign::TOP_LEFT, &tx, &ty, &tw, &th);
              if (x + 4 + tw <= W - 4) {
                it.print(x + 4, HY, id(font_sm), c_dim, nm.c_str());
              } else {
                it.printf(x + 4, HY, id(font_sm), c_dim, "%d rooms", (int) rooms_f);
              }
            }
          }
        }

        // ============ THE HORN — the intercom button ============
        //
        // Bottom-right block of this band (the ui_ic_* pair; the hit-test in
        // on_touch uses the same substitutions, which is the whole point).
        // Normal mode ONLY: in overlays the corner is tap-away-dismiss, and a
        // control that is not tappable must not be drawn.
        //
        // Free for the same reason as every row above: this band is chrome, it
        // erases and overdraws by design. ~40 small primitives, well inside the
        // band's budget.
        //
        // Press feedback: the curl brightens ember->gold for 400ms after ic_ms
        // (stamped by the hit-test) — feedback comes from the thing you
        // touched, the rule that keeps this branch from striking a coal.
        if (id(ui_mode) == 0) {
          const bool horn_lit = id(ic_ms) != 0 &&
                                (uint32_t) (now - id(ic_ms)) < 400u;
          const Color h_body = horn_lit ? c_gold  : c_ember;
          const Color h_rim  = horn_lit ? c_amber : c_dim;
          const int hcx = ${ui_ic_x} + 24;   // curl centre
          const int hcy = ${ui_ic_y} + 28;
          // The curl: mouthpiece upper-left, sweeping under and up to the bell
          // at upper-right, thickening as it goes — a hunting horn, not a snake.
          for (int i = 0; i <= 10; i++) {
            const float t = (float) i / 10.0f;
            const float a = (200.0f - 180.0f * t) * 0.0174533f;
            const int px = hcx + (int) (13.0f * cosf(a));
            const int py = hcy + (int) (10.0f * sinf(a));
            it.filled_circle(px, py, 1 + (int) (2.2f * t + 0.5f), h_body);
          }
          // Labelled (JP, 2026-08-09): a control whose meaning needs the help
          // book has failed at being a control. Small, dim, lit with the glyph.
          it.print(${ui_ic_x} + 34, ${ui_ic_y} + 42, id(font_sm),
                   horn_lit ? c_amber : c_dim,
                   display::TextAlign::TOP_CENTER, "horn");
          // The bell: an open ring past the curl's end, where the sound leaves.
          {
            const float ab = 20.0f * 0.0174533f;
            const int bx = hcx + (int) (13.0f * cosf(ab));
            const int by = hcy + (int) (10.0f * sinf(ab));
            it.circle(bx, by, 5, h_rim);
          }
        }
      };

      // ---------------------- THE MODAL OVERLAY ----------------------
      // ONE-SHOT ONLY. Repainted when ui_gen changes (a human tap, so >=150ms
      // apart) and never on a timer, so it is not an animation and does not
      // compete with the fire for frame slots.
      //
      // Region it owns:
      //   volume  y32..187  (156 rows, == the SCROLL band)          ~18-22 ms
      //   power   y32..263  (232 rows, == SCROLL + FLAME)           ~27-32 ms
      //
      // The volume overlay deliberately does NOT cover the flame band: the main
      // reason to reach for volume is that Ember is too loud RIGHT NOW, so she
      // should still be visibly burning and talking while you adjust her. The
      // power menu does cover it, and suspends the fire, because you are about to
      // restart or sleep the thing.
      auto paint_overlay = [&]() {
        const int OY = ${ui_oy};
        // Mode 1 grew into the flame band when mic gain joined it — two controls with
        // touch-sized targets do not fit in SCRL_H alone. See the fire branch below: no
        // overlay keeps the fire alive any more, because they all draw over where the
        // fire would be.
        //
        // ⚠️ EVERY OVERLAY IS NOW FULL HEIGHT, AND THE MODE SUBMENU USED TO BE SHORT (#39).
        // It was `(ui_mode == 3) ? SCRL_H : (SCRL_H + FLAM_H)`, i.e. a background of
        // y32..187 — and its rows are drawn at ui_pm_iy + i * ui_pm_ih = 72/118/164, so
        // row 2's highlight runs to y207. TWO defects, and the second is the one I missed
        // when I filed it:
        //
        //   1. row 2 painted ~20px PAST its own background. Benign in isolation.
        //   2. NOTHING painted y208..263 at all. Entering mode 3 (ui_action 5) does not
        //      set force_full_repaint, and the scheduler's `ui_mode != 0` branch drops the
        //      scroll band and never reaches the fire — so that strip kept whatever the
        //      flame band last drew. The menu sat above ~56 rows of FROZEN FIRE, with
        //      row 2's highlight overlapping its top 20. Not latent: visible whenever the
        //      submenu was open, and worst on the row you were most likely to select.
        //
        // The background is now defined by the region the overlay OWNS rather than by the
        // rows that happen to fit in it. Deriving a height from the row count was the
        // other option and it is worse: it would put a FOURTH encoding of "3 rows" beside
        // the paint loop, the names[] extent and the tap hit-test, and those three
        // disagreeing is precisely what check_navigability.py exists to catch. This
        // removes a conditional instead of adding a constant, and it cannot go stale if a
        // row is added or removed.
        //
        // Costs one background fill: ~232 rows instead of ~156, so ~27-32ms rather than
        // ~18-22ms. This is a ONE-SHOT repaint on ui_gen change — human-paced, >=150ms
        // apart — not an animation, and mode 2 has always paid it.
        const int OH = SCRL_H + FLAM_H;
        // #39's GUARD, so this cannot come back. The tallest menu is the power menu at
        // ui_pm_n rows; the mode submenu has fewer, so bounding the larger bounds both.
        // Last row's last pixel is ui_pm_iy + n*ui_pm_ih - 3 (the highlight is
        // ui_pm_ih - 2 tall), and the background's last row is OY + OH - 1.
        //
        // It fires: set ui_pm_n to 6 and the build stops with this message rather than
        // silently drawing a menu row onto pixels nobody owns. Checked that way rather
        // than assumed — an assert nobody has seen fail is not a guard.
        static_assert(${ui_pm_iy} + ${ui_pm_n} * ${ui_pm_ih} - 3 <= ${ui_oy} + SCRL_H + FLAM_H - 1,
            "A menu row is drawn below the overlay background. Either the row count, the "
            "row pitch or ui_pm_iy has outgrown the overlay: the background must cover "
            "what is drawn on it, not the reverse. Do not fix this by shortening a row.");
        it.filled_rectangle(0, OY, W, OH, c_bg);
        it.filled_rectangle(0, OY, W, 1, c_ash);

        if (id(ui_mode) == 1) {
          // TWO CONTROLS, ONE CODE PATH. JP: "it can be in the single press menu along
          // with volume." They are drawn by one lambda rather than two copies, because a
          // second hand-written copy of a layout is the same hazard as a second copy of a
          // geometry: they agree until one is edited, and nothing notices. The pair reads
          // as "how loudly it speaks / how well it hears".
          const int vol  = (int) (id(spk_volume).state + 0.5f);
          const int gain = (int) (id(mic_gain_num).state + 0.5f);

          // The value string is rendered by the CALLER and passed in, so no format string
          // ever reaches printf as a variable. That is not fussiness: -Wformat-nonliteral
          // would fire, and the standing warning count on this file was just taken from 4
          // to 0. A warning budget only works while it is zero.
          //
          // THREE ROWS NOW (2026-08-09: brightness joined — JP: "that should be
          // on the volume menu"), so the layout went compact: the -/+ boxes sit
          // BESIDE the stones on one 46px control line instead of on their own
          // band below. Same one-lambda rule as when there were two: a third
          // hand-written copy would be the same drift hazard as the second.
          auto row = [&](int ly, int by, const char *val, const char *sub,
                         int n_st, int sw, int lit, bool can_dn, bool can_up) {
            // font_body since the fourth row (2026-08-09): the label gap is
            // 18px now and font_hdr's 18pt descends into the control boxes.
            it.print(6, ly, id(font_body), c_tip, val);
            it.print(W - 6, ly + 5, id(font_sm), c_dim,
                     display::TextAlign::TOP_RIGHT, sub);
            const int bh = ${ui_vol_bh};
            // -/+ boxes flank the stones: 70px wide (~12.9mm), full 46px tall.
            // The HIT band is the full 240px split at x120 (see on_touch), so
            // the drawn box is a picture inside a larger target, never smaller.
            it.rectangle(4, by, 70, bh, c_dim);
            it.filled_rectangle(22, by + bh / 2 - 2, 34, 5, can_dn ? c_ink : c_ash);
            it.rectangle(166, by, 70, bh, c_dim);
            it.filled_rectangle(184, by + bh / 2 - 2, 34, 5, can_up ? c_ink : c_ash);
            it.filled_rectangle(198, by + bh / 2 - 16, 5, 33, can_up ? c_ink : c_ash);
            // Hearth stones between the boxes: the level readout that belongs
            // to the metaphor. Lit ones climb the fire ramp. sw is per-row so
            // each row's stone count can BE its hardware resolution.
            const int sg = 2, sh = 24, sy = by + (bh - 24) / 2;
            const int span = n_st * (sw + sg) - sg;
            const int sx0 = 78 + (84 - span) / 2;
            for (int i = 0; i < n_st; i++) {
              Color c = c_ash;
              if (i < lit) {
                float t = (float) i / (float) (n_st - 1);
                c = (t < 0.45f) ? c_ember : (t < 0.78f) ? c_amber : c_gold;
              }
              it.filled_rectangle(sx0 + i * (sw + sg), sy, sw, sh, c);
            }
          };

          const int bri = (int) (id(backlight).remote_values.get_brightness() * 100.0f + 0.5f);
          char vbuf[12], gbuf[12], bbuf[12];
          snprintf(vbuf, sizeof vbuf, "%d%%", vol);
          snprintf(gbuf, sizeof gbuf, "%ddB", gain);
          snprintf(bbuf, sizeof bbuf, "%d%%", bri);

          // Stones per row = that control's real resolution: volume steps 5%
          // (20 stones, thin), the ES8311 PGA has exactly eight settings (8),
          // brightness steps 10% with a 10% floor (10 — the floor because a
          // 0% screen is indistinguishable from a dead one, and BANKING is how
          // the screen goes dark on purpose), and the reading font has three
          // baked rungs (3 — bitmaps don't scale; see the font: block).
          const int fsc = id(font_scale) <= 0 ? 0 : (id(font_scale) >= 2 ? 2 : id(font_scale));
          const char *fs_names[3] = {"small", "medium", "large"};
          row(${ui_vol_by} - 18,  ${ui_vol_by},  vbuf, "how loudly ember speaks",
              20, 3, vol / 5,      vol > 0,  vol < 100);
          row(${ui_gain_by} - 18, ${ui_gain_by}, gbuf, "how well ember hears",
              8,  8, gain / 6 + 1, gain > 0, gain < 42);
          row(${ui_bri_by} - 18,  ${ui_bri_by},  bbuf, "how brightly the hearth glows",
              10, 6, bri / 10,     bri > 10, bri < 100);
          row(${ui_font_by} - 18, ${ui_font_by}, fs_names[fsc],
              "how large her words read",
              3, 26, fsc + 1,      fsc > 0,  fsc < 2);

        } else if (id(ui_mode) == 3) {
          it.print(6, OY + 4, id(font_hdr), c_gold, "MODE");
          // ⚠️ WAS "tap away to leave", WHICH PROMISED TOUCH IN THE ONE MENU THAT MUST
          // NOT NEED IT. Tapping away does still work, but this menu exists because
          // recovering the device must not require the touchscreen, so the caption now
          // names the BUTTON escape — and it names the one that is true right now, which
          // is why it is a conditional rather than one string. `hold` is the long press
          // that activates everywhere else in this UI, so the verb is already learned.
          //
          // Kept short deliberately: this is TOP_RIGHT-aligned against the MODE header
          // in font_hdr on a 240px band, and a caption that wraps or collides is worse
          // than a terse one. The full explanation lives at the cursor branch, not on
          // screen. (Header named without quotes on purpose — check_navigability.py
          // locates the paint branches by the header's CALL, and quoted prose about a
          // string literal has broken a search three times in this repo today.)
          it.print(W - 6, OY + 9, id(font_sm), c_dim, display::TextAlign::TOP_RIGHT,
                   (id(ui_sel) < 0) ? "hold to leave" : "hold to set");
          // Quietest last, matching sel_mode's option order — so the row index IS the
          // mode value and no mapping exists at the tap site.
          const char *names[3] = {"Normal", "No talking", "Hush"};
          const char *subs[3]  = {"speaks and chimes",
                                  "replies on screen - chimes still ring",
                                  "silent - replies on screen"};
          for (int i = 0; i < 3; i++) {
            const int iy = ${ui_pm_iy} + i * ${ui_pm_ih};
            const bool sel = (id(ui_sel) == i);
            const bool cur = ((int) id(op_mode) == i);
            if (sel) {
              it.filled_rectangle(0, iy, W, ${ui_pm_ih} - 2, c_ash);
              it.filled_rectangle(0, iy, 4, ${ui_pm_ih} - 2, accent);
            } else {
              it.filled_rectangle(0, iy + ${ui_pm_ih} - 3, W, 1, c_ash);
            }
            it.print(12, iy + 4, id(font_body), cur ? c_gold : c_ink, names[i]);
            it.print(12, iy + 22, id(font_sm), c_dim, subs[i]);
            if (cur) {
              it.print(W - 8, iy + 8, id(font_sm), c_gold,
                       display::TextAlign::TOP_RIGHT, "NOW");
            }
          }
        } else if (id(ui_mode) == 2) {
          // Was the chain's bare `else` until the chronicle (modes 4/5) joined
          // the chain below — a fallback can't be chained past, so the power
          // menu now names its mode like every other branch.
          it.print(6, OY + 4, id(font_hdr), c_gold, "THE HEARTH");
          it.print(W - 34, OY + 9, id(font_sm), c_dim,
                   display::TextAlign::TOP_RIGHT, "tap away to leave");
          // The help badge (2026-08-09, JP: "a help screen in the boot menu").
          // A drawn, tappable ? in the title strip — the one place every user
          // already visits. Hit zone in the mode-2 touch test, same pairing
          // rule as every drawn control.
          it.circle(W - 17, OY + 14, 11, c_gold);
          it.print(W - 17, OY + 6, id(font_body), c_gold,
                   display::TextAlign::TOP_CENTER, "?");

          // Order is least-destructive-first, deliberately: the BOOT-only path
          // advances a cursor through these in order, so "Rekindle" is last and
          // cannot be reached by accident before three harmless options.
          // "Hush the mic" is GONE as a row label, and deliberately: it described
          // behaviour that no longer exists. Hush does not stop the mic.
          const char *names[5] = {"Mode", "Bank the fire",
                                  "Rouse the touch sensor", "Douse the hearth",
                                  "Rekindle"};
          const char *subs[5]  = {(id(op_mode) == 0) ? "normal - speaks and chimes"
                                : (id(op_mode) == 1) ? "no talking - on screen"
                                                     : "hush - silent",
                                  "screen off - touch to wake",
                                  "reset the touch controller",
                                  "deep sleep - the button wakes her",
                                  "restart ember"};
          for (int i = 0; i < ${ui_pm_n}; i++) {
            const int iy = ${ui_pm_iy} + i * ${ui_pm_ih};
            const bool sel = (id(ui_sel) == i);
            // Rekindle stays the one ALARM row; Douse is amber — it makes the
            // hearth unreachable-until-pressed, which deserves a colour but
            // not the same one as "restart everything".
            const Color fg = (i == 4) ? c_alarm : (i == 3) ? c_amber : c_ink;
            if (sel) {
              it.filled_rectangle(0, iy, W, ${ui_pm_ih} - 2, c_ash);
              it.filled_rectangle(0, iy, 4, ${ui_pm_ih} - 2, accent);
            } else {
              it.filled_rectangle(0, iy + ${ui_pm_ih} - 3, W, 1, c_ash);
            }
            it.print(12, iy + 4, id(font_body), fg, names[i]);
            it.print(12, iy + 22, id(font_sm), c_dim, subs[i]);
            // Row 0 is a submenu now, not a toggle, so it gets a disclosure caret
            // rather than an ON badge.
            if (i == 0) {
              it.print(W - 8, iy + 8, id(font_sm), c_dim,
                       display::TextAlign::TOP_RIGHT, ">");
            }
          }
        } else if (id(ui_mode) == 4) {
          // ---- THE CHRONICLE, the list ----
          // Newest first: page 0 row 0 is the last thing that happened, which
          // is the thing you opened this to find. Four rows at the same 46px
          // floor every menu row uses; page bar across the bottom; the title
          // strip is tap-away. Full-height background like every overlay
          // since #39 — no strip of frozen fire behind the pages.
          it.filled_rectangle(0, OY, W, SCRL_H + FLAM_H, c_bg);
          const int n = (int) id(chron).size();
          const int pages = n == 0 ? 1 : (n + 2) / 3;
          if (id(chron_page) > pages - 1) id(chron_page) = pages - 1;
          it.print(6, OY + 2, id(font_sm), c_gold, "the chronicle");
          it.printf(W - 6, OY + 2, id(font_sm), c_dim,
                    display::TextAlign::TOP_RIGHT, "%d held", n);
          if (n == 0) {
            // Volatile ring, honest face: an empty chronicle after a reboot
            // must say "nothing YET", never imply the house has been silent.
            it.print(6, OY + 34, id(font_body), c_dim, "nothing yet this waking");
          }
          for (int row = 0; row < 3; row++) {
            const int idx = n - 1 - (id(chron_page) * 3 + row);
            if (idx < 0) break;
            const int iy = 50 + row * 56;
            const std::string &e = id(chron)[(size_t) idx];
            const char k = e[0];
            // The kind is DRAWN, not labelled: a flame said it, an open ear
            // heard it, a horn pushed it. Same shape-not-colour rule as the
            // bands, and the same glyph family the house row speaks.
            if (k == 's') {
              it.horizontal_line(8, iy + 18, 9, c_amber);
              it.horizontal_line(10, iy + 14, 6, c_amber);
              it.horizontal_line(12, iy + 10, 2, c_gold);
            } else if (k == 'h') {
              it.circle(12, iy + 14, 6, c_dim);
              it.filled_rectangle(13, iy + 7, 8, 15, c_bg);
              it.filled_rectangle(12, iy + 12, 2, 5, c_dim);
            } else {
              it.horizontal_line(7, iy + 14, 4, c_dim);
              it.horizontal_line(11, iy + 12, 3, c_dim);
              it.horizontal_line(11, iy + 16, 3, c_dim);
              it.horizontal_line(14, iy + 10, 2, c_gold);
              it.horizontal_line(14, iy + 18, 2, c_gold);
            }
            // Two preview lines, clipped by CHARACTER COUNT rather than
            // measured — a preview may tear mid-word, and that is fine in a
            // list whose whole job is "tap to read properly". Measuring both
            // lines of four rows every repaint is cost with no reader.
            const std::string t = e.substr(1);
            it.print(26, iy + 5, id(font_sm), c_ink, t.substr(0, 30).c_str());
            if (t.size() > 30) {
              std::string l2 = t.substr(30, 30);
              if (t.size() > 60) { l2.resize(27); l2 += "..."; }
              it.print(26, iy + 25, id(font_sm), c_dim, l2.c_str());
            }
            // A little picture on rows whose entry carries one (2026-08-24
            // evening — JP: "a little thumbnail so i know which messages
            // have photos right away". This is a drawn pictogram, bold
            // enough to read across the room: gold frame, amber hills, a
            // tip-white sun. Real fetched mini-thumbnails are the v3 if
            // this doesn't satisfy — three more online_image buffers.)
            if (idx < (int) id(chron_img).size() &&
                !id(chron_img)[(size_t) idx].empty()) {
              it.filled_rectangle(W - 30, iy + 32, 24, 18, c_bg);
              it.rectangle(W - 30, iy + 32, 24, 18, c_gold);
              it.rectangle(W - 29, iy + 33, 22, 16, c_gold);
              it.filled_rectangle(W - 26, iy + 42, 8, 6, c_amber);
              it.filled_rectangle(W - 17, iy + 38, 9, 10, c_amber);
              it.draw_pixel_at(W - 24, iy + 36, c_tip);
              it.draw_pixel_at(W - 23, iy + 36, c_tip);
              it.draw_pixel_at(W - 24, iy + 37, c_tip);
            }
            it.filled_rectangle(0, iy + 54, W, 1, c_ash);
          }
          // The page bar, grown to the 46px touch floor (JP). "older" sits
          // LEFT deliberately: the list reads newest-down, so older is where
          // your eye already ended up.
          it.filled_rectangle(0, 216, W, 1, c_ash);
          if (id(chron_page) < pages - 1) {
            it.rectangle(4, 220, 112, 40, c_dim);
            it.print(60, 232, id(font_body), c_ink,
                     display::TextAlign::TOP_CENTER, "< older");
          }
          if (id(chron_page) > 0) {
            it.rectangle(124, 220, 112, 40, c_dim);
            it.print(180, 232, id(font_body), c_ink,
                     display::TextAlign::TOP_CENTER, "newer >");
          }
          it.printf(W / 2, 219, id(font_sm), c_ash,
                    display::TextAlign::TOP_CENTER, "%d/%d",
                    id(chron_page) + 1, pages);
        } else if (id(ui_mode) == 5) {
          // ---- THE CHRONICLE, one entry, with the voice following along ----
          it.filled_rectangle(0, OY, W, SCRL_H + FLAM_H, c_bg);
          const int n = (int) id(chron).size();
          if (id(chron_sel) < 0 || id(chron_sel) >= n) {
            it.print(6, OY + 2, id(font_sm), c_gold, "the chronicle");
            it.print(6, OY + 34, id(font_body), c_dim, "that page has burned away");
          } else {
            const std::string &e = id(chron)[(size_t) id(chron_sel)];
            const char k = e[0];
            it.print(6, OY + 2, id(font_sm), c_gold,
                     k == 'h' ? "heard" : (k == 'a' ? "a word from the house"
                                                    : "ember said"));
            // The entry carries an image: a little frame top-right, the
            // drawn licence for "tap the words to open the vision" (the
            // mode-5 hit-test only arms 37 when this is drawn).
            if (id(chron_sel) < (int) id(chron_img).size() &&
                !id(chron_img)[(size_t) id(chron_sel)].empty()) {
              it.rectangle(W - 26, OY + 2, 20, 15, c_gold);
              it.filled_rectangle(W - 22, OY + 10, 5, 4, c_amber);   // hill
              it.filled_rectangle(W - 15, OY + 7, 6, 7, c_amber);    // hill
              it.draw_pixel_at(W - 20, OY + 5, c_tip);               // sun
            }
            const std::string t = e.substr(1);
            // KARAOKE BY THE FUSE'S OWN ESTIMATOR. Word timings do not exist
            // in this pipeline; what does exist is the bench-calibrated
            // tts_lead_ms + chars * tts_ms_per_char model the progress fuse
            // has been landing within a beat of real speech for weeks. The
            // clock is re-anchored at actual TTS start (see on_tts_start), so
            // the estimate only has to hold across one utterance, which is
            // exactly the span it was calibrated on.
            const bool playing = (id(chron_play_idx) == id(chron_sel));
            const uint32_t el = playing ? (uint32_t)(millis() - id(chron_play_ms)) : 0u;
            const uint32_t total = ${tts_lead_ms}u
                                   + (uint32_t) t.size() * ${tts_ms_per_char}u;
            if (playing && el > total + 1200u) id(chron_play_idx) = -1;
            const long lit = (playing && el > ${tts_lead_ms}u)
                ? (long) ((el - ${tts_lead_ms}u) / ${tts_ms_per_char}u) : -1L;
            // Words laid greedily, each measured — this is the one screen
            // where per-word cost is fine, because the overlay suspends the
            // fire and owns every frame slot it takes.
            int x = 6, y = OY + 22;
            size_t pos = 0;
            while (pos < t.size() && y < 224) {
              size_t sp = t.find(' ', pos);
              if (sp == std::string::npos) sp = t.size();
              const std::string w = t.substr(pos, sp - pos);
              int bx, by, bw, bh;
              it.get_text_bounds(0, 0, (w + " ").c_str(), bodyf,
                                 display::TextAlign::TOP_LEFT, &bx, &by, &bw, &bh);
              if (x + bw > W - 6) { x = 6; y += body_pitch + 2; if (y >= 224) break; }
              // Spoken words settle to ink, the word under the voice burns
              // gold, the unspoken wait in dim — read order is fire order.
              Color wc = c_ink;
              if (playing) {
                if (lit < (long) pos) wc = c_dim;
                else if (lit < (long) sp) wc = c_gold;
              }
              it.print(x, y, bodyf, wc, w.c_str());
              x += bw;
              pos = sp + 1;
            }
            if (pos < t.size())
              it.print(6, 224, id(font_sm), c_ash, "...");
            it.filled_rectangle(0, 233, W, 1, c_ash);
            it.print(6, 240, id(font_body), c_dim, "< back");
            // reply: gold when the entry KNOWS its Slack conversation, dim
            // when it will ride the bridge's last-announced fallback.
            const bool has_chan = id(chron_sel) < (int) id(chron_chan).size()
                                  && !id(chron_chan)[(size_t) id(chron_sel)].empty();
            it.print(120, 240, id(font_body), has_chan ? c_gold : c_dim,
                     display::TextAlign::TOP_CENTER, "reply");
            it.print(W - 6, 240, id(font_body), playing ? c_gold : c_amber,
                     display::TextAlign::TOP_RIGHT,
                     playing ? "speaking..." : "speak >");
          }
        } else if (id(ui_mode) == 6) {
          // ---- THE HELP BOOK (JP: "all teh sweet features and guides iwth
          // little screenshoits and stuff") ----
          // The "screenshots" are drawn miniatures — the device cannot capture
          // its own framebuffer, but every feature's glyph can be redrawn small
          // and true, which beats a bitmap that goes stale the day the real
          // screen changes. Five pages, corner-paged like the chronicle,
          // tap-away returns to the power menu it came from.
          it.filled_rectangle(0, OY, W, SCRL_H + FLAM_H, c_bg);
          const int hp = id(help_page);
          it.printf(W - 6, OY + 2, id(font_sm), c_ash,
                    display::TextAlign::TOP_RIGHT, "%d/5", hp + 1);
          if (hp == 0) {
            it.print(6, OY + 2, id(font_sm), c_gold, "speaking with ember");
            it.print(6, OY + 24, id(font_body), c_ink, "tap the wyrm in her fire-ring");
            it.print(6, OY + 44, id(font_body), c_ink, "or say \"okay nabu\"");
            // a mini hearth: coals and two flames
            it.filled_rectangle(60, OY + 96, 120, 8, c_bed);
            it.filled_rectangle(88, OY + 78, 10, 18, c_ember);
            it.filled_rectangle(120, OY + 70, 12, 26, c_amber);
            it.draw_pixel_at(125, OY + 66, c_gold);
            it.print(120, OY + 116, id(font_sm), c_dim,
                     display::TextAlign::TOP_CENTER, "the fire is her face:");
            it.print(120, OY + 132, id(font_sm), c_dim,
                     display::TextAlign::TOP_CENTER, "amber listens, gold speaks,");
            it.print(120, OY + 148, id(font_sm), c_dim,
                     display::TextAlign::TOP_CENTER, "banked means asleep");
          } else if (hp == 1) {
            it.print(6, OY + 2, id(font_sm), c_gold, "the mode chip");
            it.print(6, OY + 24, id(font_body), c_ink, "tap the hex, top-left,");
            it.print(6, OY + 44, id(font_body), c_ink, "to cycle her voice:");
            // three mini flat-top hexes: full / half / empty
            const char *lbl[3] = {"speaks", "screen only", "hush"};
