########################################################################
# ember-dad — the hearth at Dad's house, 2026-08-09
#
# SAME BOARD, SAME FIRMWARE, DIFFERENT IDENTITY — the third body of the one
# persona, and the second proof that ember-mobile.yaml's wrapper argument was
# right: nothing here but identity and its own OTA credential. Every pin,
# lambda, and flame constant is ember-satellite.yaml, included as a package.
# If you are about to add a hardware substitution to this file, the difference
# belongs in the shared config behind a substitution — read the sermon at the
# top of ember-mobile.yaml first.
#
# ⚠️ THE NAME IS LOAD-BEARING IN THREE PLACES AT ONCE — mDNS hostname
# (ember-dad.local), native-API identity, and the prefix of every HA entity
# (assist_satellite.ember_dad_assist_satellite is what the Slack bridge's
# `dads_ember` alias points at — see ~/Projects/ha/docs/slack-bridge.md).
# Renaming after adoption orphans the entities. Decided once: ember-dad.
#
# ⚠️ CORRECTED 2026-08-09 (JP: "his is mobile too and has a battery already"):
# this comment shipped saying MAINS-POWERED, and it was wrong about the
# hardware — a wrong claim that quietly cost this board its entire battery
# ladder: no candle, no SOC entity, no guttering chime, no critical alarm. On
# the one hearth that lives in ANOTHER HOUSE, that is precisely the
# 2.508V-with-nobody-watching failure the ladder was built after. Same genre
# as verification.md §32: a confident wrong line beats no line at all.
#
# It is a MOBILE build: one 18650 behind the board. has_battery turns the
# whole ladder on; the SOC sensor below exposes it to HA (entity id derives
# from the device name: sensor.ember_dad_battery_soc), and
# ember_battery_watch.yaml carries this hearth's critical alarm.
#
# ⛔ Same cell warning as the mobile unit: if that 18650 has no 1S protection
# strip fitted, it is required equipment — the regulator floor and the
# divider's 9µA drain do not care whose house the board is in.
#
# DEPLOYMENT TARGET is Dad's house behind the south-dads realm AP, on the
# same `jplovescl` SSID baked in via secrets. Until it ships it lives on the
# bench — ⚠️ in earshot of the desk unit, and BOTH run on-device "Okay Nabu"
# at wake_word_mode 1, so both will wake and both will answer. That is a
# property of two satellites in one room, not a fault (mobile wrapper,
# same warning).
#
# FIRST FLASH MUST BE OVER USB. This board is 28:84:85:44:3E:A4 — same
# production batch as desk (…44:59:20) and mobile (…44:3E:C4), so check the
# MAC, never the port number: the USB-JTAG serial *is* the MAC.
#
#   udevadm info -q property -n /dev/ttyACMx | grep ID_SERIAL_SHORT
#   esphome compile ember-dad.yaml
#   esphome run     ember-dad.yaml --device \
#     /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_28:84:85:44:3E:A4-if00
########################################################################

substitutions:
  name: ember-dad
  friendly_name: Ember Dad
  # Its OWN OTA credential — the guard that turns "I typed the wrong --device"
  # into an authentication failure instead of a renamed board with orphaned
  # HA entities. Vault mirror: bw item `ember-ota-dad`.
  ota_password: !secret ota_password_dad

  # The chronicle's SPEAK replays through THIS hearth. Without this override the
  # shared default aims at the desk unit — which lives in a DIFFERENT HOUSE from
  # this board. A replay tapped at Dad's would have spoken at JP's desk: the
  # cross-household variant of exactly what the ember_announce_all exclusion
  # note warns about, caught here before first flash with the chronicle aboard.
  satellite_entity: assist_satellite.ember_dad_assist_satellite

  # THIS BOARD HAS THE CELL — see the corrected header. Candle, SOC, chime.
  has_battery: "1"

# The SOC entity, wrapper-level for the same reason as ember-mobile: only a
# board with a real cell may publish this number. HA sees
# sensor.ember_dad_battery_soc; ember_battery_watch.yaml alarms on it.
sensor:
  - platform: template
    name: Battery SOC
    id: batt_soc_sensor
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(batt_soc) < 0 ? NAN : (float) id(batt_soc);'

packages:
  # The entire hearth, adopted wholesale — the desk unit's firmware, renamed.
  # Wake word inherited at mode 1 (on-device microWakeWord, "Okay Nabu"),
  # deliberately not overridden; rollback recipe lives in the mobile wrapper.
  hearth: !include ember-satellite.yaml
